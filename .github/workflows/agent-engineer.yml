name: engineer-agent

on:
  # schedule:
  #   - cron: "6 11 * * 2,4" # 7:06 AM ET Tue+Thu — uncomment only after a supervised smoke run
  workflow_dispatch:
    inputs:
      owner_instructions:
        description: "Owner instructions for this run (binding for this run)"
        required: false
        default: ""

permissions:
  actions: read # gh run list: a seat reads its own runs (ADR-037)
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BOARD_API_URL: ${{ secrets.BOARD_API_URL }}
      BOARD_RUNTIME_TOKEN: ${{ secrets.BOARD_RUNTIME_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are Atelier's engineer seat, running in GitHub Actions with
            this repository checked out. Read prompts/engineer-agent.md; it is
            your full charter. Within your first turns, create a branch
            named by your charter's branch convention and open a DRAFT pull request with
            `gh pr create --draft`, committing into it as you work — a died
            run must still ship its partial work. Open exactly one PR. Never
            merge your own PR except under docs/standards/pm.md §10 Tier A, never push to main, never touch secrets,
            never edit charters. If the charter file is missing, stop and
            fail loudly instead of improvising.
            Owner instructions for this dispatch, binding for this run
            (empty on scheduled runs):
            ${{ inputs.owner_instructions }}
          claude_args: "--max-turns 200 --permission-mode bypassPermissions --model claude-opus-5"
      # Incident 3 (docs/agents/incidents.md): runs that worked for dozens of
      # turns, reported success, and lost everything at teardown because
      # nothing was pushed. A green conclusion is not evidence of shipping.
      - name: No-ship tripwire
        if: always()
        run: |
          git fetch origin --quiet 2>/dev/null || true
          branch=$(git rev-parse --abbrev-ref HEAD)
          dirty=$(git status --porcelain)
          pushed=$(git branch -r --contains HEAD 2>/dev/null | tr -d ' ')
          pr=$(gh pr list --head "$branch" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          {
            echo "### Did this run ship anything?"
            echo ""
            echo "- branch: \`$branch\`"
            echo "- pushed to a remote branch: ${pushed:-NO}"
            echo "- pull request: ${pr:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$dirty" ]; then
            echo "::warning::Uncommitted changes were left in the sandbox and are lost at teardown."
            printf '%s\n' "$dirty" | head -20
          fi
          if [ -z "$pushed" ]; then
            echo "::error::This run made commits that were never pushed, so the work dies with the sandbox. See incident 3 in docs/agents/incidents.md and the 'Ship first, then work' rule in this seat's charter."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "::warning::No pull request exists for branch $branch. A run with nothing to ship must say so in a draft PR and close it, rather than ending silently."
          fi
      # The stranded-draft check (tools/check-draft-prs.sh, engineer PR #39).
      # A seat runs with no memory of its own last run and GitHub refuses to
      # merge a draft at all, so a draft with no live run behind it is work
      # that shipped nothing. Reported, never fatal, on purpose: the draft it
      # names is usually this run's own, which is correct and expected, and
      # the point is that the NEXT run on this seat sees what this one left.
      # Exit 1 names the stranded drafts, 0 means every seat pull request is
      # reachable by a merger, and anything else means the check could not run
      # and must never be read as a 0.
      - name: Stranded drafts (reported, never fatal)
        if: always()
        env:
          SEAT: engineer
        run: |
          if [ ! -f tools/check-draft-prs.sh ] || ! grep -q '"drafts"' package.json; then
            echo "::warning::The stranded-draft question went UNASKED: tools/check-draft-prs.sh or the \`drafts\` script is not in this tree. That is not a clean result. Both arrive with engineer PR #39."
            echo "### Stranded drafts for the \`engineer\` seat: NOT CHECKED (tool absent, engineer PR #39)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          out=$(npm run --silent drafts -- --seat "$SEAT" 2>&1) && status=0 || status=$?
          printf '%s\n' "$out"
          {
            echo "### Stranded drafts for the \`$SEAT\` seat"
            echo ""
            echo '```'
            printf '%s\n' "$out"
            echo "exit $status"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "Every pull request on the $SEAT seat is reachable by a merger." ;;
            1) echo "::warning::A pull request on the $SEAT seat is sitting where no merger can reach it. If one of these is this run's own draft, ready it or write into it which clause keeps it a draft. Reported, not fatal." ;;
            *) echo "::warning::The stranded-draft check could not run (exit $status). A check that could not run is not a pass and must never be read as one." ;;
          esac
          exit 0
