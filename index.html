<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atelier — Alexandra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atelier">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#faf8f3" id="themeColor">
<script>/* apply saved theme before first paint */
try{
  var _t=localStorage.getItem('atelier.theme');
  if(!_t)_t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  if(_t==='dark')document.documentElement.setAttribute('data-theme','dark');
}catch(e){}
</script>
<style>
:root{
  --paper:#faf8f3;
  --paper-2:#f3f0e8;
  --card:#fffefb;
  --ink:#211e19;
  --ink-soft:#5c564c;
  --ink-faint:#948c7e;
  --line:#e6e1d5;
  --line-soft:#eeeae0;
  --sage:#8a9b7e; --terracotta:#c17b5d; --dusk:#7e93a8; --ochre:#c2a05a; --mauve:#a08398; --clay:#b0876d;
  --danger:#b2543f;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --shadow:0 1px 2px rgba(50,42,28,.05), 0 6px 24px -12px rgba(50,42,28,.12);
  --shadow-lift:0 2px 6px rgba(50,42,28,.08), 0 18px 40px -18px rgba(50,42,28,.25);
}
[data-theme=dark]{
  --paper:#181613;
  --paper-2:#221f1a;
  --card:#201d18;
  --ink:#ece6d9;
  --ink-soft:#b8b0a0;
  --ink-faint:#837b6d;
  --line:#37322a;
  --line-soft:#2b2721;
  --danger:#e08a74;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px -12px rgba(0,0,0,.5);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.7);
}
[data-theme=dark] .chip.due-over,[data-theme=dark] .chip.urgent-chip{background:#46281f; color:#eda28d}
[data-theme=dark] .chip.due-today{background:#3b3220; color:#dcbe7c}
[data-theme=dark] .urgent-toggle.on{background:#46281f; border-color:#5e372a; color:#eda28d}
[data-theme=dark] .urgent-toggle:hover{color:#eda28d; border-color:#5e372a}
[data-theme=dark] .sync-banner{background:#332c1c; border-color:#4c4128; color:#d8c48f}
[data-theme=dark] .cal-cell.heat-1{background:#252017}
[data-theme=dark] .cal-cell.heat-2{background:#2e2718}
[data-theme=dark] .cal-cell.heat-3{background:#3a3019}
[data-theme=dark] .cal-cell.heat-4{background:#493c1e}
[data-theme=dark] .wk-ev{background:color-mix(in srgb, var(--acc) 24%, #201d18)}
[data-theme=dark] .wk-ev.gcal{background:var(--paper-2)}
[data-theme=dark] .cal-today{background:var(--paper-2)}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,textarea,select{font-family:inherit; font-size:inherit; color:inherit}
::placeholder{color:var(--ink-faint)}

/* ---------- shell & sidebar ---------- */
.shell{display:flex; min-height:100vh; align-items:stretch}
aside.side{
  width:225px; flex-shrink:0; border-right:1px solid var(--line);
  padding:26px 16px 22px 22px; position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:2px;
}
aside.side .wordmark{margin:0 0 24px 10px}
.snav{
  display:flex; align-items:center; gap:9px; padding:7px 11px; border-radius:9px;
  font-size:13.5px; color:var(--ink-soft); text-align:left; width:100%; letter-spacing:.15px;
}
.snav:hover{background:var(--paper-2); color:var(--ink)}
.snav.on{background:var(--ink); color:var(--paper)}
.snav .dot{width:8px; height:8px}
.snav-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.snav-count{font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
.snav.on .snav-count{color:var(--paper); opacity:.65}
.side-label{
  font-size:10.5px; letter-spacing:2.2px; text-transform:uppercase; color:var(--ink-faint);
  margin:22px 11px 8px;
}
.side-group{
  display:flex; align-items:center; gap:6px; width:100%; text-align:left;
  padding:6px 11px 5px; margin-top:6px; border-radius:8px;
  font-size:10.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--ink-faint);
}
.side-group:hover{color:var(--ink); background:var(--paper-2)}
.side-group.has-on{color:var(--ink)}
.side-group .caret{width:11px; font-size:10px}
.snav-sub{padding-left:26px; cursor:pointer; user-select:none}
.snav-menu{
  opacity:0; color:var(--ink-faint); font-size:15px; line-height:1; padding:0 2px;
  flex-shrink:0; transition:opacity .15s;
}
.snav-sub:hover .snav-menu{opacity:1}
.snav-menu:hover{color:var(--ink)}
.snav.on .snav-menu{color:var(--paper)}
.side-group{cursor:pointer}
.side-group.drag-over-col{background:var(--paper-2); color:var(--ink)}
.side-new{color:var(--ink-faint); font-size:12.5px; margin-top:2px}
.m-only{display:none}
.side-close{display:none}
.m-menu-btn{font-size:19px; padding:2px 8px; color:var(--ink); line-height:1}
.content{flex:1; min-width:0; display:flex; flex-direction:column}
.content footer{margin-top:auto}

/* ---------- chrome ---------- */
.top{
  display:flex; align-items:baseline; gap:26px;
  padding:26px 40px 0;
}
.wordmark{
  font-family:var(--serif); font-size:30px; font-weight:600; letter-spacing:.4px;
  cursor:pointer; user-select:none;
}
.wordmark em{font-style:italic; font-weight:500}
.top-date{font-size:12px; color:var(--ink-faint); letter-spacing:.4px}
nav.tabs{margin-left:auto; display:flex; gap:4px}
nav.tabs button{
  padding:7px 14px; border-radius:999px; font-size:13px; font-weight:450;
  color:var(--ink-soft); letter-spacing:.2px;
}
nav.tabs button:hover{background:var(--paper-2)}
nav.tabs button.on{background:var(--ink); color:var(--paper)}
.rule{border:none; border-top:1px solid var(--line); margin:20px 40px 0}

main{padding:26px 40px 60px}

/* ---------- generic ---------- */
.h-serif{font-family:var(--serif); font-weight:600}
.muted{color:var(--ink-faint)}
.small{font-size:12px}
.btn-ghost{
  font-size:12.5px; color:var(--ink-faint); padding:6px 10px; border-radius:8px;
  letter-spacing:.2px;
}
.btn-ghost:hover{color:var(--ink); background:var(--paper-2)}
.btn-ink{
  background:var(--ink); color:var(--paper); font-size:13px; padding:8px 16px;
  border-radius:999px; letter-spacing:.2px;
}
.btn-ink:hover{opacity:.85}
.seamless{background:transparent; border:none; outline:none}

/* ---------- master board ---------- */
.view-head{display:flex; align-items:baseline; gap:16px; margin-bottom:6px}
.view-title{font-family:var(--serif); font-size:34px; font-weight:600}
.view-sub{color:var(--ink-faint); font-size:13px}
.view-head .spacer{flex:1}

.cols{
  display:flex; gap:22px; align-items:flex-start; overflow-x:auto;
  padding:18px 2px 30px;
}
.col{
  min-width:280px; width:280px; flex-shrink:0;
}
.col-head{
  display:flex; align-items:baseline; gap:8px; padding:2px 4px 10px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}
.col-name{
  font-family:var(--serif); font-size:18.5px; font-weight:600; letter-spacing:.2px;
  background:transparent; border:none; outline:none; width:100%; min-width:0;
}
.col-count{font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
.col-del{opacity:0; font-size:14px; color:var(--ink-faint); transition:opacity .15s}
.col:hover .col-del{opacity:1}
.col-del:hover{color:var(--danger)}
.col-body{display:flex; flex-direction:column; gap:10px; min-height:30px; padding-bottom:6px}
.col.drag-over-col .col-body{background:var(--paper-2); border-radius:12px}

.add-inline{
  font-size:12.5px; color:var(--ink-faint); text-align:left; padding:8px 4px;
  border-radius:8px; letter-spacing:.2px;
}
.add-inline:hover{color:var(--ink)}

/* practices strip on master */
.practices{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;
  padding:14px 2px 2px;
}
.practices-label{
  font-size:10.5px; letter-spacing:2.2px; text-transform:uppercase;
  color:var(--ink-faint); margin-right:6px;
}
.practice{
  display:inline-flex; align-items:center; gap:7px;
  font-family:var(--serif); font-style:italic; font-size:14.5px; color:var(--ink-soft);
  padding:4.5px 13px; border:1px solid var(--line-soft); border-radius:999px;
  background:var(--card); transition:box-shadow .15s;
}
.practice:hover{color:var(--ink); box-shadow:var(--shadow)}
.practice .dot{width:6px; height:6px}

/* board card on master */
.bcard{
  background:var(--card); border:1px solid var(--line-soft); border-radius:14px;
  padding:16px 16px 14px; box-shadow:var(--shadow); cursor:pointer;
  position:relative; transition:box-shadow .15s, transform .15s;
}
.bcard:hover{box-shadow:var(--shadow-lift); transform:translateY(-1px)}
.bcard-rest{opacity:.3; box-shadow:none; background:transparent}
.bcard-rest:hover{opacity:1; background:var(--card)}
.bcard-alldone .bcard-name::after{content:' ✓'; color:var(--sage); font-size:14px}
.bcard-sched{opacity:.55; box-shadow:none; background:transparent}  /* nothing to decide — only showing up left */
.bcard-sched:hover{opacity:1; background:var(--card)}
.bcard-sched .bcard-name::after{content:' ◷'; color:var(--ink-faint); font-size:13px}
.bcard.dragging{opacity:.4}
.bcard-top{display:flex; align-items:center; gap:9px; margin-bottom:6px}
.dot{width:9px; height:9px; border-radius:50%; flex-shrink:0}
.bcard-name{font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.2}
.bcard-meta{font-size:12px; color:var(--ink-faint); display:flex; gap:10px; margin-bottom:10px}
.mini-track{height:2px; background:var(--line-soft); border-radius:2px; overflow:hidden}
.mini-fill{height:100%; border-radius:2px; transition:width .3s}
.bcard-due{margin-top:9px; font-size:11.5px; color:var(--ink-soft)}
.bcard-due.overdue{color:var(--danger)}

/* ---------- task cards (kanban) ---------- */
.tcard{
  background:var(--card); border:1px solid var(--line-soft); border-radius:12px;
  padding:12px 13px 11px; box-shadow:var(--shadow); cursor:grab;
  transition:box-shadow .15s;
  display:flex; gap:10px; align-items:flex-start;
}
.tcard:hover{box-shadow:var(--shadow-lift)}
.tcard.dragging{opacity:.4}
.tcard.done-card{opacity:.55}
.tcard.done-card .t-title{text-decoration:line-through; text-decoration-thickness:1px; text-decoration-color:var(--ink-faint)}
.tick{
  width:17px; height:17px; border-radius:50%; border:1.4px solid var(--ink-faint);
  flex-shrink:0; margin-top:1px; display:grid; place-items:center;
  transition:all .15s; background:transparent; padding:0;
}
.tick:hover{border-color:var(--sage)}
.tick.on{background:var(--sage); border-color:var(--sage)}
.tick svg{width:9px; height:9px; stroke:var(--paper); stroke-width:2.6; fill:none; opacity:0}
.tick.on svg{opacity:1}
.t-main{flex:1; min-width:0}
.t-title{font-size:13.5px; font-weight:450; line-height:1.4; overflow-wrap:break-word}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.chips:empty{margin-top:0}
.chip{
  font-size:11px; padding:2.5px 8px; border-radius:999px; letter-spacing:.2px;
  background:var(--paper-2); color:var(--ink-soft); white-space:nowrap;
  max-width:100%; overflow:hidden; text-overflow:ellipsis;
}
.chip.due-over{background:#f3e1db; color:var(--danger)}
.chip.due-today{background:#ece5d2; color:#8a6d2f}
.chip.goal-chip{border:1px solid var(--line); background:transparent; color:var(--ink-faint); font-style:italic; font-family:var(--serif); font-size:12.5px}
.chip.urgent-chip{background:#f3e1db; color:var(--danger); font-weight:500; letter-spacing:.4px}
.chip.due-past{background:var(--paper-2); color:var(--ink-faint)}
/* appointments */
.appt-strip{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:14px 2px 2px}
.appt-pill{
  display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);
  padding:5px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card);
}
.appt-pill:hover{color:var(--ink); box-shadow:var(--shadow)}
.appt-pill .dot{width:6px; height:6px}
.appt-when{font-variant-numeric:tabular-nums; color:var(--ink-faint); font-size:11px; white-space:nowrap}
.kind-seg{width:100%}
.kind-seg button{flex:1; padding:9px 10px}
.kind-note{font-size:11.5px; color:var(--ink-faint); margin-top:7px; font-style:italic; line-height:1.45}
.cl-when{font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:104px}
.cl-verdict{margin-left:auto; font-size:12px; color:var(--ink-soft); font-family:var(--serif); font-style:italic; font-size:13.5px}
.cl-verdict.drift{color:var(--danger); opacity:.85}
[data-theme=dark] .chip.due-past{background:var(--paper-2); color:var(--ink-faint)}
.urgent-toggle{
  width:100%; text-align:left; border:1px solid var(--line); background:var(--card);
  border-radius:9px; padding:8px 11px; font-size:13px; color:var(--ink-faint);
}
.urgent-toggle:hover{border-color:var(--danger); color:var(--danger)}
.urgent-toggle.on{background:#f3e1db; border-color:#e3c4ba; color:var(--danger); font-weight:500}

/* ---------- board view ---------- */
.crumb{font-size:12.5px; color:var(--ink-faint); margin-bottom:10px; display:inline-block}
.crumb:hover{color:var(--ink)}
.board-title-input{
  font-family:var(--serif); font-size:34px; font-weight:600;
  background:transparent; border:none; outline:none; min-width:60px; width:auto;
}
.accent-picker{display:flex; gap:7px; align-items:center}
.accent-opt{width:15px; height:15px; border-radius:50%; border:2px solid transparent; padding:0}
.accent-opt.on{border-color:var(--ink); box-shadow:inset 0 0 0 2px var(--paper)}
.seg{
  display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;
}
.seg button{padding:6px 15px; font-size:12.5px; color:var(--ink-faint)}
.seg button.on{background:var(--ink); color:var(--paper)}

/* ---------- list view ---------- */
.filters{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:16px 0 8px}
.filters select{
  border:1px solid var(--line); background:var(--card); border-radius:8px;
  padding:5px 8px; font-size:12.5px; color:var(--ink-soft); outline:none;
}
.list-wrap{max-width:860px}
.list-group-name{
  font-family:var(--serif); font-size:19px; font-weight:600; margin:26px 0 4px;
  display:flex; align-items:baseline; gap:8px; cursor:pointer; user-select:none;
}
.caret{font-size:11px; color:var(--ink-faint); width:13px; display:inline-block; flex-shrink:0}
.lsec-body .add-inline{margin:2px 0 0 0}
.lsec-body .ghost-new{margin-top:8px}
.lrow{
  display:flex; align-items:center; gap:12px; padding:10px 6px;
  border-bottom:1px solid var(--line-soft); cursor:pointer;
}
.lrow:hover{background:var(--paper-2)}
.lrow .t-title{flex:0 1 auto}
.lrow .lmeta{margin-left:auto; display:flex; gap:8px; align-items:center; flex-shrink:1; min-width:0; justify-content:flex-end}
.lrow.done-card .t-title{text-decoration:line-through; color:var(--ink-faint)}
.empty-note{color:var(--ink-faint); font-style:italic; font-family:var(--serif); font-size:15px; padding:18px 4px}

/* ---------- goals ---------- */
.mission-wrap{max-width:820px; margin-bottom:14px}
.mission-label{font-size:11px; letter-spacing:2.2px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px}
.mission-input{
  width:100%; font-family:var(--serif); font-size:27px; font-weight:500; font-style:italic;
  line-height:1.35; background:transparent; border:none; outline:none; resize:none;
  color:var(--ink);
}
.goals-list{max-width:820px}
.goal-block{border-top:1px solid var(--line); padding:22px 0 18px}
.goal-row{display:flex; align-items:center; gap:14px}
.goal-title-in{
  font-family:var(--serif); font-size:22px; font-weight:600; flex:1;
  background:transparent; border:none; outline:none; min-width:0;
}
.goal-pct{font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums; width:84px; text-align:right}
.track{height:3px; background:var(--line-soft); border-radius:3px; overflow:hidden; margin-top:10px}
.fill{height:100%; background:var(--ink); border-radius:3px; transition:width .3s}
.subgoals{margin:8px 0 0 26px}
.sub-block{border-bottom:1px dashed var(--line-soft); padding-bottom:4px; margin-bottom:4px}
.sub-tasks{margin:0 0 4px 22px}
.sub-tasks .linked-t{font-size:12px; padding:4px 0}
.sub-empty{font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--ink-faint); padding:3px 0 5px}
.sub-row{display:flex; align-items:center; gap:12px; padding:8px 0}
.sub-title-in{flex:1; background:transparent; border:none; outline:none; font-size:13.5px; min-width:0}
.sub-track{width:110px; height:2px; background:var(--line-soft); border-radius:2px; overflow:hidden; flex-shrink:0}
.goal-tools{display:flex; gap:2px; opacity:0; transition:opacity .15s}
.goal-block:hover .goal-tools, .sub-row:hover .goal-tools{opacity:1}
.linked-tasks{margin:10px 0 0 26px}
.linked-t{display:flex; gap:9px; align-items:center; padding:5px 0; font-size:12.5px; color:var(--ink-soft); cursor:pointer}
.linked-t:hover{color:var(--ink)}
.linked-t .b-tag{font-size:10.5px; color:var(--ink-faint); border:1px solid var(--line); padding:1px 7px; border-radius:999px}
.linked-t.done{color:var(--ink-faint); text-decoration:line-through}

/* ---------- compass ---------- */
.star-block{border-top:1px solid var(--line); padding:26px 0 20px}
.star-block.orphan{border-top-style:dashed}
.star-new{border-top:1px solid var(--line); padding:16px 0}
.star-head{display:flex; align-items:baseline; gap:12px}
.star-mark{color:var(--ochre); font-size:15px}
.star-title{
  font-family:var(--serif); font-size:26px; font-weight:600; flex:1; min-width:0;
  background:transparent; border:none; outline:none; font-style:italic;
}
.star-meta{font-size:12px; color:var(--ink-faint); margin-top:8px; letter-spacing:.2px}
.star-heading{
  font-family:var(--serif); font-style:italic; font-size:15px; color:var(--sage);
  white-space:nowrap;
}
.star-heading.drift{color:var(--ink-faint)}
.star-goals{margin:14px 0 0 20px}
.star-goals .goal-block{border-top:1px dashed var(--line-soft); padding:16px 0 12px}
.star-goals .goal-block:first-child{border-top:none; padding-top:4px}
.star-goals .goal-title-in{font-size:19px}
.star-items{margin:12px 0 0 20px}
.star-items .linked-t{cursor:default}
.star-pick{
  border:1px solid var(--line); background:var(--card); border-radius:8px;
  padding:3px 7px; font-size:11.5px; color:var(--ink-soft); outline:none; max-width:170px;
}
.star-chip{
  font-size:11px; color:var(--ochre); border:1px solid var(--line); border-radius:999px;
  padding:2px 9px; white-space:nowrap; font-family:var(--serif); font-style:italic; font-size:12.5px;
}
.star-chip.drift{color:var(--ink-faint); border-style:dashed}
.plan-item .goal-tools{display:flex; align-items:center; gap:6px}
/* timeline of goals */
.era-goals{margin-top:6px}
.era-goals .goal-block{border-top:1px dashed var(--line-soft); padding:14px 0 10px; cursor:grab}
.era-goals .goal-block:first-child{border-top:none; padding-top:4px}
.era-goals .goal-title-in{font-size:21px; line-height:1.3}
/* the title gets its own line; the controls step below and stay quiet until hovered */
.goal-row{gap:9px}
.goal-row .goal-pct{width:auto; margin-left:auto; flex-shrink:0}
.goal-sub-row{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin:5px 0 0 30px; min-height:22px;
}
.goal-sub-row .goal-tools{margin-left:auto; opacity:0; transition:opacity .15s}
.goal-block:hover .goal-sub-row .goal-tools,
.goal-sub-row:focus-within .goal-tools{opacity:1}
.goal-block{padding-bottom:8px}
.era-goals .goal-block{border-top:1px solid var(--line-soft); padding:16px 0 12px}
.era{padding-left:26px}
.era-goals{margin-top:2px}
.goal-row .steer{flex-shrink:0; color:var(--ink-faint); font-size:12px}
.goal-caret{flex-shrink:0; color:var(--ink-faint); font-size:11px; width:14px; padding:0}
.goal-caret:hover{color:var(--ink)}
.goal-summary{
  font-size:11.5px; color:var(--ink-faint); padding:5px 0 2px 30px; text-align:left;
  letter-spacing:.3px; font-style:italic; font-family:var(--serif); font-size:13px;
}
.goal-summary:hover{color:var(--ink)}
.goal-achieved{opacity:.5}
.goal-achieved .goal-title-in{text-decoration:line-through; text-decoration-thickness:1px}
.goal-achieved .steer{color:var(--ochre)}
.era-loose{border-left-style:dashed}
.goal-tools{flex-wrap:wrap}
/* tree */
.tree{max-width:900px}
.tree-dept{border-top:1px solid var(--line); padding:20px 0 6px}
.tree-dept-head{
  display:flex; align-items:center; gap:9px; font-size:11px; letter-spacing:2.2px;
  text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px;
}
.tree-goal{border-left:1px solid var(--line); margin:0 0 12px 8px; padding:2px 0 2px 18px; position:relative}
.tree-goal::before{content:''; position:absolute; left:-4px; top:9px; width:7px; height:7px;
  border-radius:50%; background:var(--paper); border:1.5px solid var(--ink-soft)}
.tree-goal-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.tree-goal-t{font-family:var(--serif); font-size:18px; font-weight:600; cursor:pointer}
.tree-goal-t:hover{text-decoration:underline}
.tree-goal-head .goal-pct{width:auto; margin-left:auto}
.tree-subs{margin:6px 0 0 14px}
.tree-sub{display:flex; align-items:center; gap:10px; padding:4px 0; border-bottom:1px dashed var(--line-soft)}
.tree-sub-t{font-size:13px; flex:1; min-width:0}
/* stars footer — the far horizon */
.stars-footer{
  max-width:900px; margin-top:44px; padding:22px 0 10px;
  border-top:2px double var(--line);
}
.stars-label{
  font-size:11px; letter-spacing:2.2px; text-transform:uppercase; color:var(--ochre);
  margin-bottom:16px;
}
.star-row{padding:14px 0; border-bottom:1px dashed var(--line-soft)}
.star-serving{display:flex; flex-wrap:wrap; gap:7px; margin:8px 0 0 27px}
.star-serving .star-chip{cursor:pointer}
.anchor-ask{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--paper-2); border-radius:12px; padding:11px 16px; margin-bottom:16px;
  font-size:12.5px; color:var(--ink-soft);
}

/* ---------- laurels statistics ---------- */
.stats-grid{display:flex; gap:38px; flex-wrap:wrap; align-items:flex-start; margin:16px 0 6px}
.donut-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap}
.donut{width:140px; height:140px; transform:rotate(-90deg); flex-shrink:0}
.donut-arc{transition:opacity .15s}
.donut-arc:hover{opacity:.75}
.donut-n{font-family:var(--serif); font-size:30px; font-weight:600; fill:var(--ink); transform:rotate(90deg); transform-origin:70px 70px}
.donut-l{font-size:9px; letter-spacing:2px; fill:var(--ink-faint); text-transform:uppercase; transform:rotate(90deg); transform-origin:70px 70px}
.legend{display:flex; flex-direction:column; gap:6px; min-width:190px}
.lg-row{display:flex; align-items:center; gap:9px; font-size:12.5px}
.lg-dot{width:9px; height:9px; border-radius:3px; flex-shrink:0}
.lg-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-soft)}
.lg-n{font-variant-numeric:tabular-nums; font-weight:500}
.lg-pct{font-variant-numeric:tabular-nums; color:var(--ink-faint); width:34px; text-align:right; font-size:11.5px}
.mini-stats{display:flex; flex-wrap:wrap; gap:10px 26px; align-content:flex-start}
.ms{display:flex; flex-direction:column; min-width:78px}
.ms-n{font-family:var(--serif); font-size:26px; font-weight:600; line-height:1.1}
.ms-l{font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--ink-faint)}
.spark-wrap{margin:26px 0 6px; max-width:620px}
.spark{display:flex; align-items:flex-end; gap:5px; height:56px; margin-top:6px}
.wk-bar{flex:1; background:var(--sage); border-radius:3px 3px 0 0; min-height:3px}
.spark-foot{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-faint); margin-top:6px}
.spark-foot b{color:var(--ink-soft); font-weight:500}
.bars-wrap{margin:26px 0 6px; max-width:620px}
.bar-row{display:flex; align-items:center; gap:12px; padding:4px 0}
.bar-name{width:130px; flex-shrink:0; font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{flex:1; height:8px; background:var(--line-soft); border-radius:4px; overflow:hidden}
.bar-fill{display:block; height:100%; border-radius:4px}
.bar-n{width:26px; text-align:right; font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink-faint)}
@media (max-width:700px){
  .stats-grid{gap:22px}
  .bar-name{width:96px}
}

/* ---------- rewards ---------- */
.reward-line{
  display:flex; align-items:center; gap:9px; margin:10px 0 2px;
  font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap;
}
.reward-mark{color:var(--ochre); font-size:13px}
.reward-t{font-family:var(--serif); font-style:italic; font-size:15px; color:var(--ink)}
.reward-state{font-size:11.5px; color:var(--ink-faint); font-style:italic}
.reward-line.earned .reward-t{color:var(--ochre)}
.reward-add{font-size:11.5px; opacity:.65; padding:6px 0}
.reward-row{
  display:flex; align-items:center; gap:11px; padding:10px 4px;
  border-bottom:1px solid var(--line-soft);
}
.reward-row.earned{background:#f7f0dd; border-radius:10px; padding:12px 12px; border-bottom:none; margin-bottom:6px}
.reward-row.claimed{opacity:.45}
.reward-row.claimed .ach-t{text-decoration:line-through}
[data-theme=dark] .reward-row.earned{background:#332c1c}

/* ---------- the laurels ---------- */
.ach-hero{
  font-family:var(--serif); font-size:31px; font-style:italic; font-weight:500;
  line-height:1.3; max-width:780px; margin:2px 0 30px;
}
.ach-stats{
  display:flex; max-width:780px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  margin-bottom:24px;
}
.ach-stat{flex:1; padding:16px 4px 14px; text-align:center}
.ach-stat+.ach-stat{border-left:1px solid var(--line-soft)}
.ach-n{font-size:34px; line-height:1.1; margin-bottom:2px}
.badges{display:flex; flex-wrap:wrap; gap:10px; max-width:780px; margin-bottom:14px}
.badge{
  display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line);
  border-radius:999px; padding:7px 16px; font-family:var(--serif); font-size:14.5px;
  background:var(--card);
}
.badge .st{color:var(--ochre); font-size:12px}
.badge.locked{opacity:.55; border-style:dashed; background:transparent}
.ach-wrap{max-width:780px}
.ach-row{
  display:flex; align-items:baseline; gap:10px; padding:9px 4px;
  border-bottom:1px solid var(--line-soft); cursor:pointer;
}
.ach-row:hover{background:var(--paper-2)}
.ach-check{color:var(--sage); font-size:13px; flex-shrink:0}
.ach-t{min-width:0; overflow-wrap:break-word}

/* ---------- column grips ---------- */
.col-grip{
  cursor:grab; color:transparent; font-size:11px; flex-shrink:0; padding:0 1px;
  transition:color .15s; align-self:center; user-select:none;
}
.col:hover .col-grip{color:var(--ink-faint)}
.col-grip:hover{color:var(--ink)}

/* ---------- calendar week (time grid) ---------- */
.wk{
  max-width:1400px; border:1px solid var(--line-soft); border-radius:14px;
  overflow:hidden; background:var(--card); box-shadow:var(--shadow);
}
.wk-row{display:grid; grid-template-columns:58px repeat(7,1fr)}
.wk-gutter-head{border-bottom:1px solid var(--line)}
.wk-day-head{
  border-left:1px solid var(--line-soft); border-bottom:1px solid var(--line);
  padding:9px 8px 7px; min-height:52px;
}
.wk-dn{font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--ink-faint)}
.wk-dn b{font-family:var(--serif); font-size:17px; color:var(--ink); margin-left:4px; font-weight:600}
.wk-today{background:var(--paper-2)}
.wk-allday{margin-top:5px; display:flex; flex-direction:column; gap:2px}
.wk-gutter{position:relative}
.wk-hour{
  height:48px; font-size:9.5px; color:var(--ink-faint); text-align:right;
  padding-right:9px; transform:translateY(-6px); font-variant-numeric:tabular-nums;
}
.wk-col{
  position:relative; height:1152px; border-left:1px solid var(--line-soft);
  background:repeating-linear-gradient(to bottom, var(--line-soft) 0 1px, transparent 1px 48px);
}
.wk-ev{
  position:absolute; left:4px; right:4px; border-radius:8px; padding:3px 8px 4px;
  overflow:hidden; cursor:pointer; box-shadow:var(--shadow);
  background:color-mix(in srgb, var(--acc) 16%, #fffefb); border-left:3px solid var(--acc);
  display:flex; flex-direction:column; z-index:2;
}
.wk-ev:hover{box-shadow:var(--shadow-lift); z-index:3}
.wk-ev-time{font-size:9.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; line-height:1.3}
.wk-ev-t{font-size:11px; font-weight:500; line-height:1.3}
.wk-ev.done{opacity:.5}
.wk-ev.done .wk-ev-t{text-decoration:line-through}
.wk-ev.gcal{
  background:var(--paper-2); border-left:3px dashed var(--ink-faint); cursor:default;
}
.wk-now{position:absolute; left:0; right:0; height:2px; background:var(--danger); opacity:.75; z-index:4}
.wk-now::before{
  content:''; position:absolute; left:-1px; top:-3px; width:8px; height:8px;
  border-radius:50%; background:var(--danger);
}
/* week agenda (phone) */
.agenda{max-width:720px; margin-top:6px}
.ag-day{border-top:1px solid var(--line); padding:13px 0 15px}
.ag-head{
  font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint);
  display:flex; align-items:baseline; gap:8px; margin-bottom:4px;
}
.ag-head b{font-family:var(--serif); font-size:17px; letter-spacing:.2px; text-transform:none; color:var(--ink); font-weight:600}
.ag-now{
  background:var(--ink); color:var(--paper); border-radius:999px; padding:2px 10px;
  font-size:9.5px; letter-spacing:1.5px;
}
.ag-row{
  display:flex; align-items:center; gap:9px; padding:9px 2px;
  border-bottom:1px dashed var(--line-soft); cursor:pointer;
}
.ag-time{width:74px; flex-shrink:0; font-size:10.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.ag-t{min-width:0; overflow-wrap:break-word; font-size:13.5px}
.ag-done{text-decoration:line-through; color:var(--ink-faint)}
.ag-gcal{cursor:default; color:var(--ink-soft); font-style:italic}
.ag-empty{font-family:var(--serif); font-style:italic; color:var(--ink-faint); font-size:13.5px; padding:4px 2px}

/* google calendar items in month cells */
.cal-ev.gcal{color:var(--ink-faint); cursor:default; font-style:italic}
.gc-mark{
  font-size:8.5px; border:1px solid var(--line); border-radius:4px; padding:0 3.5px;
  color:var(--ink-faint); font-style:normal; flex-shrink:0;
}

/* ---------- calendar ---------- */
.cal-nav{display:flex; align-items:center; gap:10px}
.cal-nav-btns{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.cal-nb{padding:6px 14px; font-size:12.5px; color:var(--ink-soft); line-height:1.4}
.cal-nb:hover{background:var(--paper-2); color:var(--ink)}
.cal-nb+.cal-nb{border-left:1px solid var(--line-soft)}
.cal-month{font-size:25px; margin:4px 0 14px}
.cal-grid{
  display:grid; grid-template-columns:repeat(7,1fr); max-width:1240px;
  border-left:1px solid var(--line-soft); border-top:1px solid var(--line-soft);
}
.cal-dow{
  font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint);
  padding:8px 10px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
}
.cal-cell{
  min-height:112px; padding:8px 7px 10px; background:var(--card);
  border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
  min-width:0;
}
.cal-out{background:transparent}
.cal-out .cal-dnum{opacity:.35}
.cal-cell{cursor:pointer}
.cal-cell:hover{box-shadow:inset 0 0 0 1px var(--line)}
.cal-heatn{display:none}
.cal-cell.heat-1{background:#f6efdd}
.cal-cell.heat-2{background:#efe0bd}
.cal-cell.heat-3{background:#e6cf9a}
.cal-cell.heat-4{background:#d9b878}
.cal-dnum{font-family:var(--serif); font-size:15px; font-weight:600; margin-bottom:5px}
.cal-today{background:var(--paper-2)}
.cal-today .cal-dnum span{
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:50%; background:var(--ink); color:var(--paper);
  font-size:13px;
}
.cal-ev{
  display:flex; align-items:baseline; gap:5px; font-size:11.5px; line-height:1.35;
  padding:2.5px 4px; border-radius:6px; cursor:pointer; color:var(--ink-soft);
}
.cal-ev:hover{background:var(--paper-2); color:var(--ink)}
.cal-ev .dot{width:6px; height:6px; align-self:center; flex-shrink:0}
.cal-time{color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap; font-size:10.5px}
.cal-ev{min-width:0; max-width:100%}
.cal-ev-t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1 1 auto}
.cal-urg{color:var(--danger); font-weight:600; flex-shrink:0}
.cal-ev.done{opacity:.45}
.cal-ev.done .cal-ev-t{text-decoration:line-through}

/* ---------- priorities ---------- */
.pt-board{
  display:flex; align-items:center; gap:6px; font-size:10px; color:var(--ink-faint);
  letter-spacing:1.2px; text-transform:uppercase; margin-bottom:5px;
}

/* ---------- routines ---------- */
.routine-card .t-title{font-family:var(--serif); font-style:italic; font-size:15px; font-weight:500}
.inf{color:var(--ink-faint); font-size:14px; width:17px; text-align:center; flex-shrink:0; line-height:1.3}
.kind-toggle{font-size:13.5px; color:transparent; padding:0 2px; transition:color .15s}
.col:hover .kind-toggle{color:var(--ink-faint)}
.kind-toggle.on{color:var(--sage)!important}
.kind-toggle:hover{color:var(--ink)}

/* ---------- life plan ---------- */
.plan{max-width:780px; margin-top:10px; padding-bottom:30px}
.era{position:relative; border-left:1px solid var(--line); padding:4px 0 30px 32px; margin-left:8px}
.era::before{
  content:''; position:absolute; left:-5px; top:14px; width:8px; height:8px;
  border-radius:50%; background:var(--paper); border:1.5px solid var(--ink-soft);
}
.era-head{display:flex; align-items:baseline; gap:10px; margin-bottom:2px}
.era-title{
  font-family:var(--serif); font-size:24px; font-weight:600; background:transparent;
  border:none; outline:none; flex:1; min-width:0;
}
.plan-item{display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px dashed var(--line-soft)}
.plan-item .steer{color:var(--ink-faint); font-size:12px; padding:0 2px; flex-shrink:0}
.plan-item .steer:hover{color:var(--ink)}
.plan-item.done-card .p-text{color:var(--ink-faint); text-decoration:line-through}
.plan-item.done-card .steer{color:var(--sage)}
.plan-item.dragging{opacity:.4}
.p-text{flex:1; background:transparent; border:none; outline:none; font-size:13.5px; min-width:0}
.era.drag-over-col{background:var(--paper-2); border-radius:0 14px 14px 0}
.era-ns{border-left-style:double; border-left-width:3px}
.era-ns::before{background:var(--ochre); border-color:var(--ochre)}
.ns-item .steer{color:var(--ochre); cursor:default; font-size:13px}
.ns-item .p-text{font-family:var(--serif); font-style:italic; font-size:16px}
.era .goal-tools{opacity:0}
.era:hover .era-head .goal-tools{opacity:1}
.plan-item:hover .goal-tools{opacity:1}

/* ---------- claude page ---------- */
.cl-wrap{max-width:760px}
.cl-note{
  background:var(--card); border:1px solid var(--line-soft); border-radius:16px;
  padding:20px 22px 16px; box-shadow:var(--shadow); margin:0 0 16px;
  border-left:3px solid var(--ochre);
}
.cl-text{font-family:var(--serif); font-size:17px; font-style:italic; line-height:1.55}
.cl-task{display:flex; align-items:center; gap:9px; margin-top:12px; flex-wrap:wrap}
.cl-task-t{font-size:13.5px; font-weight:500; cursor:pointer}
.cl-task-t:hover{text-decoration:underline}
.cl-actions{display:flex; gap:8px; margin-top:13px; flex-wrap:wrap}
.cl-btn{
  border:1px solid var(--line); border-radius:999px; padding:6px 14px;
  font-size:12.5px; background:var(--card); letter-spacing:.2px; white-space:nowrap;
}
.cl-btn:hover{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.cl-btn.danger:hover{background:var(--danger); border-color:var(--danger)}
.cl-btn.ghost{border-color:transparent; color:var(--ink-faint)}
.cl-sig{margin-top:12px; font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--ink-faint)}
.cl-compose{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:14px 16px; margin-bottom:18px; box-shadow:var(--shadow);
}
.cl-compose textarea{
  width:100%; border:none; outline:none; background:transparent; resize:vertical;
  font-size:14px; line-height:1.5; min-height:44px; font-family:var(--sans);
}
.cl-compose-row{display:flex; align-items:center; justify-content:space-between; margin-top:8px}
.cl-you{
  background:var(--paper-2); border-radius:14px; padding:13px 17px; margin:0 0 12px 40px;
  max-width:680px;
}
.cl-you-t{font-size:14px; line-height:1.5}
.cl-you-s{font-size:11px; color:var(--ink-faint); margin-top:6px; font-style:italic}
.cl-quote{
  font-size:12.5px; color:var(--ink-faint); font-style:italic; font-family:var(--serif);
  border-left:2px solid var(--line); padding:1px 0 1px 10px; margin-bottom:8px;
}
.cl-replied{
  color:var(--sage); font-size:9.5px; letter-spacing:1.2px; margin-left:12px; text-transform:none;
}
.cl-cancel{color:var(--ink-faint); font-size:14px; padding:0 4px}
.cl-cancel:hover{color:var(--danger)}
.cl-sub{font-size:12.5px; color:var(--ink-faint); margin:-2px 0 8px; font-style:italic; font-family:var(--serif); font-size:14px}
.cl-row{
  display:flex; align-items:center; gap:10px; padding:9px 4px;
  border-bottom:1px solid var(--line-soft); flex-wrap:wrap;
}
.cl-row-t{cursor:pointer; min-width:0; font-size:13.5px}
.cl-row-t:hover{text-decoration:underline}
.cl-row-btns{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap}
.cl-foot{
  margin-top:36px; padding-top:16px; border-top:1px solid var(--line);
  font-family:var(--serif); font-style:italic; color:var(--ink-soft); font-size:15px;
}
@media (max-width:700px){
  .cl-row-btns{margin-left:26px; width:100%; margin-top:2px}
}

/* ---------- drawer (task detail) ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(30,26,20,.28); opacity:0; pointer-events:none;
  transition:opacity .2s; z-index:40;
}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw;
  background:var(--paper); border-left:1px solid var(--line);
  transform:translateX(102%); transition:transform .22s ease; z-index:41;
  padding:30px 30px 40px; overflow-y:auto; box-shadow:-20px 0 60px -30px rgba(50,42,28,.3);
}
.drawer.open{transform:translateX(0)}
.d-close{position:absolute; top:18px; right:20px; font-size:17px; color:var(--ink-faint)}
.d-close:hover{color:var(--ink)}
.d-title{
  width:100%; font-family:var(--serif); font-size:24px; font-weight:600; line-height:1.25;
  background:transparent; border:none; outline:none; resize:none; margin:12px 0 4px;
}
.d-field{margin-top:22px}
.d-label{font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px}
.t-prog{display:flex; align-items:center; gap:7px; margin-top:8px}
.t-prog-track{flex:1; height:2px; background:var(--line-soft); border-radius:2px; overflow:hidden}
.t-prog-track div{height:100%; border-radius:2px; transition:width .2s}
.t-prog span{font-size:10.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; flex-shrink:0}
.prog-row{display:flex; align-items:center; gap:10px}
.prog-row input[type=range]{flex:1; accent-color:var(--ink)}
.prog-val{font-size:12px; color:var(--ink-soft); width:36px; text-align:right; font-variant-numeric:tabular-nums; flex-shrink:0}
.time-row{display:flex; align-items:center; gap:9px}
.time-row input[type=time]{
  flex:1; min-width:0; border:1px solid var(--line); background:var(--card); border-radius:9px;
  padding:8px 10px; font-size:13px; outline:none; color:var(--ink);
}
.d-field select,.d-field input[type=date]{
  width:100%; border:1px solid var(--line); background:var(--card); border-radius:9px;
  padding:8px 10px; font-size:13px; outline:none; color:var(--ink);
}
.d-notes{
  width:100%; min-height:90px; border:1px solid var(--line); background:var(--card);
  border-radius:9px; padding:10px 11px; font-size:13px; outline:none; resize:vertical; line-height:1.55;
}
.d-actions{display:flex; gap:10px; margin-top:30px; align-items:center; flex-wrap:wrap}
.gcal-link{
  font-size:12.5px; color:var(--ink-soft); text-decoration:none; border:1px solid var(--line);
  padding:7px 14px; border-radius:999px; letter-spacing:.2px;
}
.gcal-link:hover{background:var(--paper-2)}
.d-delete{font-size:12.5px; color:var(--danger); margin-left:auto; padding:7px 8px}
.d-delete:hover{opacity:.7}

/* ---------- sync banner ---------- */
.sync-banner{
  display:flex; align-items:center; gap:16px; justify-content:space-between;
  margin:14px 40px 0; padding:12px 18px;
  background:#f2ead6; border:1px solid #e3d5b3; border-radius:12px;
  font-size:13px; color:#6b5a2e;
}
.sync-banner .btn-ink{flex-shrink:0}

/* ---------- footer ---------- */
footer{
  padding:10px 40px 26px; display:flex; gap:14px; align-items:center;
  color:var(--ink-faint); font-size:11.5px;
}
footer button, footer label{cursor:pointer; letter-spacing:.3px}
footer button:hover, footer label:hover{color:var(--ink)}

/* new item ghost input */
.ghost-box{width:100%}
.ghost-new{
  width:100%; background:transparent; border:none; outline:none; font-size:13.5px;
  padding:10px 12px; border:1px dashed var(--line); border-radius:12px;
}
.ghost-new:focus{border-color:var(--ink-faint); border-style:solid}
.ghost-hint{
  display:none; font-size:11.5px; color:var(--ink-soft); padding:6px 12px 2px;
  line-height:1.45; letter-spacing:.2px;
}
.ghost-hint b{font-weight:500; color:var(--ink)}
.ghost-hint::before{content:'→ '; color:var(--sage)}
@media (max-width:700px){
  body{font-size:15px}
  .shell{flex-direction:column}
  /* sidebar becomes a full-screen menu behind the ☰ button */
  aside.side{display:none}
  body.menu-open aside.side{
    display:flex; position:fixed; inset:0; z-index:70; background:var(--paper);
    width:100%; height:100%; border:none; overflow-y:auto;
    flex-direction:column; flex-wrap:nowrap; gap:2px; padding:26px 24px 44px;
  }
  body.menu-open{overflow:hidden}
  body.menu-open aside.side .wordmark{margin:0 0 22px 8px; font-size:28px}
  body.menu-open .snav{width:100%; padding:12px 14px; font-size:16px; border-radius:11px}
  body.menu-open .snav-sub{padding-left:34px}
  body.menu-open .side-group{width:100%; margin-top:12px; padding:8px 14px; font-size:11px}
  body.menu-open .side-label{display:block; margin-top:26px}
  body.menu-open .side-close{
    display:block; position:absolute; top:16px; right:18px;
    font-size:26px; color:var(--ink-faint); padding:6px 10px;
  }
  .m-only{display:inline-flex !important; align-items:center}
  .top .wordmark{font-size:22px}
  .top-date{display:none}
  .top,main{
    padding-left:calc(22px + env(safe-area-inset-left, 0px));
    padding-right:calc(22px + env(safe-area-inset-right, 0px));
  }
  .top{padding-top:14px; align-items:center; gap:14px}
  .rule{margin-left:22px; margin-right:22px; margin-top:12px}
  main{padding-top:16px}
  .view-title{font-size:26px}
  .view-head{flex-wrap:wrap; gap:8px 12px}
  .view-sub{display:none}
  /* phone scrolls vertically: columns become stacked sections */
  .cols{flex-direction:column; gap:20px; padding:12px 0 20px; overflow-x:visible}
  .col{min-width:0; width:100%}
  .col-body{gap:8px}
  .tick{width:22px; height:22px}
  .tick svg{width:11px; height:11px}
  .drawer{width:100vw; padding:24px 18px 40px}
  .d-field select,.d-field input[type=date],.time-row input[type=time]{padding:11px 12px; font-size:15px}
  .urgent-toggle{padding:11px 12px; font-size:14px}
  /* week grid scrolls sideways */
  .wk{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .wk-row{grid-template-columns:42px repeat(7,minmax(120px,1fr)); min-width:900px}
  /* month becomes a heatmap: tint + count, tap a day to open it */
  .cal-grid{overflow-x:hidden}
  .cal-cell{min-height:56px; padding:6px 2px 4px; overflow:hidden}
  .cal-grid .cal-ev{display:none}
  .cal-heatn{
    display:block; text-align:center; font-family:var(--serif); font-weight:600;
    font-size:16px; color:var(--ink-soft); line-height:1.2; margin-top:1px;
  }
  .cal-dnum{text-align:center; margin-bottom:0; font-family:var(--sans); font-size:10.5px; color:var(--ink-faint); font-weight:400}
  .cal-today .cal-dnum span{width:18px; height:18px; font-size:10.5px}
  .ach-hero{font-size:24px}
  .ach-n{font-size:26px}
  .mission-input{font-size:21px}
  .era{padding-left:22px}
  /* footer scrolls with the page — centered, comfortably clear of the edge */
  footer{
    border-top:1px solid var(--line-soft); margin-top:20px;
    justify-content:center; text-align:center; flex-wrap:wrap; gap:8px 16px;
    padding:18px 16px calc(30px + env(safe-area-inset-bottom, 0px));
  }
  .f-verbose,.f-sep{display:none}
  main{padding-bottom:28px}
  .cal-nav{width:100%; justify-content:space-between}
  .cal-nb{padding:8px 16px; font-size:13.5px}
  .sync-banner{margin:10px 22px 0}
  footer{padding-left:calc(16px + env(safe-area-inset-left,0px)); padding-right:calc(16px + env(safe-area-inset-right,0px))}
  .practices{gap:6px 8px}
  .practice{font-size:13px; padding:4px 11px}
}

/* ============ compass, rebuilt: chapters, a real tree, counsel ============ */
.gcard{border-top:1px solid var(--line-soft); padding:8px 0 7px}
.gcard:first-child{border-top:none}
.gcard.achieved{opacity:.5}
.gcard.achieved .gcard-t{text-decoration:line-through; text-decoration-thickness:1px}
.gcard.achieved .steer{color:var(--ochre)}
.gcard-head{display:flex; align-items:center; gap:9px}
textarea.gcard-t{
  flex:1; min-width:0; background:transparent; border:none; outline:none; resize:none;
  font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink);
  line-height:1.35; padding:1px 0; overflow:hidden;
}
.gcard-head{align-items:flex-start}
.gcard-head .steer,.gcard-head .goal-caret,.gcard-head .grip,.gcard-head .gcard-pct,.gcard-head .more{margin-top:3px}
.gcard-pct{font-size:11.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; flex-shrink:0}
.gcard-meta{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:2px 0 0 24px}
.gcard-count{font-size:11.5px; color:var(--ink-faint)}
.gcard-tools{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin:7px 0 3px 24px; padding:8px 11px;
  background:var(--paper-2); border-radius:9px;
}
.tree-tools{margin-left:0}
.more{
  background:none; border:none; cursor:pointer; color:var(--line);
  font-size:15px; line-height:1; padding:3px 6px; border-radius:6px; flex-shrink:0;
}
.more:hover{color:var(--ink); background:var(--paper-2)}
.gcard:hover .more,.tr-node:hover .more,.chap-head:hover .more{color:var(--ink-faint)}
.gcard .track{margin:6px 0 0 24px}
.gcard-body{margin:8px 0 2px 24px}
.grip{color:var(--line); cursor:grab; font-size:13px; letter-spacing:-2px; flex-shrink:0; user-select:none}
.gcard:hover .grip{color:var(--ink-faint)}
.btn-ghost.ask{color:var(--ochre)}
.gc-add{padding:4px 0}
/* chapters — the timeline */
.chapters{max-width:940px; padding-bottom:10px}
.chap{border-left:2px solid var(--line); padding:2px 0 10px 20px; margin-bottom:6px; border-radius:0 6px 6px 0}
.chap.loose{border-left-style:dashed}
.chap.drag-over-col{background:var(--paper-2)}
.chap-head{display:flex; align-items:center; gap:10px; padding:8px 0 3px}
.chap-mark{color:var(--ochre); font-size:11px}
.chap-title{
  background:transparent; border:none; outline:none; color:var(--ink);
  font-family:var(--sans); font-size:11px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; flex:1; min-width:0; padding:2px 0;
}
.chap-note{font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--ink-faint); margin:0 0 4px}
.chap-goals{margin-top:2px}
.chap-new{padding-left:22px}
/* the tree proper */
.tree{max-width:860px; padding:6px 0 10px}
.tr-node.thin .add-inline{opacity:.55}
.tr-node.thin:hover .add-inline{opacity:1}
.tr-branch{position:relative; padding-left:26px}
.tr-branch::before{content:''; position:absolute; left:0; top:0; bottom:0; width:1px; background:var(--line)}
.tr-branch:last-child::before{bottom:auto; height:20px}
.tr-branch::after{content:''; position:absolute; left:0; top:20px; width:17px; height:1px; background:var(--line)}
.tr-branch.root{padding-left:0}
.tr-branch.root::before,.tr-branch.root::after{display:none}
.tr-kids{margin-left:2px}
.tr-node{display:flex; align-items:center; gap:10px; min-height:40px; padding:6px 0}
.tr-node.thin{min-height:30px; padding:2px 0}
.tr-node.dept{font-family:var(--sans); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft)}
.tr-dept-t{font-weight:500}
.tr-node.goal.achieved{opacity:.5}
.tr-node.goal.achieved .tr-t{text-decoration:line-through; text-decoration-thickness:1px}
textarea.tr-t{
  flex:1; min-width:0; background:transparent; border:none; outline:none; resize:none;
  color:var(--ink); font-family:var(--sans); font-size:13.5px; line-height:1.45;
  padding:2px 0; overflow:hidden;
}
.tr-node{align-items:flex-start}
.tr-node.dept,.tr-node.thin,.tr-node.star-term{align-items:center}
.tr-node>*:not(textarea){margin-top:4px}
.tr-t:focus{border-bottom:1px solid var(--ink-faint)}
.gcard-t:focus{border-bottom:1px solid var(--ink-faint)}
textarea.tr-t.big{font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.35}
.mission-node{gap:12px; align-items:baseline; flex-wrap:wrap; padding:0 0 14px}
.tr-mission-l{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-faint); flex-shrink:0}
textarea.tr-mission-t{
  flex:1; min-width:220px; background:transparent; border:none; outline:none; resize:none;
  font-family:var(--serif); font-style:italic; font-size:20px; color:var(--ink); line-height:1.4;
  padding:0; overflow:hidden;
}
.star-term{color:var(--ochre)}
.star-term-t{font-family:var(--serif); font-style:italic; font-size:14.5px}
.tr-node .sub-track{display:inline-block; width:90px; height:2px; background:var(--line-soft);
  border-radius:2px; overflow:hidden; flex-shrink:0}
.tr-node .sub-track .fill{display:block; height:100%; background:var(--ink); border-radius:2px}
/* Claude, in the compass */
.counsel{border:1px solid var(--line); border-radius:12px; padding:14px 16px 12px;
  margin:0 0 22px; background:var(--card); max-width:940px}
.counsel-head{display:flex; align-items:center; gap:9px; cursor:pointer}
.counsel-t{font-family:var(--serif); font-size:17px; font-weight:600}
.counsel-n{font-size:10.5px; background:var(--ochre); color:#fff; border-radius:999px; padding:1px 7px}
.counsel-sub{font-family:var(--serif); font-style:italic; font-size:13px; color:var(--ink-faint); margin:3px 0 0 24px}
.counsel-chips{display:flex; flex-wrap:wrap; gap:7px; margin:12px 0 10px}
.counsel-chips .ch{
  font-size:12px; border:1px solid var(--line); background:transparent; color:var(--ink-soft);
  border-radius:999px; padding:5px 13px; cursor:pointer; transition:.15s;
}
.counsel-chips .ch:hover{border-color:var(--ochre); color:var(--ink)}
.counsel textarea{
  width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px;
  font-family:var(--sans); font-size:13.5px; color:var(--ink); background:var(--paper); resize:vertical;
}
.counsel textarea:focus{outline:none; border-color:var(--ink-faint)}
.counsel-row{display:flex; justify-content:flex-end; gap:8px; margin-top:9px}
/* rewards, in the laurels */
.rw-lane{margin:6px 0 14px}
.rw-right{margin-left:auto; flex-shrink:0}
.reward-row.big{border-left:2px solid var(--ochre); padding-left:11px}
.reward-row.big .ach-t{font-family:var(--serif); font-size:16px}
.reward-row.big.earned{border-left-color:var(--ochre)}
.rw-new{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;
  border-top:1px dashed var(--line); padding-top:12px}
.rw-new input{
  flex:1; min-width:220px; border:1px solid var(--line); border-radius:9px; padding:9px 12px;
  font-family:var(--sans); font-size:13.5px; background:var(--paper); color:var(--ink);
}
.rw-new input:focus{outline:none; border-color:var(--ink-faint)}
.rw-new select{
  border:1px solid var(--line); border-radius:9px; padding:9px 10px; font-size:12.5px;
  background:var(--paper); color:var(--ink-soft); max-width:230px;
}
@media (max-width:700px){
  .gcard-t{font-size:18px}
  .gcard-meta{margin-left:0}
  .gcard .track,.gcard-body{margin-left:0}
  .gcard-tools{margin-left:0}
  .more{color:var(--ink-faint)}
  .chap{padding-left:14px}
  .tr-branch{padding-left:18px}
  .tr-branch::after{width:11px}
  .tr-node{flex-wrap:wrap; gap:7px}
  .tr-t.big{font-size:17px}
  .mission-node{gap:6px}
  textarea.tr-mission-t{flex-basis:100%; font-size:18px}
  .tr-node .gcard-tools{margin-left:0}
  .tr-node .sub-track{width:64px}
  .counsel-chips .ch{font-size:11.5px; padding:5px 11px}
  .rw-new select{max-width:none; flex:1}
}


/* ---- OKR: key results ---- */
.kr{display:flex; align-items:flex-start; gap:9px; padding:5px 0; flex-wrap:wrap}
.kr-tick{background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:12px;
  padding:3px 2px 0; flex-shrink:0}
.kr-tick.on{color:var(--ochre)}
textarea.kr-t{
  flex:1 1 200px; min-width:0; background:transparent; border:none; outline:none; resize:none;
  font-family:var(--sans); font-size:13.5px; line-height:1.45; color:var(--ink);
  padding:2px 0; overflow:hidden;
}
textarea.kr-t:focus{border-bottom:1px solid var(--ink-faint)}
.kr-nums{display:inline-flex; align-items:center; gap:4px; flex-shrink:0; margin-top:1px}
.kr-n{
  width:52px; border:1px solid var(--line); border-radius:7px; padding:4px 6px;
  font-family:var(--sans); font-size:12px; text-align:right; background:var(--paper); color:var(--ink);
  font-variant-numeric:tabular-nums; -moz-appearance:textfield;
}
.kr-n::-webkit-outer-spin-button,.kr-n::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.kr-n:focus{outline:none; border-color:var(--ink-faint)}
.kr-slash{color:var(--ink-faint); font-size:12px}
.kr-u{
  width:66px; border:none; border-bottom:1px dashed var(--line); background:transparent;
  font-family:var(--sans); font-size:11.5px; color:var(--ink-soft); padding:4px 2px;
}
.kr-u:focus{outline:none; border-bottom-color:var(--ink-faint)}
.kr-track{position:relative; display:inline-block; width:96px; height:4px; margin-top:9px;
  background:var(--line-soft); border-radius:3px; overflow:visible; flex-shrink:0}
.kr-track .fill{display:block; height:100%; background:var(--ink-faint); border-radius:3px; transition:width .3s}
.kr-track .fill.won{background:var(--sage)}
.kr-mark{position:absolute; top:-3px; width:1px; height:10px; background:var(--ochre); opacity:.65}
.kr-pct{font-size:11.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums;
  width:34px; text-align:right; margin-top:6px; flex-shrink:0}
.kr-pct.won{color:var(--sage)}
.gcard-pct.won{color:var(--sage)}
.track{position:relative; overflow:visible}
.gcard .track .fill{background:var(--ink-faint)}
.gcard .track .fill.won{background:var(--sage)}
.track-mark{position:absolute; top:-3px; width:1px; height:9px; background:var(--ochre); opacity:.7}
.tr-node.kr-node{padding:0; min-height:0}
.tr-node.kr-node .kr{width:100%}
/* ---- chapters read as time, not as another goal ---- */
.chap{border-left:none; padding:0 0 16px 0; margin:0 0 6px}
.chap-head{
  display:flex; align-items:baseline; gap:12px;
  border-top:1px solid var(--line); margin-top:20px; padding:14px 0 4px;
}
.chapters>.chap:first-child .chap-head{margin-top:4px; border-top:none}
.chap-mark{display:none}
.chap-title{
  background:transparent; border:none; outline:none; padding:0;
  font-family:var(--serif); font-style:italic; font-weight:600; font-size:24px;
  letter-spacing:0; text-transform:none; color:var(--ochre);
  flex:0 1 auto; min-width:60px; width:auto;
}
.chap-title:focus{border-bottom:1px solid var(--ochre)}
.chap-head .col-count{margin-left:auto; font-size:11px}
.chap-goals{margin-top:4px; padding-left:2px}
.chap-goals .gcard:first-child{border-top:none}
.chap.loose{border-left:none}
.chap.loose .chap-title{color:var(--ink-faint)}
.chap-note{margin:2px 0 6px}
.chap-new{padding-left:2px; margin-top:8px}
/* ---- the Claude switch ---- */
.counsel.shut{padding:11px 16px}
.switch{
  margin-left:auto; width:34px; height:19px; border-radius:999px; background:var(--line);
  position:relative; flex-shrink:0; transition:background .18s;
}
.switch.on{background:var(--ochre)}
.switch .knob{
  position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%;
  background:var(--card); transition:left .18s; box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.switch.on .knob{left:17px}
@media (max-width:700px){
  .chap-title{font-size:21px}
  .chap{padding-left:0}
  .kr{gap:7px}
  .kr-track{width:100%; flex:1 1 100%; margin-top:6px}
  .kr-pct{margin-top:2px}
  textarea.kr-t{flex-basis:100%}
}


/* ============ compass v3: lean timeline rows + the strategy map ============ */
.gnode>.tr-node.goal{gap:8px}
.gnode .grip{margin-top:1px}
.gspacer{flex:0 0 16px}
.gnode>.tr-node.goal>textarea.tr-t.big{flex:1 1 auto}
.gkr-n{font-size:11px; color:var(--ink-faint); flex-shrink:0; white-space:nowrap}
.gmini{position:relative; display:inline-block; width:74px; height:4px; border-radius:3px;
  background:var(--line-soft); flex-shrink:0; margin-top:2px}
.gmini .fill{display:block; height:100%; border-radius:3px; background:var(--ink-faint)}
.gmini .fill.won{background:var(--sage)}
.gmini-mark{position:absolute; top:-3px; width:1px; height:10px; background:var(--ochre); opacity:.6}
.star-chip.anchor{flex-shrink:0; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tr-node.goal .gcard-pct{flex-shrink:0; width:auto}
.tr-node.kr-node{padding:0; min-height:0}
.gnode .gcard-tools{margin-left:26px}
/* chapters: unmistakably time */
.chap-title{
  background:transparent; border:none; outline:none; resize:none; overflow:hidden; padding:0;
  font-family:var(--serif); font-style:italic; font-weight:600; font-size:31px; line-height:1.15;
  letter-spacing:-.2px; text-transform:none; color:var(--ochre);
  flex:1 1 auto; min-width:60px; width:auto;
}
.chap-head{align-items:flex-start; padding-top:16px}
.chap-head .col-count,.chap-head .more{margin-top:9px}
.chap-goals{padding-left:6px}
/* ---- the strategy map ---- */
.map-wrap{margin:6px 0 0}
.map-bar{display:flex; align-items:center; gap:8px; padding:0 0 10px}
.map-hint{font-size:11.5px; color:var(--ink-faint); font-style:italic}
.map-zoom{font-size:11.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; width:40px; text-align:center}
.map-canvas{
  position:relative; height:min(72vh,720px); overflow:hidden; cursor:grab;
  border:1px solid var(--line); border-radius:14px; background:var(--card);
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:22px 22px;
}
.map-canvas:active{cursor:grabbing}
.map-inner{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform}
.map-edges{position:absolute; top:0; left:0; overflow:visible; pointer-events:none}
.map-edges path{stroke:var(--line); stroke-width:1.4}
.mnode{
  position:absolute; box-sizing:border-box; background:var(--paper);
  border:1px solid var(--line); border-radius:12px; padding:11px 13px 12px;
  box-shadow:var(--shadow);
}
.mnode.mission{background:var(--paper-2); border-color:var(--line); text-align:left}
.mnode.goal{border-left:3px solid var(--ochre)}
.mnode.kr{border-left:3px solid var(--sage)}
.mnode.goal.achieved{opacity:.55}
.mnode.ghost{background:transparent; border-style:dashed; box-shadow:none; padding:14px 13px;
  display:flex; align-items:center; justify-content:center}
.mn-head{display:flex; align-items:center; gap:7px; margin-bottom:6px}
.mn-kind{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint);
  border:1px solid var(--line); border-radius:5px; padding:1px 6px}
.mn-kind.kr{color:var(--sage); border-color:var(--sage)}
.mn-era{font-size:10.5px; color:var(--ink-faint)}
.mn-head .more{margin-left:auto}
textarea.mn-t{
  width:100%; background:transparent; border:none; outline:none; resize:none; overflow:hidden;
  font-family:var(--serif); font-size:16.5px; font-weight:600; line-height:1.3; color:var(--ink);
  padding:0; margin-bottom:8px;
}
textarea.mn-t:focus{border-bottom:1px solid var(--ink-faint)}
textarea.mn-t.mission-t{font-style:italic; font-weight:500; font-size:16px; color:var(--ink-soft)}
.mn-nums{display:flex; align-items:center; gap:5px; margin-bottom:8px}
.mn-bar{position:relative; height:4px; border-radius:3px; background:var(--line-soft); overflow:visible}
.mn-bar .fill{display:block; height:100%; border-radius:3px; background:var(--ink-faint); transition:width .3s}
.mn-bar .fill.won{background:var(--sage)}
.mn-mark{position:absolute; top:-3px; width:1px; height:10px; background:var(--ochre); opacity:.7}
.mn-foot{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap}
.mn-pct{font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink-soft)}
.mn-pct.won{color:var(--sage)}
.mn-sub{font-size:11px; color:var(--ink-faint)}
.mn-foot .star-chip{font-size:10px; padding:1px 7px}
.mn-tools{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
.mn-tools .star-pick{font-size:11px; max-width:110px}
.map-stars{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 2px 4px;
  border-bottom:1px solid var(--line-soft)}
.map-star{font-family:var(--serif); font-style:italic; font-size:15px; color:var(--ink)}
.map-star .star-heading{margin-left:6px}
@media (max-width:700px){
  .chap-title{font-size:25px}
  .tr-node.goal{flex-wrap:wrap}
  .tr-t.big{flex-basis:calc(100% - 70px)}
  .gspacer{display:none}
  .star-chip.anchor{max-width:none}
  .map-canvas{height:64vh}
  .map-hint{display:none}
}


/* the bearing, read as a name — black, with the star in gold beside it */
.anchor{display:inline-flex; align-items:baseline; gap:5px; flex-shrink:0; max-width:210px}
.anchor .star-mark{color:var(--ochre); font-size:12px; line-height:1}
.anchor-t{
  font-family:var(--serif); font-style:italic; font-size:14px; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.anchor.none{
  font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--ink-faint);
}
.mn-foot .anchor{max-width:150px}
.mn-foot .anchor-t{font-size:12.5px}
.counsel-caret{margin-left:auto; color:var(--ink-faint); font-size:11px}
.counsel-head:hover .counsel-caret{color:var(--ink)}
@media (max-width:700px){ .anchor{max-width:none} }


/* the timeline's right-hand column, so every row lines up */
.gcol{flex-shrink:0; display:inline-flex; align-items:center}
.gcol.bar{width:74px; justify-content:flex-start}
.gcol.pct{width:38px; justify-content:flex-end; font-size:11.5px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums}
.gcol.pct.won{color:var(--sage)}
.gcol.anch{width:186px; justify-content:flex-start; padding-left:14px; overflow:visible}
.gnode>.tr-node.goal{gap:6px}
.gmini{margin-top:0}
/* map: the fold control */
button.mn-sub{
  background:none; border:none; padding:0; cursor:pointer; font-family:var(--sans);
  font-size:11px; color:var(--ink-faint); display:inline-flex; align-items:center; gap:4px;
}
button.mn-sub:hover{color:var(--ink)}
.mn-fold{font-size:9px}
@media (max-width:700px){
  .gcol.anch{width:auto; padding-left:0}
  .gcol.bar{width:56px}
}


.star-horizon{margin:6px 0 0 27px; font-size:11.5px; color:var(--ink-faint); letter-spacing:.2px}


/* ---- timeline: one calm line per goal ---- */
.gnode>.tr-node.goal{align-items:center; gap:8px; min-height:38px}
.gnode>.tr-node.goal>*{margin-top:0 !important}
.gnode .grip{margin-top:0}
.gcol{align-self:center}
.chap-mark{display:inline; color:var(--ochre); font-size:19px; line-height:1; margin-top:9px; flex-shrink:0}
.chap-mark.dim{color:var(--line)}
.chap-title{color:var(--ink) !important; font-style:normal !important; font-weight:600 !important}
.chap.loose .chap-title{color:var(--ink-faint) !important}
/* ---- strategy map v2: columns per chapter, key results inside the card ---- */
.map-col{position:absolute; box-sizing:border-box}
.map-objs{display:flex; flex-direction:column; gap:18px; margin-top:34px}
.mnode.chapter{
  position:static; display:flex; align-items:center; gap:8px;
  background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:9px 12px;
}
.mnode.chapter .chap-mark{margin-top:0; font-size:14px}
textarea.chap-t{
  flex:1; min-width:0; background:transparent; border:none; outline:none; resize:none; overflow:hidden;
  font-family:var(--serif); font-size:16px; font-weight:600; color:var(--ink); line-height:1.25; padding:0;
}
.chap-t.none{flex:1; font-family:var(--serif); font-size:16px; font-weight:600; color:var(--ink-faint)}
.map-objs .mnode{position:static; width:100%}
.mnode.goal .mn-head{gap:7px}
.mnode.goal .steer{font-size:11px; color:var(--ink-faint)}
.mnode.goal.achieved .steer{color:var(--ochre)}
.mn-krs{margin-top:10px; border-top:1px dashed var(--line); padding-top:6px}
.mn-krs .kr{padding:4px 0; gap:6px}
.mn-krs .kr-track{width:100%; flex:1 1 100%; margin-top:5px}
.mn-krs textarea.kr-t{flex-basis:100%; font-size:12.5px}
.mn-krs .kr-pct{margin-top:2px}
.mn-krs .kr-n{width:44px}
.mn-krs .kr-u{width:56px}
.map-star{display:inline-flex; align-items:center; gap:6px}
.map-star-in{
  background:transparent; border:none; border-bottom:1px solid transparent; outline:none;
  font-family:var(--serif); font-style:italic; font-size:15px; color:var(--ink);
  width:auto; min-width:70px; max-width:190px; padding:1px 0;
}
.map-star-in:focus{border-bottom-color:var(--ink-faint)}
.cl-star-in{
  background:transparent; border:none; border-bottom:1px solid transparent; outline:none;
  font-family:var(--serif); font-size:15px; color:var(--ink); flex:0 1 auto; min-width:100px; padding:1px 0;
}
.cl-star-in:focus{border-bottom-color:var(--ink-faint)}
@media (max-width:700px){
  .map-canvas{height:66vh}
}


/* ============ the Laurels, on one grid ============ */
.ach-wrap{max-width:820px}
.lau-h{
  font-family:var(--sans); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--ink-soft); font-weight:500; margin:34px 0 4px;
}
.lau-h.sm{margin:22px 0 6px; color:var(--ink-faint)}
.lau-sub{font-family:var(--serif); font-style:italic; font-size:14.5px; color:var(--ink-soft);
  margin:0 0 14px; line-height:1.5; max-width:640px}
.stats-grid{gap:34px; align-items:flex-start}
.mini-stats{display:grid; grid-template-columns:repeat(3,minmax(96px,1fr)); gap:16px 20px; flex:1; min-width:300px}
.ms{min-width:0}
.ms-n{font-size:24px}
.ms-l{font-size:9.5px; letter-spacing:1.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.spark-wrap,.bars-wrap{max-width:560px}
.spark{display:flex; align-items:flex-end; gap:4px; height:60px; margin-top:8px}
.wk-slot{
  flex:1; height:100%; display:flex; align-items:flex-end; justify-content:stretch;
  background:var(--line-soft); border-radius:3px; overflow:hidden;
}
.wk-bar{flex:1; background:var(--sage); border-radius:3px; min-height:0}
.spark-foot{margin-top:7px}
.bar-row{gap:14px; padding:5px 0}
.bar-name{width:118px; font-size:12.5px}
.bar-track{flex:1; max-width:300px; height:7px}
.bar-n{width:30px}
.reward-row{gap:10px}
.rw-new{gap:10px; padding-top:14px}
.rw-new input{min-width:200px; flex:2 1 240px}
.rw-new select{flex:1 1 200px; max-width:260px; min-width:0}
@media (max-width:700px){
  .mini-stats{grid-template-columns:repeat(2,1fr)}
  .bar-name{width:92px}
  .bar-track{max-width:none}
  .rw-new input,.rw-new select{flex-basis:100%; max-width:none}
}


.rw-new select{
  flex:1 1 210px; max-width:250px; min-width:0;
  text-overflow:ellipsis; white-space:nowrap; overflow:hidden;
}
.rw-new .btn-ink{flex-shrink:0}
.rw-ideas{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:11px}
.rw-ideas-l{font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--ink-faint); margin-right:2px}
.rw-ideas .ch{
  font-size:11.5px; border:1px solid var(--line); background:transparent; color:var(--ink-soft);
  border-radius:999px; padding:4px 11px; cursor:pointer; transition:.15s; font-family:var(--sans);
}
.rw-ideas .ch:hover{border-color:var(--ochre); color:var(--ink)}
@media (max-width:700px){
  .rw-new select{flex-basis:100%; max-width:none}
  .rw-ideas .ch{font-size:11px; padding:4px 9px}
}


.mn-fold-btn{
  background:none; border:none; cursor:pointer; color:var(--ink-faint);
  font-size:10px; line-height:1; padding:3px 4px; border-radius:5px; flex-shrink:0;
}
.mn-fold-btn:hover{color:var(--ink); background:var(--paper-2)}
.mnode.chapter .mn-fold-btn{font-size:11px}

.btn-ghost.wipe{margin-left:16px; color:var(--ink-faint); font-size:11.5px}
.btn-ghost.wipe:hover{color:var(--danger)}


/* ---- key results measured by the work they point at ---- */
.kr{position:relative}
.kr-link{
  display:inline-flex; align-items:center; gap:6px; flex-shrink:0; max-width:230px;
  background:transparent; border:1px solid var(--line); border-radius:999px;
  padding:3px 11px; cursor:pointer; font-family:var(--sans); font-size:11.5px; color:var(--ink-soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:.15s;
}
.kr-link:hover{border-color:var(--ink-faint); color:var(--ink)}
.kr-link.empty{border-style:dashed; color:var(--ink-faint)}
.kr-link.plain{border:none; padding:3px 6px; color:var(--ink-faint)}
.kr-link .dot{width:6px; height:6px; border-radius:50%; flex-shrink:0}
.kr-count{color:var(--ink-faint); font-variant-numeric:tabular-nums}
.kr-picker{
  flex-basis:100%; margin:8px 0 4px 22px; padding:12px 14px;
  background:var(--paper-2); border:1px solid var(--line); border-radius:11px;
}
.kp-label{font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 7px}
.kp-label:not(:first-child){margin-top:13px}
.kp-chips{display:flex; flex-wrap:wrap; gap:7px}
.kp-chips .ch{
  display:inline-flex; align-items:baseline; gap:7px;
  font-size:12px; border:1px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:999px; padding:5px 12px; cursor:pointer; font-family:var(--sans); transition:.15s;
}
.kp-chips .ch:hover{border-color:var(--ochre)}
.kp-n{font-size:10.5px; color:var(--ink-faint)}
.kp-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.kp-row select{
  border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px;
  background:var(--paper); color:var(--ink); max-width:190px;
}
.kp-row.foot{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px}
@media (max-width:700px){
  .kr-link{max-width:none; flex-basis:100%; justify-content:flex-start}
  .kr-picker{margin-left:0}
  .kp-row select{flex:1 1 100%; max-width:none}
}


/* the bearing, chosen by clicking it */
.anchor-wrap{position:relative; display:inline-flex}
button.anchor{
  display:inline-flex; align-items:center; gap:6px; background:transparent;
  border:1px solid transparent; padding:5px 11px; margin-left:-8px; border-radius:999px;
  cursor:pointer; max-width:186px; min-height:28px;
}
button.anchor:hover{background:var(--paper-2); border-color:var(--line)}
button.anchor.none{
  font-family:var(--sans); font-style:normal; font-size:11.5px; color:var(--ink-faint);
  border:1px dashed var(--line);
}
button.anchor.none:hover{border-color:var(--ochre); color:var(--ink); border-style:dashed}
.anchor-t{max-width:150px}
.anchor-pick{
  position:absolute; top:calc(100% + 6px); left:-8px; z-index:120; min-width:210px;
  background:var(--card); border:1px solid var(--line); border-radius:11px;
  box-shadow:var(--shadow-lift); padding:6px; display:flex; flex-direction:column; gap:1px;
}
.ap-row{
  display:flex; align-items:baseline; gap:8px; background:none; border:none; cursor:pointer;
  text-align:left; padding:7px 10px; border-radius:8px; font-family:var(--serif); font-style:italic;
  font-size:14.5px; color:var(--ink); white-space:nowrap;
}
.ap-row:hover{background:var(--paper-2)}
.ap-row.on{background:var(--paper-2)}
.ap-row.clear{font-size:12.5px; color:var(--ink-faint)}
.ap-empty{padding:7px 10px; font-size:12.5px; color:var(--ink-faint); font-style:italic}
.ap-new{border-top:1px solid var(--line-soft); margin-top:3px; padding:5px 6px 2px}
/* a row is its own toggle */
.tr-node.goal{cursor:pointer; border-radius:8px}
.tr-node.goal:hover{background:var(--paper-2)}
.tr-node.goal textarea,.tr-node.goal button,.tr-node.goal .anchor-wrap{cursor:auto}
.tr-node.goal .more{cursor:pointer}
.kr{cursor:pointer; border-radius:8px}
.kr:hover{background:var(--paper-2)}
.kr textarea,.kr input,.kr button{cursor:auto}
.kr .more,.kr .kr-tick,.kr .kr-link{cursor:pointer}
@media (max-width:700px){ .anchor-pick{left:auto; right:0} }


.kp-picked{font-size:10px; color:var(--ochre); letter-spacing:0; text-transform:none; margin-left:8px}
.kp-tasks{display:flex; flex-direction:column; gap:1px; max-height:230px; overflow-y:auto;
  border:1px solid var(--line); border-radius:9px; background:var(--paper); padding:4px}
.kp-task{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:none; border:none; cursor:pointer; padding:6px 8px; border-radius:7px;
  font-family:var(--sans); font-size:12.5px; color:var(--ink);
}
.kp-task:hover{background:var(--paper-2)}
.kp-task.on{background:var(--paper-2)}
.kp-task.done .kp-t{color:var(--ink-faint); text-decoration:line-through}
.kp-box{
  width:15px; height:15px; border:1px solid var(--line); border-radius:4px; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:var(--ochre);
  background:var(--card);
}
.kp-task.on .kp-box{border-color:var(--ochre)}
.kp-t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.kp-col{font-size:10.5px; color:var(--ink-faint); flex-shrink:0}


/* the click target: whatever space the title doesn't need */
.gnode>.tr-node.goal>textarea.tr-t.big.fitw{flex:0 0 auto; max-width:100%}
.gspacer{flex:1 1 40px; min-width:24px; align-self:stretch; cursor:pointer}
textarea.kr-t.fitw{flex:0 0 auto; max-width:100%}
.krspacer{flex:1 1 30px; min-width:20px; align-self:stretch; cursor:pointer}
@media (max-width:700px){
  .gspacer,.krspacer{flex-basis:100%; min-height:12px}
}


.cl-gap{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.cl-gap .b-tag{font-size:11px; border:1px solid var(--line); border-radius:999px; padding:2px 9px; color:var(--ink-soft)}


.kp-chips .ch.task{padding-left:8px}
.kp-chips .ch.task .kp-box{width:14px; height:14px; margin-right:3px}
.kp-chips .ch.task.on{border-color:var(--ochre); background:var(--paper-2)}
.kp-chips .ch.bundle{border-style:dashed}
.kp-chips .ch.bundle .kp-n{border-left:1px solid var(--line); padding-left:7px}


.cl-you{position:relative; padding-right:38px}
.cl-you-x{
  position:absolute; top:9px; right:10px; opacity:1;
  color:var(--ink-faint) !important; font-size:17px; line-height:1; padding:3px 7px;
}
.cl-you-x:hover{color:var(--ink) !important}


.done-toggle{
  display:block; width:100%; margin-top:8px; text-align:left;
  border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
  border-radius:9px; padding:10px 12px; font-family:var(--sans); font-size:13px; cursor:pointer;
}
.done-toggle:hover{border-color:var(--ink-faint); color:var(--ink)}
.done-toggle.on{background:#eef1e9; border-color:var(--sage); color:#4d5b45}
[data-theme=dark] .done-toggle.on{background:#242a20; color:#a9bb9c}


/* chapters open and close */
.chap-caret{
  background:none; border:none; cursor:pointer; color:var(--ink-faint); flex-shrink:0;
  font-size:13px; line-height:1; padding:6px 4px 0 0; margin-top:8px;
}
.chap-head{cursor:pointer; border-radius:9px}
.chap-head:hover{background:var(--paper-2)}
.chap-head:hover .chap-caret{color:var(--ink)}
.chap-head textarea,.chap-head .more{cursor:auto}
.chap:not(.open) .chap-head{padding-bottom:14px}
/* the bearings, given their proper weight */
.stars-footer{margin-top:44px; padding-top:30px}
.stars-label{
  font-family:var(--serif); font-style:italic; font-weight:600;
  font-size:27px; line-height:1.2; letter-spacing:-.2px; text-transform:none;
  color:var(--ochre); margin-bottom:6px; display:block;
}
.stars-sub{
  font-family:var(--sans); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-faint); margin-bottom:20px;
}
.star-row{padding:18px 0}
.star-title{font-size:26px !important; line-height:1.25}
.star-head{gap:14px}
.star-mark{font-size:19px}
.star-heading{font-size:12.5px}
@media (max-width:700px){
  .stars-label{font-size:23px}
  .star-title{font-size:22px !important}
}


textarea.chap-title.fitw{flex:0 0 auto; max-width:100%}
.chapspacer{flex:1 1 40px; min-width:24px; align-self:stretch; cursor:pointer}


.gnode>.tr-node.goal,.tr-branch,.chap,.chap-goals,.chapters{overflow:visible}
.mnode,.map-col{overflow:visible}


/* ============ the Claude page, on the Laurels' grid ============ */
.cl-wrap{max-width:820px}
.cl-wrap .list-group-name{
  font-family:var(--sans) !important; font-size:10.5px !important; font-weight:500 !important;
  letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft);
  margin:36px 0 4px !important;
}
.cl-sub{font-size:13.5px !important; color:var(--ink-faint); margin:0 0 12px; line-height:1.5; max-width:640px}
/* rows: quiet until you want them */
.cl-row{padding:8px 6px; border-radius:9px; border-bottom:1px solid var(--line-soft)}
.cl-row:hover{background:var(--paper-2)}
.cl-row-btns{gap:2px; opacity:.35; transition:opacity .15s}
.cl-row:hover .cl-row-btns,.cl-row:focus-within .cl-row-btns{opacity:1}
.cl-row .cl-btn{
  border:none; background:transparent; color:var(--ink-faint);
