<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atelier — Alexandra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atelier">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#faf8f3">
<style>
:root{
  --paper:#faf8f3;
  --paper-2:#f3f0e8;
  --card:#fffefb;
  --ink:#211e19;
  --ink-soft:#5c564c;
  --ink-faint:#948c7e;
  --line:#e6e1d5;
  --line-soft:#eeeae0;
  --sage:#8a9b7e; --terracotta:#c17b5d; --dusk:#7e93a8; --ochre:#c2a05a; --mauve:#a08398; --clay:#b0876d;
  --danger:#b2543f;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --shadow:0 1px 2px rgba(50,42,28,.05), 0 6px 24px -12px rgba(50,42,28,.12);
  --shadow-lift:0 2px 6px rgba(50,42,28,.08), 0 18px 40px -18px rgba(50,42,28,.25);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,textarea,select{font-family:inherit; font-size:inherit; color:inherit}
::placeholder{color:var(--ink-faint)}

/* ---------- shell & sidebar ---------- */
.shell{display:flex; min-height:100vh; align-items:stretch}
aside.side{
  width:225px; flex-shrink:0; border-right:1px solid var(--line);
  padding:26px 16px 22px 22px; position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; gap:2px;
}
aside.side .wordmark{margin:0 0 24px 10px}
.snav{
  display:flex; align-items:center; gap:9px; padding:7px 11px; border-radius:9px;
  font-size:13.5px; color:var(--ink-soft); text-align:left; width:100%; letter-spacing:.15px;
}
.snav:hover{background:var(--paper-2); color:var(--ink)}
.snav.on{background:var(--ink); color:var(--paper)}
.snav .dot{width:8px; height:8px}
.snav-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.snav-count{font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
.snav.on .snav-count{color:var(--paper); opacity:.65}
.side-label{
  font-size:10.5px; letter-spacing:2.2px; text-transform:uppercase; color:var(--ink-faint);
  margin:22px 11px 8px;
}
.side-group{
  display:flex; align-items:center; gap:6px; width:100%; text-align:left;
  padding:6px 11px 5px; margin-top:6px; border-radius:8px;
  font-size:10.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--ink-faint);
}
.side-group:hover{color:var(--ink); background:var(--paper-2)}
.side-group.has-on{color:var(--ink)}
.side-group .caret{width:11px; font-size:10px}
.snav-sub{padding-left:26px}
.side-new{color:var(--ink-faint); font-size:12.5px; margin-top:2px}
.m-only{display:none}
.side-close{display:none}
.m-menu-btn{font-size:19px; padding:2px 8px; color:var(--ink); line-height:1}
.content{flex:1; min-width:0; display:flex; flex-direction:column}
.content footer{margin-top:auto}

/* ---------- chrome ---------- */
.top{
  display:flex; align-items:baseline; gap:26px;
  padding:26px 40px 0;
}
.wordmark{
  font-family:var(--serif); font-size:30px; font-weight:600; letter-spacing:.4px;
  cursor:pointer; user-select:none;
}
.wordmark em{font-style:italic; font-weight:500}
.top-date{font-size:12px; color:var(--ink-faint); letter-spacing:.4px}
nav.tabs{margin-left:auto; display:flex; gap:4px}
nav.tabs button{
  padding:7px 14px; border-radius:999px; font-size:13px; font-weight:450;
  color:var(--ink-soft); letter-spacing:.2px;
}
nav.tabs button:hover{background:var(--paper-2)}
nav.tabs button.on{background:var(--ink); color:var(--paper)}
.rule{border:none; border-top:1px solid var(--line); margin:20px 40px 0}

main{padding:26px 40px 60px}

/* ---------- generic ---------- */
.h-serif{font-family:var(--serif); font-weight:600}
.muted{color:var(--ink-faint)}
.small{font-size:12px}
.btn-ghost{
  font-size:12.5px; color:var(--ink-faint); padding:6px 10px; border-radius:8px;
  letter-spacing:.2px;
}
.btn-ghost:hover{color:var(--ink); background:var(--paper-2)}
.btn-ink{
  background:var(--ink); color:var(--paper); font-size:13px; padding:8px 16px;
  border-radius:999px; letter-spacing:.2px;
}
.btn-ink:hover{opacity:.85}
.seamless{background:transparent; border:none; outline:none}

/* ---------- master board ---------- */
.view-head{display:flex; align-items:baseline; gap:16px; margin-bottom:6px}
.view-title{font-family:var(--serif); font-size:34px; font-weight:600}
.view-sub{color:var(--ink-faint); font-size:13px}
.view-head .spacer{flex:1}

.cols{
  display:flex; gap:22px; align-items:flex-start; overflow-x:auto;
  padding:18px 2px 30px;
}
.col{
  min-width:280px; width:280px; flex-shrink:0;
}
.col-head{
  display:flex; align-items:baseline; gap:8px; padding:2px 4px 10px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}
.col-name{
  font-family:var(--serif); font-size:18.5px; font-weight:600; letter-spacing:.2px;
  background:transparent; border:none; outline:none; width:100%; min-width:0;
}
.col-count{font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
.col-del{opacity:0; font-size:14px; color:var(--ink-faint); transition:opacity .15s}
.col:hover .col-del{opacity:1}
.col-del:hover{color:var(--danger)}
.col-body{display:flex; flex-direction:column; gap:10px; min-height:30px; padding-bottom:6px}
.col.drag-over-col .col-body{background:var(--paper-2); border-radius:12px}

.add-inline{
  font-size:12.5px; color:var(--ink-faint); text-align:left; padding:8px 4px;
  border-radius:8px; letter-spacing:.2px;
}
.add-inline:hover{color:var(--ink)}

/* practices strip on master */
.practices{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px;
  padding:14px 2px 2px;
}
.practices-label{
  font-size:10.5px; letter-spacing:2.2px; text-transform:uppercase;
  color:var(--ink-faint); margin-right:6px;
}
.practice{
  display:inline-flex; align-items:center; gap:7px;
  font-family:var(--serif); font-style:italic; font-size:14.5px; color:var(--ink-soft);
  padding:4.5px 13px; border:1px solid var(--line-soft); border-radius:999px;
  background:var(--card); transition:box-shadow .15s;
}
.practice:hover{color:var(--ink); box-shadow:var(--shadow)}
.practice .dot{width:6px; height:6px}

/* board card on master */
.bcard{
  background:var(--card); border:1px solid var(--line-soft); border-radius:14px;
  padding:16px 16px 14px; box-shadow:var(--shadow); cursor:pointer;
  position:relative; transition:box-shadow .15s, transform .15s;
}
.bcard:hover{box-shadow:var(--shadow-lift); transform:translateY(-1px)}
.bcard.dragging{opacity:.4}
.bcard-top{display:flex; align-items:center; gap:9px; margin-bottom:6px}
.dot{width:9px; height:9px; border-radius:50%; flex-shrink:0}
.bcard-name{font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.2}
.bcard-meta{font-size:12px; color:var(--ink-faint); display:flex; gap:10px; margin-bottom:10px}
.mini-track{height:2px; background:var(--line-soft); border-radius:2px; overflow:hidden}
.mini-fill{height:100%; border-radius:2px; transition:width .3s}
.bcard-due{margin-top:9px; font-size:11.5px; color:var(--ink-soft)}
.bcard-due.overdue{color:var(--danger)}

/* ---------- task cards (kanban) ---------- */
.tcard{
  background:var(--card); border:1px solid var(--line-soft); border-radius:12px;
  padding:12px 13px 11px; box-shadow:var(--shadow); cursor:grab;
  transition:box-shadow .15s;
  display:flex; gap:10px; align-items:flex-start;
}
.tcard:hover{box-shadow:var(--shadow-lift)}
.tcard.dragging{opacity:.4}
.tcard.done-card{opacity:.55}
.tcard.done-card .t-title{text-decoration:line-through; text-decoration-thickness:1px; text-decoration-color:var(--ink-faint)}
.tick{
  width:17px; height:17px; border-radius:50%; border:1.4px solid var(--ink-faint);
  flex-shrink:0; margin-top:1px; display:grid; place-items:center;
  transition:all .15s; background:transparent; padding:0;
}
.tick:hover{border-color:var(--sage)}
.tick.on{background:var(--sage); border-color:var(--sage)}
.tick svg{width:9px; height:9px; stroke:var(--paper); stroke-width:2.6; fill:none; opacity:0}
.tick.on svg{opacity:1}
.t-main{flex:1; min-width:0}
.t-title{font-size:13.5px; font-weight:450; line-height:1.4; overflow-wrap:break-word}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.chips:empty{margin-top:0}
.chip{
  font-size:11px; padding:2.5px 8px; border-radius:999px; letter-spacing:.2px;
  background:var(--paper-2); color:var(--ink-soft); white-space:nowrap;
  max-width:100%; overflow:hidden; text-overflow:ellipsis;
}
.chip.due-over{background:#f3e1db; color:var(--danger)}
.chip.due-today{background:#ece5d2; color:#8a6d2f}
.chip.goal-chip{border:1px solid var(--line); background:transparent; color:var(--ink-faint); font-style:italic; font-family:var(--serif); font-size:12.5px}
.chip.urgent-chip{background:#f3e1db; color:var(--danger); font-weight:500; letter-spacing:.4px}
.urgent-toggle{
  width:100%; text-align:left; border:1px solid var(--line); background:var(--card);
  border-radius:9px; padding:8px 11px; font-size:13px; color:var(--ink-faint);
}
.urgent-toggle:hover{border-color:var(--danger); color:var(--danger)}
.urgent-toggle.on{background:#f3e1db; border-color:#e3c4ba; color:var(--danger); font-weight:500}

/* ---------- board view ---------- */
.crumb{font-size:12.5px; color:var(--ink-faint); margin-bottom:10px; display:inline-block}
.crumb:hover{color:var(--ink)}
.board-title-input{
  font-family:var(--serif); font-size:34px; font-weight:600;
  background:transparent; border:none; outline:none; min-width:60px; width:auto;
}
.accent-picker{display:flex; gap:7px; align-items:center}
.accent-opt{width:15px; height:15px; border-radius:50%; border:2px solid transparent; padding:0}
.accent-opt.on{border-color:var(--ink); box-shadow:inset 0 0 0 2px var(--paper)}
.seg{
  display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;
}
.seg button{padding:6px 15px; font-size:12.5px; color:var(--ink-faint)}
.seg button.on{background:var(--ink); color:var(--paper)}

/* ---------- list view ---------- */
.filters{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:16px 0 8px}
.filters select{
  border:1px solid var(--line); background:var(--card); border-radius:8px;
  padding:5px 8px; font-size:12.5px; color:var(--ink-soft); outline:none;
}
.list-wrap{max-width:860px}
.list-group-name{
  font-family:var(--serif); font-size:19px; font-weight:600; margin:26px 0 4px;
  display:flex; align-items:baseline; gap:8px; cursor:pointer; user-select:none;
}
.caret{font-size:11px; color:var(--ink-faint); width:13px; display:inline-block; flex-shrink:0}
.lsec-body .add-inline{margin:2px 0 0 0}
.lsec-body .ghost-new{margin-top:8px}
.lrow{
  display:flex; align-items:center; gap:12px; padding:10px 6px;
  border-bottom:1px solid var(--line-soft); cursor:pointer;
}
.lrow:hover{background:var(--paper-2)}
.lrow .t-title{flex:0 1 auto}
.lrow .lmeta{margin-left:auto; display:flex; gap:8px; align-items:center; flex-shrink:1; min-width:0; justify-content:flex-end}
.lrow.done-card .t-title{text-decoration:line-through; color:var(--ink-faint)}
.empty-note{color:var(--ink-faint); font-style:italic; font-family:var(--serif); font-size:15px; padding:18px 4px}

/* ---------- goals ---------- */
.mission-wrap{max-width:820px; margin-bottom:14px}
.mission-label{font-size:11px; letter-spacing:2.2px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px}
.mission-input{
  width:100%; font-family:var(--serif); font-size:27px; font-weight:500; font-style:italic;
  line-height:1.35; background:transparent; border:none; outline:none; resize:none;
  color:var(--ink);
}
.goals-list{max-width:820px}
.goal-block{border-top:1px solid var(--line); padding:22px 0 18px}
.goal-row{display:flex; align-items:center; gap:14px}
.goal-title-in{
  font-family:var(--serif); font-size:22px; font-weight:600; flex:1;
  background:transparent; border:none; outline:none; min-width:0;
}
.goal-pct{font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums; width:84px; text-align:right}
.track{height:3px; background:var(--line-soft); border-radius:3px; overflow:hidden; margin-top:10px}
.fill{height:100%; background:var(--ink); border-radius:3px; transition:width .3s}
.subgoals{margin:8px 0 0 26px}
.sub-block{border-bottom:1px dashed var(--line-soft); padding-bottom:4px; margin-bottom:4px}
.sub-tasks{margin:0 0 4px 22px}
.sub-tasks .linked-t{font-size:12px; padding:4px 0}
.sub-empty{font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--ink-faint); padding:3px 0 5px}
.sub-row{display:flex; align-items:center; gap:12px; padding:8px 0}
.sub-title-in{flex:1; background:transparent; border:none; outline:none; font-size:13.5px; min-width:0}
.sub-track{width:110px; height:2px; background:var(--line-soft); border-radius:2px; overflow:hidden; flex-shrink:0}
.goal-tools{display:flex; gap:2px; opacity:0; transition:opacity .15s}
.goal-block:hover .goal-tools, .sub-row:hover .goal-tools{opacity:1}
.linked-tasks{margin:10px 0 0 26px}
.linked-t{display:flex; gap:9px; align-items:center; padding:5px 0; font-size:12.5px; color:var(--ink-soft); cursor:pointer}
.linked-t:hover{color:var(--ink)}
.linked-t .b-tag{font-size:10.5px; color:var(--ink-faint); border:1px solid var(--line); padding:1px 7px; border-radius:999px}
.linked-t.done{color:var(--ink-faint); text-decoration:line-through}

/* ---------- the laurels ---------- */
.ach-hero{
  font-family:var(--serif); font-size:31px; font-style:italic; font-weight:500;
  line-height:1.3; max-width:780px; margin:2px 0 30px;
}
.ach-stats{
  display:flex; max-width:780px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  margin-bottom:24px;
}
.ach-stat{flex:1; padding:16px 4px 14px; text-align:center}
.ach-stat+.ach-stat{border-left:1px solid var(--line-soft)}
.ach-n{font-size:34px; line-height:1.1; margin-bottom:2px}
.badges{display:flex; flex-wrap:wrap; gap:10px; max-width:780px; margin-bottom:14px}
.badge{
  display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line);
  border-radius:999px; padding:7px 16px; font-family:var(--serif); font-size:14.5px;
  background:var(--card);
}
.badge .st{color:var(--ochre); font-size:12px}
.badge.locked{opacity:.55; border-style:dashed; background:transparent}
.ach-wrap{max-width:780px}
.ach-row{
  display:flex; align-items:baseline; gap:10px; padding:9px 4px;
  border-bottom:1px solid var(--line-soft); cursor:pointer;
}
.ach-row:hover{background:var(--paper-2)}
.ach-check{color:var(--sage); font-size:13px; flex-shrink:0}
.ach-t{min-width:0; overflow-wrap:break-word}

/* ---------- column grips ---------- */
.col-grip{
  cursor:grab; color:transparent; font-size:11px; flex-shrink:0; padding:0 1px;
  transition:color .15s; align-self:center; user-select:none;
}
.col:hover .col-grip{color:var(--ink-faint)}
.col-grip:hover{color:var(--ink)}

/* ---------- calendar week (time grid) ---------- */
.wk{
  max-width:1400px; border:1px solid var(--line-soft); border-radius:14px;
  overflow:hidden; background:var(--card); box-shadow:var(--shadow);
}
.wk-row{display:grid; grid-template-columns:58px repeat(7,1fr)}
.wk-gutter-head{border-bottom:1px solid var(--line)}
.wk-day-head{
  border-left:1px solid var(--line-soft); border-bottom:1px solid var(--line);
  padding:9px 8px 7px; min-height:52px;
}
.wk-dn{font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--ink-faint)}
.wk-dn b{font-family:var(--serif); font-size:17px; color:var(--ink); margin-left:4px; font-weight:600}
.wk-today{background:var(--paper-2)}
.wk-allday{margin-top:5px; display:flex; flex-direction:column; gap:2px}
.wk-gutter{position:relative}
.wk-hour{
  height:48px; font-size:9.5px; color:var(--ink-faint); text-align:right;
  padding-right:9px; transform:translateY(-6px); font-variant-numeric:tabular-nums;
}
.wk-col{
  position:relative; height:1152px; border-left:1px solid var(--line-soft);
  background:repeating-linear-gradient(to bottom, var(--line-soft) 0 1px, transparent 1px 48px);
}
.wk-ev{
  position:absolute; left:4px; right:4px; border-radius:8px; padding:3px 8px 4px;
  overflow:hidden; cursor:pointer; box-shadow:var(--shadow);
  background:color-mix(in srgb, var(--acc) 16%, #fffefb); border-left:3px solid var(--acc);
  display:flex; flex-direction:column; z-index:2;
}
.wk-ev:hover{box-shadow:var(--shadow-lift); z-index:3}
.wk-ev-time{font-size:9.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; line-height:1.3}
.wk-ev-t{font-size:11px; font-weight:500; line-height:1.3}
.wk-ev.done{opacity:.5}
.wk-ev.done .wk-ev-t{text-decoration:line-through}
.wk-ev.gcal{
  background:var(--paper-2); border-left:3px dashed var(--ink-faint); cursor:default;
}
.wk-now{position:absolute; left:0; right:0; height:2px; background:var(--danger); opacity:.75; z-index:4}
.wk-now::before{
  content:''; position:absolute; left:-1px; top:-3px; width:8px; height:8px;
  border-radius:50%; background:var(--danger);
}
/* week agenda (phone) */
.agenda{max-width:720px; margin-top:6px}
.ag-day{border-top:1px solid var(--line); padding:13px 0 15px}
.ag-head{
  font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-faint);
  display:flex; align-items:baseline; gap:8px; margin-bottom:4px;
}
.ag-head b{font-family:var(--serif); font-size:17px; letter-spacing:.2px; text-transform:none; color:var(--ink); font-weight:600}
.ag-now{
  background:var(--ink); color:var(--paper); border-radius:999px; padding:2px 10px;
  font-size:9.5px; letter-spacing:1.5px;
}
.ag-row{
  display:flex; align-items:center; gap:9px; padding:9px 2px;
  border-bottom:1px dashed var(--line-soft); cursor:pointer;
}
.ag-time{width:74px; flex-shrink:0; font-size:10.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.ag-t{min-width:0; overflow-wrap:break-word; font-size:13.5px}
.ag-done{text-decoration:line-through; color:var(--ink-faint)}
.ag-gcal{cursor:default; color:var(--ink-soft); font-style:italic}
.ag-empty{font-family:var(--serif); font-style:italic; color:var(--ink-faint); font-size:13.5px; padding:4px 2px}

/* google calendar items in month cells */
.cal-ev.gcal{color:var(--ink-faint); cursor:default; font-style:italic}
.gc-mark{
  font-size:8.5px; border:1px solid var(--line); border-radius:4px; padding:0 3.5px;
  color:var(--ink-faint); font-style:normal; flex-shrink:0;
}

/* ---------- calendar ---------- */
.cal-nav{display:flex; align-items:center; gap:10px}
.cal-nav-btns{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.cal-nb{padding:6px 14px; font-size:12.5px; color:var(--ink-soft); line-height:1.4}
.cal-nb:hover{background:var(--paper-2); color:var(--ink)}
.cal-nb+.cal-nb{border-left:1px solid var(--line-soft)}
.cal-month{font-size:25px; margin:4px 0 14px}
.cal-grid{
  display:grid; grid-template-columns:repeat(7,1fr); max-width:1240px;
  border-left:1px solid var(--line-soft); border-top:1px solid var(--line-soft);
}

function ensureDefaults(){
  if(!S.plan)S.plan=[];
  if(!S.priCols)S.priCols=[{id:uid(),name:'Do now!'},{id:uid(),name:'Do soon'},{id:uid(),name:'On the horizon'}];
  if(!S.meta.horizonCols){S.boards.forEach(addHorizonCol);S.meta.horizonCols=true;}
  if(!S.gcal)S.gcal=[];
  if(!S.claude)S.claude={notes:[],inbox:[]};
  if(!S.claude.inbox)S.claude.inbox=[];
}
ensureDefaults();
/* Claude's updates ride inside this file — merged on every load, no file link needed */
function absorbEmbedded(){
  try{
    const el=document.getElementById('claudeData');
    if(!el)return;
    const txt=el.textContent.trim();
    if(!txt||txt.startsWith('__'))return;
    const data=JSON.parse(txt);
    if(data&&data.meta){
      if(FRESH){S=data;FRESH=false;}
      else S=mergeStates(S,data);
      ensureDefaults();
    }
  }catch(e){}
}
function save(){
  S.meta.updatedAt=Date.now();
  store.set(KEY,JSON.stringify(S));
  const el=document.getElementById('saveStamp');
  if(el)el.textContent=CAN_STORE
    ?'Autosaved · '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
    :'Preview mode — edits are temporary here; tell Claude to make them permanent';
  scheduleWrite();
  if(typeof ghSchedulePush==='function')ghSchedulePush();
}

/* ============ helpers ============ */
const board=id=>S.boards.find(b=>b.id===id);
const goal=id=>S.goals.find(g=>g.id===id);
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boardTasks=bid=>S.tasks.filter(t=>t.boardId===bid);
const colOf=t=>{const b=board(t.boardId);return b?b.columns.find(c=>c.id===t.colId):null;};
const isRoutine=t=>{const c=colOf(t);return !!(c&&c.kind==='routine');};
const byUrgent=a=>[...a].sort((x,z)=>(z.urgent?1:0)-(x.urgent?1:0));
const touch=t=>{t.touchedAt=Date.now();};  // per-task stamp — merge resolves conflicts by last touch
const urgentChip=t=>t.urgent?'<span class="chip urgent-chip">! urgent</span>':'';
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function dueClass(t){
  if(!t.due||t.done)return '';
  const today=todayStr();
  if(t.due<today)return 'due-over';
  if(t.due===today)return 'due-today';
  return '';
}
function fmtDue(d){
  if(!d)return '';
  const dt=new Date(d+'T12:00:00');
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtTime(hm){
  if(!hm)return '';
  let [h,m]=hm.split(':').map(Number);
  const ap=h<12?'am':'pm'; h=h%12||12;
  return h+(m?':'+String(m).padStart(2,'0'):'')+ap;
}
function fmtSlot(t){
  if(!t.start)return '';
  const a=fmtTime(t.start), b=t.end?fmtTime(t.end):'';
  if(!b)return a;
  const sameAp=a.slice(-2)===b.slice(-2);
  return (sameAp?a.slice(0,-2):a)+'–'+b;
}
function whenChip(t){
  const d=t.due?fmtDue(t.due):'', s=fmtSlot(t);
  if(!d&&!s)return '';
  return `<span class="chip ${dueClass(t)}">${d}${d&&s?' · ':''}${s}</span>`;
}
function goalDescendants(gid){
  return S.goals.filter(g=>g.parentId===gid).map(g=>g.id);
}
function goalTaskSet(gid){
  const ids=[gid,...goalDescendants(gid)];
  return S.tasks.filter(t=>t.goalId&&ids.includes(t.goalId)&&!isRoutine(t));
}
function progress(tasks){
  if(!tasks.length)return null;
  return Math.round(100*tasks.filter(t=>t.done).length/tasks.length);
}
function gcalUrl(t){
  if(!t.due)return null;
  const d=t.due.replace(/-/g,'');
  let dates, tz='';
  if(t.start){
    const s=t.start.replace(':','')+'00';
    let endHM=t.end;
    if(!endHM){ // default one hour
      let [h,m]=t.start.split(':').map(Number); h=(h+1)%24;
      endHM=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
    }
    dates=d+'T'+s+'/'+d+'T'+endHM.replace(':','')+'00';
    tz='&ctz='+encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Guatemala');
  }else{
    const next=new Date(t.due+'T12:00:00');next.setDate(next.getDate()+1);
    dates=d+'/'+next.getFullYear()+String(next.getMonth()+1).padStart(2,'0')+String(next.getDate()).padStart(2,'0');
  }
  const b=board(t.boardId);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(t.title)
    +'&dates='+dates+tz
    +'&details='+encodeURIComponent((t.note?t.note+'\n\n':'')+'From Atelier · '+(b?b.name:''));
}
function exportData(){
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S,null,2));
  a.download='atelier-backup-'+todayStr()+'.json';
  a.click();
}
function importData(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{S=JSON.parse(r.result);ensureDefaults();save();render();}catch(e){alert('Could not read that file.');}};
  r.readAsText(f);
}
/* ============ routing ============ */
let route={view:'master'};   // {view:'master'|'goals'|'board', boardId, mode:'kanban'|'list'}
let filters={status:'all',due:'all',goal:'all'};
function toggleMenu(){document.body.classList.toggle('menu-open');}
function go(view,boardId){
  document.body.classList.remove('menu-open');
  route={view,boardId,mode:route.boardId===boardId?route.mode:'kanban'};
  if(view!=='board')route.boardId=null;
  filters={status:'all',due:'all',goal:'all'};
  render();
}
/* ============ render root ============ */
const $=id=>document.getElementById(id);
function render(){
  $('topDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  renderSidebar();
  const m=$('main');
  if(typeof calJump!=='undefined'&&calJump&&route.view==='cal'&&calMode==='week'){
    calJump=0;
    requestAnimationFrame(()=>{const el=document.querySelector('.wk .wk-row:nth-child(2)');
      if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY+6.5*48-170});});
  }
  if(route.view==='master')m.innerHTML=renderMaster();
  else if(route.view==='goals')m.innerHTML=renderGoals();
  else if(route.view==='plan')m.innerHTML=renderPlan();
  else if(route.view==='pri')m.innerHTML=renderPriorities();
  else if(route.view==='cal')m.innerHTML=renderCal();
  else if(route.view==='ach')m.innerHTML=renderAch();
  else if(route.view==='claude')m.innerHTML=renderClaude();
  else m.innerHTML=renderBoard();
  save();
}

/* ============ sidebar ============ */
function renderSidebar(){
  const bItem=b=>{
    const open=boardTasks(b.id).filter(t=>!t.done&&!isRoutine(t)).length;
    const on=route.view==='board'&&route.boardId===b.id;
    return `<button class="snav snav-sub ${on?'on':''}" onclick="go('board','${b.id}')">
      <span class="dot" style="background:${b.accent}"></span>
      <span class="snav-name">${esc(b.name)}</span>
      <span class="snav-count">${open||''}</span>
    </button>`;
  };
  const groups=S.masterColumns.map(mc=>{
    const bs=S.boards.filter(b=>b.masterCol===mc.id);
    const openN=bs.reduce((n,b)=>n+boardTasks(b.id).filter(t=>!t.done&&!isRoutine(t)).length,0);
    const hasCurrent=route.view==='board'&&bs.some(b=>b.id===route.boardId);
    return `<button class="side-group ${hasCurrent?'has-on':''}" onclick="mcolFold('${mc.id}')">
      <span class="caret">${mc.folded?'▸':'▾'}</span>
      <span class="snav-name">${esc(mc.name)}</span>
      <span class="snav-count">${mc.folded?(openN||''):''}</span>
    </button>
    ${mc.folded?'':bs.map(bItem).join('')}`;
  }).join('');
  const grouped=S.masterColumns.flatMap(mc=>S.boards.filter(b=>b.masterCol===mc.id));
  const orphans=S.boards.filter(b=>!grouped.includes(b)).map(bItem).join('');
  $('sidebar').innerHTML=`
    <button class="side-close" onclick="toggleMenu()">×</button>
    <div class="wordmark" onclick="go('master')">A<em>telier</em></div>
    <button class="snav ${route.view==='master'?'on':''}" onclick="go('master')">The Studio</button>
    <button class="snav ${route.view==='pri'?'on':''}" onclick="go('pri')">Priorities</button>
    <button class="snav ${route.view==='cal'?'on':''}" onclick="go('cal')">Calendar</button>
    <button class="snav ${route.view==='plan'?'on':''}" onclick="go('plan')">Life Plan</button>
    <button class="snav ${route.view==='goals'?'on':''}" onclick="go('goals')">Goals</button>
    <button class="snav ${route.view==='ach'?'on':''}" onclick="go('ach')">The Laurels</button>
    <button class="snav ${route.view==='claude'?'on':''}" onclick="go('claude')"><span style="color:var(--ochre)">✦</span> Claude</button>
    <div class="side-label">Boards</div>
    ${groups}${orphans}
    <button class="snav side-new" onclick="newBoard(S.masterColumns[0].id)">+ New board</button>`;
}
function mcolFold(id){
  const c=S.masterColumns.find(c=>c.id===id);
  c.folded=!c.folded;render();
}

/* ============ master (studio) ============ */
function boardCard(b){
  const all=boardTasks(b.id), rn=all.filter(isRoutine).length;
  const ts=all.filter(t=>!isRoutine(t)), open=ts.filter(t=>!t.done).length, done=ts.length-open;
  const p=progress(ts);
  const dues=ts.filter(t=>!t.done&&t.due).sort((a,c)=>a.due<c.due?-1:1);
  const nxt=dues[0];
  return `<div class="bcard" draggable="true" data-bid="${b.id}"
      ondragstart="dragBoard(event,'${b.id}')" ondragend="dragEnd(event)"
      onclick="go('board','${b.id}')">
    <div class="bcard-top"><span class="dot" style="background:${b.accent}"></span>
      <span class="bcard-name">${esc(b.name)}</span></div>
    <div class="bcard-meta"><span>${open} open</span><span>${done} done</span>${rn?`<span>${rn} routine${rn>1?'s':''}</span>`:''}</div>
    <div class="mini-track"><div class="mini-fill" style="width:${p??0}%;background:${b.accent}"></div></div>
    ${nxt?`<div class="bcard-due ${nxt.due<todayStr()?'overdue':''}">next · ${esc(nxt.title)} — ${fmtDue(nxt.due)}</div>`:''}
  </div>`;
}
function renderMaster(){
  const cols=S.masterColumns.map(mc=>{
    const bs=S.boards.filter(b=>b.masterCol===mc.id);
    return `<div class="col" ondragover="overCol(event)" ondragleave="leaveCol(event)"
        ondrop="dropBoard(event,'${mc.id}')">
      <div class="col-head">
        <span class="col-grip" draggable="true" title="Drag to reorder column"
          ondragstart="dragAnyCol(event,'mcol','${mc.id}')" ondragend="dragEnd(event)">⠿</span>
        <input class="col-name" value="${esc(mc.name)}" onchange="renameMCol('${mc.id}',this.value)">
        <span class="col-count">${bs.length}</span>
        <button class="col-del" title="Remove column" onclick="delMCol('${mc.id}')">×</button>
      </div>
      <div class="col-body">${bs.map(boardCard).join('')}</div>
      <button class="add-inline" onclick="newBoard('${mc.id}')">+ New board</button>
    </div>`;
  }).join('');
  return `<div class="view-head">
      <div class="view-title">The Studio</div>
      <div class="view-sub">your domains, arranged your way — drag boards to reorder priorities</div>
      <div class="spacer"></div>
      <button class="btn-ghost" onclick="newMCol()">+ Column</button>
    </div>
    ${practicesStrip()}
    <div class="cols">${cols}</div>`;
}
function practicesStrip(){
  const routines=S.tasks.filter(isRoutine);
  if(!routines.length)return '';
  return `<div class="practices">
    <span class="practices-label">Practices</span>
    ${routines.map(t=>{const b=board(t.boardId);
      return `<button class="practice" onclick="openDrawer('${t.id}')" title="${esc(b?b.name:'')}">
        <span class="dot" style="background:${b?b.accent:'#999'}"></span><span>${esc(t.title)}</span>
      </button>`;}).join('')}
  </div>`;
}
function newMCol(){S.masterColumns.push({id:uid(),name:'Untitled'});render();}
function renameMCol(id,v){const c=S.masterColumns.find(c=>c.id===id);if(c&&v.trim())c.name=v.trim();save();}
function delMCol(id){
  if(S.boards.some(b=>b.masterCol===id)){alert('Move its boards elsewhere first.');return;}
  if(S.masterColumns.length<=1)return;
  S.masterColumns=S.masterColumns.filter(c=>c.id!==id);render();
}
function newBoard(mcol){
  const name=prompt('Name this board — a domain of your life:');
  if(!name||!name.trim())return;
  S.boards.push({id:uid(),name:name.trim(),accent:ACCENTS[S.boards.length%ACCENTS.length],
    masterCol:mcol,columns:[{id:uid(),name:'To do'},{id:uid(),name:'Doing'},{id:uid(),name:'On the horizon'},{id:uid(),name:'Done'}]});
  render();
}

/* ============ drag & drop ============ */
let drag=null; // {type:'board'|'task'|'plan'|'col'|'mcol'|'pricol', id}
function dragAnyCol(ev,type,id,boardId){
  drag={type,id,boardId};ev.dataTransfer.effectAllowed='move';ev.stopPropagation();
}
function reorderCols(list,dragId,targetId){
  if(dragId===targetId)return list;
  const from=list.findIndex(c=>c.id===dragId);
  if(from<0)return list;
  const [col]=list.splice(from,1);
  const to=targetId?list.findIndex(c=>c.id===targetId):0;
  list.splice(to<0?list.length:to,0,col);
  return list;
}
function dragBoard(ev,id){drag={type:'board',id};ev.target.classList.add('dragging');ev.dataTransfer.effectAllowed='move';}
function dragTask(ev,id){drag={type:'task',id};ev.target.classList.add('dragging');ev.dataTransfer.effectAllowed='move';ev.stopPropagation();}
function dragEnd(ev){ev.target.classList.remove('dragging');}
function overCol(ev){ev.preventDefault();ev.currentTarget.classList.add('drag-over-col');}
function leaveCol(ev){ev.currentTarget.classList.remove('drag-over-col');}
function dropBoard(ev,mcolId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(drag&&drag.type==='mcol'){reorderCols(S.masterColumns,drag.id,mcolId);drag=null;render();return;}
  if(!drag||drag.type!=='board')return;
  const b=board(drag.id); if(!b)return;
  b.masterCol=mcolId;
  // reorder: place before the card we dropped on, if any
  const overCard=ev.target.closest('.bcard');
  S.boards=S.boards.filter(x=>x.id!==b.id);
  if(overCard&&overCard.dataset.bid!==b.id){
    const i=S.boards.findIndex(x=>x.id===overCard.dataset.bid);
    S.boards.splice(i,0,b);
  }else S.boards.push(b);
  drag=null;render();
}
function dropTask(ev,colId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(drag&&drag.type==='col'){reorderCols(board(drag.boardId).columns,drag.id,colId);drag=null;render();return;}
  if(!drag||drag.type!=='task')return;
  const t=S.tasks.find(x=>x.id===drag.id); if(!t)return;
  t.colId=colId;
  const b=board(t.boardId), col=b.columns.find(c=>c.id===colId);
  if(col&&col.kind==='routine'){t.done=false;t.completedAt=null;}
  else if(col&&/done/i.test(col.name)){t.done=true;t.completedAt=Date.now();}
  touch(t);
  const overCard=ev.target.closest('.tcard');
  S.tasks=S.tasks.filter(x=>x.id!==t.id);
  if(overCard&&overCard.dataset.tid!==t.id){
    const i=S.tasks.findIndex(x=>x.id===overCard.dataset.tid);
    S.tasks.splice(i,0,t);
  }else S.tasks.push(t);
  drag=null;render();
}

/* ============ board view ============ */
function progBar(t){
  if(t.progress==null||t.done)return '';
  const b=board(t.boardId);
  return `<div class="t-prog"><div class="t-prog-track"><div style="width:${t.progress}%;background:${b?b.accent:'var(--ink)'}"></div></div><span>${t.progress}%</span></div>`;
}
function taskCard(t){
  const g=t.goalId?goal(t.goalId):null;
  const rt=isRoutine(t);
  return `<div class="tcard ${t.done?'done-card':''} ${rt?'routine-card':''}" draggable="true" data-tid="${t.id}"
      ondragstart="dragTask(event,'${t.id}')" ondragend="dragEnd(event)"
      onclick="openDrawer('${t.id}')">
    ${rt?'<span class="inf" title="An ongoing practice — nothing to check off">∞</span>'
       :`<button class="tick ${t.done?'on':''}" onclick="event.stopPropagation();toggleDone('${t.id}')">
      <svg viewBox="0 0 12 12"><path d="M2 6.5 4.8 9 10 3"/></svg></button>`}
    <div class="t-main">
      <div class="t-title">${esc(t.title)}</div>
      <div class="chips">
        ${urgentChip(t)}
        ${whenChip(t)}
        ${g?`<span class="chip goal-chip">${esc(g.title)}</span>`:''}
      </div>
      ${progBar(t)}

  </div>`;
}
function renderBoard(){

      <input class="board-title-input" value="${esc(b.name)}" size="${Math.max(b.name.length,4)}"

      </div>
      <div class="spacer"></div>
      <div class="seg">
        <button class="${route.mode!=='list'?'on':''}" onclick="route.mode='kanban';render()">Board</button>

function renderKanban(b){
  const cols=b.columns.map(c=>{
    const ts=byUrgent(S.tasks.filter(t=>t.boardId===b.id&&t.colId===c.id));

function passesFilters(t){
  if(filters.status==='open'&&t.done)return false;
  if(filters.status==='done'&&!t.done)return false;
  if(filters.goal!=='all'){
    if(filters.goal==='none'&&t.goalId)return false;
    if(filters.goal!=='none'&&t.goalId!==filters.goal)return false;
  }
  if(filters.due!=='all'){
    const today=todayStr();
    if(filters.due==='overdue'&&!(t.due&&t.due<today&&!t.done))return false;
    if(filters.due==='today'&&t.due!==today)return false;
    if(filters.due==='week'){
      if(!t.due)return false;
      const wk=new Date();wk.setDate(wk.getDate()+7);
      const wks=wk.getFullYear()+'-'+String(wk.getMonth()+1).padStart(2,'0')+'-'+String(wk.getDate()).padStart(2,'0');
      if(t.due>wks||t.due<today)return false;
    }
    if(filters.due==='dated'&&!t.due)return false;
  }
  return true;
}
function renderList(b){
  const goalOpts=S.goals.map(g=>`<option value="${g.id}" ${filters.goal===g.id?'selected':''}>${g.parentId?'— ':''}${esc(g.title)}</option>`).join('');
  const bar=`<div class="filters">
    <select onchange="filters.status=this.value;render()">
      ${['all','open','done'].map(v=>`<option value="${v}" ${filters.status===v?'selected':''}>${v==='all'?'All tasks':v==='open'?'Open':'Done'}</option>`).join('')}
    </select>
    <select onchange="filters.due=this.value;render()">
      ${[['all','Any due date'],['overdue','Overdue'],['today','Due today'],['week','Due this week'],['dated','Has a date']].map(([v,l])=>`<option value="${v}" ${filters.due===v?'selected':''}>${l}</option>`).join('')}
    </select>
    <select onchange="filters.goal=this.value;render()">
      <option value="all">Any goal</option><option value="none" ${filters.goal==='none'?'selected':''}>No goal</option>${goalOpts}
    </select>
  </div>`;
  const groups=b.columns.map(c=>{
    const all=S.tasks.filter(t=>t.boardId===b.id&&t.colId===c.id);
    const ts=byUrgent(all.filter(passesFilters));
    const rows=ts.map(t=>{
      const g=t.goalId?goal(t.goalId):null;
      const rt=isRoutine(t);
      return `<div class="lrow ${t.done?'done-card':''} ${rt?'routine-card':''}" onclick="openDrawer('${t.id}')">
        ${rt?'<span class="inf">∞</span>'
           :`<button class="tick ${t.done?'on':''}" onclick="event.stopPropagation();toggleDone('${t.id}')">
          <svg viewBox="0 0 12 12"><path d="M2 6.5 4.8 9 10 3"/></svg></button>`}
        <span class="t-title">${esc(t.title)}</span>
        <span class="lmeta">
          ${urgentChip(t)}
          ${t.progress!=null&&!t.done?`<span class="chip">${t.progress}%</span>`:''}
          ${g?`<span class="chip goal-chip">${esc(g.title)}</span>`:''}
          ${whenChip(t)}
        </span>
      </div>`;
    }).join('');
    const hiddenN=all.length-ts.length;
    return `<div class="lsec">
      <div class="list-group-name" onclick="toggleFold('${b.id}','${c.id}')">
        <span class="caret">${c.folded?'▸':'▾'}</span>${esc(c.name)}
        <span class="col-count">${ts.length}${hiddenN?' · '+hiddenN+' filtered out':''}</span>
        ${c.kind==='routine'?'<span class="col-count">∞</span>':''}
      </div>
      ${c.folded?'':`<div class="lsec-body">${rows||''}
        <button class="add-inline" onclick="quickAddList(event,'${b.id}','${c.id}')">+ Add task</button></div>`}
    </div>`;
  }).join('');
  return `<div class="list-wrap">${bar}${groups}</div>`;
}
function toggleFold(bid,cid){

  c.folded=!c.folded;render();
}
function quickAddList(ev,bid,cid){

function toggleDone(id){
  const t=S.tasks.find(t=>t.id===id);

    if(t.colId!==dc.id){t.prevColId=t.colId;t.colId=dc.id;}
  }else{
    const cur=colOf(t);
    if(t.prevColId&&b.columns.some(c=>c.id===t.prevColId)&&cur&&/^done$/i.test(cur.name.trim()))
      t.colId=t.prevColId;                                    // untick sends it home
    t.prevColId=null;
  }
  touch(t);
  render();
}

function t_set(k,v){

  t[k]=(k==='title'||k==='note')?v.trim()||t[k]:v;

  if(k==='start'&&v&&t.end&&t.end<=v)t.end=null;   // drop a now-invalid end
  touch(t);save();
  if(k!=='title'&&k!=='note')openDrawer(drawerTask); // refresh chips & gcal link
}
function t_setProg(v,final){

  touch(t);save();
  if(final)openDrawer(drawerTask);

function g_add(parentId){

}
function g_rename(id,v){const g=goal(id);if(g&&v.trim())g.title=v.trim();save();}
function g_delete(id){
  const kids=S.goals.filter(g=>g.parentId===id);
  if(!confirm('Delete this goal'+(kids.length?' and its sub-goals':'')+'? Linked tasks stay, just unlinked.'))return;

/* ============ calendar ============ */
let calCur=null;          // {y,m,d} — anchor date
let calMode='month';      // 'month' | 'week'
const dstr=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const hmToMin=hm=>{const[a,b]=(hm||'0:0').split(':').map(Number);return a*60+(b||0);};
function calCellHTML(d,inMonth,extra,byDate,gByDate,today){
  const ds=dstr(d);
  const ts=byDate[ds]||[], gs=(gByDate&&gByDate[ds])||[];
  return `<div class="cal-cell ${extra} ${inMonth?'':'cal-out'} ${ds===today?'cal-today':''}">
    <div class="cal-dnum"><span>${d.getDate()}</span></div>
    ${ts.map(t=>{const b=board(t.boardId);
      return `<div class="cal-ev ${t.done?'done':''}" onclick="openDrawer('${t.id}')" title="${esc(b?b.name:'')} — ${esc(t.title)}">
        <span class="dot" style="background:${b?b.accent:'#999'}"></span>
        ${t.urgent?'<span class="cal-urg">!</span>':''}
        ${t.start?`<span class="cal-time">${fmtSlot(t)}</span>`:''}
        <span class="cal-ev-t">${esc(t.title)}</span>
      </div>`;}).join('')}
    ${gs.map(e=>`<div class="cal-ev gcal" title="From Google Calendar">
        <span class="gc-mark">G</span>
        ${e.start?`<span class="cal-time">${fmtSlot(e)}</span>`:''}
        <span class="cal-ev-t">${esc(e.title)}</span>
      </div>`).join('')}
  </div>`;
}
/* week as a vertical agenda — the phone-native way to read time */
function renderWeekAgenda(start,byDate,gByDate,today){
  const days=[...Array(7)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
  return '<div class="agenda">'+days.map(d=>{
    const k=dstr(d);
    const ts=byDate[k]||[], gs=gByDate[k]||[];
    const timed=[...ts.filter(t=>t.start).map(t=>({t})),...gs.filter(e=>e.start).map(e=>({e}))]
      .sort((a,b)=>hmToMin((a.t||a.e).start)-hmToMin((b.t||b.e).start));
    const allday=[...ts.filter(t=>!t.start).map(t=>({t})),...gs.filter(e=>!e.start).map(e=>({e}))];
    const rows=[...timed,...allday].map(x=>{
      if(x.t){const t=x.t,b=board(t.boardId);
        return `<div class="ag-row ${t.done?'done-card':''}" onclick="openDrawer('${t.id}')">
          <span class="ag-time">${t.start?fmtSlot(t):'all day'}</span>
          <span class="dot" style="background:${b?b.accent:'#999'}"></span>
          ${t.urgent?'<span class="cal-urg">!</span>':''}
          <span class="ag-t ${t.done?'ag-done':''}">${esc(t.title)}</span></div>`;}
      const e=x.e;
      return `<div class="ag-row ag-gcal">
        <span class="ag-time">${e.start?fmtSlot(e):'all day'}</span>
        <span class="gc-mark">G</span><span class="ag-t">${esc(e.title)}</span></div>`;
    }).join('');
    return `<div class="ag-day ${k===today?'ag-today':''}">
      <div class="ag-head">${d.toLocaleDateString('en-US',{weekday:'long'})}
        <b>${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</b>
        ${k===today?'<span class="ag-now">today</span>':''}</div>
      ${rows||'<div class="ag-empty">nothing planned — breathe</div>'}
    </div>`;
  }).join('')+'</div>';
}
/* week with hours — timed tasks and calendar events as duration blocks */
function renderWeekGrid(start,byDate,gByDate,today){
  const S_MIN=0, E_MIN=24*60, PPH=48;   // full day, midnight to midnight
  const days=[...Array(7)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
  const heads=days.map(d=>{
    const k=dstr(d);
    const ts=(byDate[k]||[]).filter(t=>!t.start), gs=(gByDate[k]||[]).filter(e=>!e.start);
    return `<div class="wk-day-head ${k===today?'wk-today':''}">
      <div class="wk-dn">${d.toLocaleDateString('en-US',{weekday:'short'})} <b>${d.getDate()}</b></div>
      <div class="wk-allday">
        ${ts.map(t=>{const b=board(t.boardId);
          return `<div class="cal-ev ${t.done?'done':''}" onclick="openDrawer('${t.id}')">
            <span class="dot" style="background:${b?b.accent:'#999'}"></span>
            ${t.urgent?'<span class="cal-urg">!</span>':''}
            <span class="cal-ev-t">${esc(t.title)}</span></div>`;}).join('')}
        ${gs.map(e=>`<div class="cal-ev gcal"><span class="gc-mark">G</span><span class="cal-ev-t">${esc(e.title)}</span></div>`).join('')}
      </div></div>`;
  }).join('');
  const gutter=[...Array((E_MIN-S_MIN)/60)].map((_,i)=>{
    const h=S_MIN/60+i;return `<div class="wk-hour">${h%12||12}${h<12?'am':'pm'}</div>`;}).join('');
  const n=new Date(), nowMin=n.getHours()*60+n.getMinutes();
  const cols=days.map(d=>{
    const k=dstr(d);
    const items=[
      ...(byDate[k]||[]).filter(t=>t.start).map(t=>({t})),
      ...(gByDate[k]||[]).filter(e=>e.start).map(e=>({e}))
    ];
    const blocks=items.map(x=>{
      const it=x.t||x.e;
      const s=Math.max(hmToMin(it.start),S_MIN);
      const en=Math.min(it.end?hmToMin(it.end):hmToMin(it.start)+60,E_MIN);
      const top=(s-S_MIN)/60*PPH, h=Math.max(24,(en-s)/60*PPH);
      if(x.t){
        const b=board(x.t.boardId);
        return `<div class="wk-ev ${x.t.done?'done':''}" style="top:${top}px;height:${h}px;--acc:${b?b.accent:'#999'}"
          onclick="openDrawer('${x.t.id}')">
          <span class="wk-ev-time">${fmtSlot(x.t)}</span><span class="wk-ev-t">${x.t.urgent?'<span class="cal-urg">! </span>':''}${esc(x.t.title)}</span></div>`;
      }
      return `<div class="wk-ev gcal" style="top:${top}px;height:${h}px" title="From Google Calendar">
        <span class="wk-ev-time">${fmtSlot(x.e)}</span><span class="wk-ev-t">${esc(x.e.title)}</span></div>`;
    }).join('');
    const now=(k===today&&nowMin>=S_MIN&&nowMin<=E_MIN)
      ?`<div class="wk-now" style="top:${(nowMin-S_MIN)/60*PPH}px"></div>`:'';
    return `<div class="wk-col ${k===today?'wk-today':''}">${blocks}${now}</div>`;
  }).join('');
  return `<div class="wk">
    <div class="wk-row"><div class="wk-gutter-head"></div>${heads}</div>
    <div class="wk-row"><div class="wk-gutter">${gutter}</div>${cols}</div>
  </div>`;
}
function renderCal(){
  if(!calCur){const n=new Date();calCur={y:n.getFullYear(),m:n.getMonth(),d:n.getDate()};}
  const today=todayStr();
  const byDate={};
  S.tasks.forEach(t=>{if(t.due)(byDate[t.due]=byDate[t.due]||[]).push(t);});
  Object.values(byDate).forEach(a=>a.sort((x,z)=>{
    const u=(z.urgent?1:0)-(x.urgent?1:0); if(u)return u;
    return (x.start||'99')<(z.start||'99')?-1:1;}));
  const gByDate={};
  const syncedIds=new Set(S.tasks.filter(t=>t.gcalId).map(t=>t.gcalId));
  (S.gcal||[]).forEach(e=>{if(e.date&&!syncedIds.has(e.id))(gByDate[e.date]=gByDate[e.date]||[]).push(e);});
  Object.values(gByDate).forEach(a=>a.sort((x,z)=>(x.start||'99')<(z.start||'99')?-1:1));
  let label, body;
  if(calMode==='week'){
    const a=new Date(calCur.y,calCur.m,calCur.d);
    const start=new Date(a); start.setDate(a.getDate()-a.getDay());
    const end=new Date(start); end.setDate(start.getDate()+6);
    const f=(d,o)=>d.toLocaleDateString('en-US',o);
    label=start.getMonth()===end.getMonth()
      ? f(start,{month:'long'})+' '+start.getDate()+' – '+end.getDate()+', '+end.getFullYear()
      : f(start,{month:'short',day:'numeric'})+' – '+f(end,{month:'short',day:'numeric'})+', '+end.getFullYear();
    const NARROW=window.matchMedia&&matchMedia('(max-width:700px)').matches;
    body=NARROW?renderWeekAgenda(start,byDate,gByDate,today):renderWeekGrid(start,byDate,gByDate,today);
  }else{
    const {y,m}=calCur;
    const startDow=new Date(y,m,1).getDay(), daysIn=new Date(y,m+1,0).getDate();
    const total=Math.ceil((startDow+daysIn)/7)*7;
    let cells='';
    for(let i=0;i<total;i++){
      const dnum=i-startDow+1, d=new Date(y,m,dnum);
      cells+=calCellHTML(d,dnum>=1&&dnum<=daysIn,'',byDate,gByDate,today);
    }
    label=new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    body=`<div class="cal-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}</div>`;
  }
  return `<div class="view-head">
      <div class="view-title">Calendar</div>
      <div class="view-sub">every dated task in its place in time — click one to open it</div>
      <div class="spacer"></div>
      <div class="cal-nav">
        <div class="seg">
          <button class="${calMode==='month'?'on':''}" onclick="calMode='month';render()">Month</button>
          <button class="${calMode==='week'?'on':''}" onclick="calMode='week';calJump=1;render()">Week</button>
        </div>
        <span class="cal-nav-btns">
          <button class="cal-nb" onclick="calShift(-1)" title="Previous">‹</button>
          <button class="cal-nb" onclick="calCur=null;calJump=1;render()">Today</button>
          <button class="cal-nb" onclick="calShift(1)" title="Next">›</button>
        </span>
      </div>
    </div>
    <div class="cal-month h-serif">${label}</div>
    ${body}`;
}
function calShift(n){
  const d=new Date(calCur.y,calCur.m,calCur.d);
  if(calMode==='week')d.setDate(d.getDate()+7*n); else d.setMonth(d.getMonth()+n,1);
  calCur={y:d.getFullYear(),m:d.getMonth(),d:d.getDate()};render();
}

/* ============ priorities (expanded master) ============ */
function ptCard(t){
  const b=board(t.boardId), g=t.goalId?goal(t.goalId):null;
  return `<div class="tcard" draggable="true" data-tid="${t.id}"
      ondragstart="dragTask(event,'${t.id}')" ondragend="dragEnd(event)"
      onclick="openDrawer('${t.id}')">
    <button class="tick" onclick="event.stopPropagation();toggleDone('${t.id}')">
      <svg viewBox="0 0 12 12"><path d="M2 6.5 4.8 9 10 3"/></svg></button>
    <div class="t-main">
      <div class="pt-board"><span class="dot" style="background:${b?b.accent:'#999'};width:6px;height:6px"></span>${esc(b?b.name:'')}</div>
      <div class="t-title">${esc(t.title)}</div>
      <div class="chips">
        ${urgentChip(t)}
        ${whenChip(t)}
        ${g?`<span class="chip goal-chip">${esc(g.title)}</span>`:''}
      </div>
      ${progBar(t)}
    </div>
  </div>`;
}
function renderPriorities(){
  const open=S.tasks.filter(t=>!t.done&&!isRoutine(t));
  const valid=id=>S.priCols.some(c=>c.id===id);
  const horizon=S.priCols.find(c=>/horizon/i.test(c.name));
  const wk=new Date();wk.setDate(wk.getDate()+7);
  const wkS=wk.getFullYear()+'-'+String(wk.getMonth()+1).padStart(2,'0')+'-'+String(wk.getDate()).padStart(2,'0');
  const unassigned=t=>!t.priCol||!valid(t.priCol);
  const doNow=S.priCols.find(c=>/\bnow\b/i.test(c.name))||S.priCols[0];
  const autoHor=t=>!!horizon&&unassigned(t)&&!t.urgent&&(!t.due||t.due>wkS);
  const autoNow=t=>!!doNow&&unassigned(t)&&t.urgent;
  const unsorted=byUrgent(open.filter(t=>unassigned(t)&&!autoHor(t)&&!autoNow(t)));
  const un=unsorted.length?`<div class="col" ondragover="overCol(event)" ondragleave="leaveCol(event)" ondrop="dropPri(event,null)">
      <div class="col-head"><span class="col-name" style="color:var(--ink-faint)">Unsorted</span>
        <span class="col-count">${unsorted.length}</span></div>
      <div class="col-body">${unsorted.map(ptCard).join('')}</div>
    </div>`:'';   // an empty inbox earns its absence
  const cols=S.priCols.map(c=>{
    const ts=byUrgent(open.filter(t=>t.priCol===c.id
      ||(horizon&&c.id===horizon.id&&autoHor(t))
      ||(doNow&&c.id===doNow.id&&autoNow(t))));
    return `<div class="col" ondragover="overCol(event)" ondragleave="leaveCol(event)" ondrop="dropPri(event,'${c.id}')">
      <div class="col-head">
        <span class="col-grip" draggable="true" title="Drag to reorder column"
          ondragstart="dragAnyCol(event,'pricol','${c.id}')" ondragend="dragEnd(event)">⠿</span>
        <input class="col-name" value="${esc(c.name)}" onchange="priRename('${c.id}',this.value)">
        <span class="col-count">${ts.length}</span>
        <button class="col-del" onclick="priDel('${c.id}')">×</button>
      </div>
      <div class="col-body">${ts.map(ptCard).join('')}</div>
    </div>`;
  }).join('');
  return `<div class="view-head">
      <div class="view-title">Priorities</div>
      <div class="view-sub">every open task — urgent jumps straight to Do now!, undated or more than a week out drifts to On the horizon</div>
      <div class="spacer"></div>
      <button class="btn-ghost" onclick="priAdd()">+ Column</button>
    </div>
    ${practicesStrip()}
    <div class="cols">${un}${cols}</div>`;
}
function dropPri(ev,colId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(drag&&drag.type==='pricol'){reorderCols(S.priCols,drag.id,colId);drag=null;render();return;}
  if(!drag||drag.type!=='task')return;
  const t=S.tasks.find(x=>x.id===drag.id); if(!t)return;
  t.priCol=colId||null;
  touch(t);
  const overCard=ev.target.closest('.tcard');
  S.tasks=S.tasks.filter(x=>x.id!==t.id);
  if(overCard&&overCard.dataset.tid!==t.id){
    const i=S.tasks.findIndex(x=>x.id===overCard.dataset.tid);
    S.tasks.splice(i,0,t);
  }else S.tasks.push(t);
  drag=null;render();
}
function priAdd(){
  const n=prompt('Name this priority column:');
  if(!n||!n.trim())return;
  S.priCols.push({id:uid(),name:n.trim()});render();
}
function priRename(id,v){const c=S.priCols.find(c=>c.id===id);if(c&&v.trim())c.name=v.trim();save();}
function priDel(id){
  if(!confirm('Remove this column? Its tasks go back to Unsorted.'))return;
  S.tasks.forEach(t=>{if(t.priCol===id)t.priCol=null;});
  S.priCols=S.priCols.filter(c=>c.id!==id);render();
}

/* ============ the laurels (achievements) ============ */
function renderAch(){
  const pad=n=>String(n).padStart(2,'0');
  const ymd=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
  const today=todayStr();
  const yest=(()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d.getTime());})();
  const wkAgo=Date.now()-7*864e5, moAgo=Date.now()-30*864e5;
  const done=S.tasks.filter(t=>t.done)
    .map(t=>({t,at:t.completedAt||t.createdAt||0}))
    .sort((a,b)=>b.at-a.at);
  const planDone=S.plan.flatMap(e=>e.items.filter(i=>i.done).map(i=>({text:i.text,era:e.era})));
  const nToday=done.filter(x=>x.at&&ymd(x.at)===today).length;
  const nWeek=done.filter(x=>x.at>=wkAgo).length;
  const nMonth=done.filter(x=>x.at>=moAgo).length;
  const total=done.length+planDone.length;
  /* hero line */
  let hero;
  if(total===0)hero='Nothing here yet — and that’s fine. The first checkmark is the hardest one. Go get it.';
  else if(nToday>=5)hero=nToday+' finished today. Unstoppable is a word for days like this.';
  else if(nToday>=1)hero=nToday+(nToday===1?' thing':' things')+' done today — momentum looks good on you.';
  else if(nWeek>=1)hero=nWeek+' this week. The record keeps growing.';
  else hero='The record stands at '+total+'. It only ever goes up.';
  /* milestones */
  const MS=[[1,'First stroke'],[5,'Warming up'],[10,'Ten strong'],[25,'Twenty-five deep'],
            [50,'Half a hundred'],[100,'The hundred club'],[250,'Force of nature']];
  const badges=MS.map(([n,name])=>{
    if(total>=n)return `<span class="badge"><span class="st">✦</span>${name}<span class="muted small">${n}</span></span>`;
    return '';
  }).join('');
  const next=MS.find(([n])=>total<n);
  const nextBadge=next?`<span class="badge locked"><span class="st">✧</span>${next[1]}<span class="muted small">${next[0]-total} to go</span></span>`:'';
  /* stats */
  const stats=`<div class="ach-stats">
    ${[[nToday,'today'],[nWeek,'this week'],[nMonth,'this month'],[total,'all time']].map(([n,l])=>
      `<div class="ach-stat"><div class="ach-n h-serif">${n}</div><div class="d-label" style="margin:0">${l}</div></div>`).join('')}
  </div>`;
  /* intentions realized */
  const intentions=planDone.length?`
    <div class="list-group-name" style="cursor:default">Intentions realized</div>
    ${planDone.map(p=>`<div class="ach-row"><span class="ach-check" style="color:var(--ochre)">◆</span>
      <span class="ach-t" style="font-family:var(--serif);font-style:italic;font-size:15px">${esc(p.text)}</span>
      <span class="b-tag">${esc(p.era)}</span></div>`).join('')}`:'';
  /* timeline groups */
  const groups=[];
  const push=(label,x)=>{let g=groups.find(g=>g.label===label);
    if(!g){g={label,items:[]};groups.push(g);}g.items.push(x);};
  done.forEach(x=>{
    if(!x.at){push('Some time ago',x);return;}
    const ds=ymd(x.at);
    if(ds===today)push('Today',x);
    else if(ds===yest)push('Yesterday',x);
    else if(x.at>=wkAgo)push('Earlier this week',x);
    else push(new Date(x.at).toLocaleDateString('en-US',{month:'long',year:'numeric'}),x);
  });
  const timeline=groups.map(g=>`
    <div class="list-group-name" style="cursor:default">${g.label}
      <span class="col-count">${g.items.length}</span></div>
    ${g.items.map(x=>{
      const b=board(x.t.boardId), gl=x.t.goalId?goal(x.t.goalId):null;
      const when=!x.at?'':(ymd(x.at)===today
        ?new Date(x.at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
        :new Date(x.at).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
      return `<div class="ach-row" onclick="openDrawer('${x.t.id}')">
        <span class="ach-check">✓</span>
        <span class="ach-t">${esc(x.t.title)}</span>
        ${gl?`<span class="chip goal-chip">${esc(gl.title)}</span>`:''}
        <span class="b-tag">${esc(b?b.name:'')}</span>
        <span class="muted small" style="margin-left:auto;flex-shrink:0">${when}</span>
      </div>`;}).join('')}`).join('');
  return `<div class="view-head">
      <div class="view-title">The Laurels</div>
      <div class="view-sub">everything you have finished — kept, counted, and celebrated</div>
    </div>
    <div class="ach-hero">${hero}</div>
    ${stats}
    <div class="badges">${badges}${nextBadge}</div>
    <div class="ach-wrap">${intentions}${timeline||''}</div>`;
}

/* ============ claude — the resident reviewer ============ */
function renderClaude(){
  const now=Date.now(), today=todayStr();
  const open=S.tasks.filter(t=>!t.done&&!isRoutine(t));
  const taskOf=id=>S.tasks.find(t=>t.id===id);
  const bAcc=t=>{const b=board(t.boardId);return b?b.accent:'#999';};
  const bName=t=>{const b=board(t.boardId);return b?b.name:'';};
  /* my letters — written from our sessions, actionable in place */
  const notes=((S.claude&&S.claude.notes)||[]).filter(n=>{
    if(n.resolved)return false;
    if(n.taskId){const t=taskOf(n.taskId);if(!t||t.done)return false;}
    return true;
  });
  const exc=(s,k)=>s&&s.length>k?s.slice(0,k-1)+'…':(s||'');
  const repliedTo=new Set(((S.claude&&S.claude.inbox)||[]).filter(m=>!m.processed&&m.re).map(m=>m.re));
  const noteHtml=notes.map(n=>{
    const t=n.taskId?taskOf(n.taskId):null;
    return `<div class="cl-note">
      ${n.reText?`<div class="cl-quote">you said: “${esc(exc(n.reText,110))}”</div>`:''}
      <div class="cl-text">${esc(n.text)}</div>
      ${t?`<div class="cl-task"><span class="dot" style="background:${bAcc(t)}"></span>
        <span class="cl-task-t" onclick="openDrawer('${t.id}')">${esc(t.title)}</span>
        <span class="b-tag">${esc(bName(t))}</span>${whenChip(t)}</div>`:''}
      <div class="cl-actions">
        ${(n.actions||[]).map((a,i)=>`<button class="cl-btn ${a.act==='delete'?'danger':''}" onclick="clNoteAct('${n.id}',${i})">${esc(a.label)}</button>`).join('')}
        <button class="cl-btn ghost" onclick="clReply('${n.id}')">Reply</button>
        <button class="cl-btn ghost" onclick="clDismiss('${n.id}')">Not now</button>
      </div>
      <div class="cl-sig">— Claude
        ${repliedTo.has(n.id)?'<span class="cl-replied">↪ your reply is on its way to me</span>':''}
      </div>
    </div>`;
  }).join('');
  /* standing reviews — computed fresh every time */
  const row=(t,btns)=>`<div class="cl-row">
    <span class="dot" style="background:${bAcc(t)}"></span>
    <span class="cl-row-t" onclick="openDrawer('${t.id}')">${esc(t.title)}</span>
    <span class="b-tag">${esc(bName(t))}</span>
    ${whenChip(t)}
    <span class="cl-row-btns">${btns}</span>
  </div>`;
  const btn=(label,fn,danger)=>`<button class="cl-btn ${danger?'danger':''}" onclick="${fn}">${label}</button>`;
  const overdue=open.filter(t=>t.due&&t.due<today);
  const QW=/^(buy|call|book|send|schedule|check|email|text|ask|pay|order|register|renew|clean)\b/i;
  const wins=open.filter(t=>!t.due&&QW.test(t.title)).slice(0,7);
  const stale=open.filter(t=>!t.due&&!t.priCol&&Math.max(t.touchedAt||0,t.createdAt||0)<now-7*864e5).slice(0,10);
  const sec=(title,subtitle,items,empty)=>`
    <div class="list-group-name" style="cursor:default;margin-top:30px">${title}</div>
    <div class="cl-sub">${subtitle}</div>
    ${items.length?items.join(''):`<div class="empty-note">${empty}</div>`}`;
  const overdueHtml=sec('Slipped past their date','honest accounting — reschedule or finish, but don’t let them haunt',
    overdue.map(t=>row(t,btn('Move to today',`clToday('${t.id}')`)+btn('Done ✓',`toggleDone('${t.id}')`))),
    'nothing overdue — a clean conscience');
  const winsHtml=sec('Quick wins on the table','each of these smells like fifteen minutes — knock one out for momentum',
    wins.map(t=>row(t,btn('Today',`clToday('${t.id}')`)+btn('Do now!',`clDoNow('${t.id}')`))),
    'no obvious quick wins right now');
  const staleHtml=sec('Gathering dust','undated, untriaged, untouched for a week — decide: give it a date, or let it go with grace',
    stale.map(t=>row(t,btn('Date today',`clToday('${t.id}')`)+btn('Still matters',`clStill('${t.id}')`)+btn('Let it go',`clDelete('${t.id}')`,true))),
    'nothing abandoned — everything here is either moving or resting on purpose');
  return `<div class="view-head">
      <div class="view-title">Claude <span style="color:var(--ochre);font-size:22px">✦</span></div>
      <div class="view-sub">your resident reviewer — notes from me, plus standing audits of the boards</div>
    </div>
    <div class="cl-wrap">
      <div class="cl-compose">
        <textarea id="clMsg" rows="2" oninput="window.clDraft=this.value"
          placeholder="Write to Claude — instruct, ask, push back. ‘Split the Nature paper into smaller tasks’, ‘date all the gift-buying for Friday’, ‘why the CV nagging?’…">${esc(window.clDraft||'')}</textarea>
        <div class="cl-compose-row">
          <span class="small muted" id="clReplyTag">${(()=>{
            const rn=window.clReplyTo?((S.claude&&S.claude.notes)||[]).find(n=>n.id===window.clReplyTo):null;
            return rn?`replying to: “${esc(exc(rn.text,60))}” <button class="cl-cancel" onclick="clCancelReply()">×</button>`:'';
          })()}</span>
          <span style="display:flex;gap:8px">
            <button class="cl-btn" onclick="clPing()" title="Sync instantly and open our chat">⚡ Ping Claude now</button>
            <button class="btn-ink" onclick="clSend()">Send to Claude</button>
          </span>
        </div>
      </div>
      ${((S.claude&&S.claude.inbox)||[]).filter(m=>!m.processed).map(m=>{
        const rn=m.re?((S.claude&&S.claude.notes)||[]).find(n=>n.id===m.re):null;
        return `<div class="cl-you">
          ${rn?`<div class="cl-quote">↪ replying to: “${esc(exc(rn.text,110))}”</div>`:''}
          <div class="cl-you-t">${esc(m.text)}</div>
          <div class="cl-you-s">sent ✓ — read &amp; acted on within ~2 hours, or use ⚡ to summon me now</div>
        </div>`;}).join('')}
      ${noteHtml||'<div class="empty-note">No new notes from me — write above or ask in our chat, and my reply lands here.</div>'}
      ${overdueHtml}
      ${winsHtml}
      ${staleHtml}
      <div class="cl-foot">Want a deeper review — priorities challenged, boards reorganized, honest opinions? Just tell me in our conversation; I read everything here and write back.</div>
    </div>`;
}
function clToday(id){const t=S.tasks.find(t=>t.id===id);if(!t)return;t.due=todayStr();touch(t);save();render();}
function clDoNow(id){
  const t=S.tasks.find(t=>t.id===id);if(!t)return;
  const c=S.priCols.find(c=>/\bnow\b/i.test(c.name))||S.priCols[0];
  if(c)t.priCol=c.id;touch(t);save();render();
}
function clStill(id){const t=S.tasks.find(t=>t.id===id);if(!t)return;touch(t);save();render();}
function clDelete(id){
  if(!confirm('Let this one go? (It disappears, guilt included.)'))return;
  S.tasks=S.tasks.filter(t=>t.id!==id);save();render();
}
function clDismiss(nid){const n=S.claude.notes.find(n=>n.id===nid);if(n)n.resolved=Date.now();save();render();}
function clReply(nid){
  window.clReplyTo=nid;
  render();
  const el=$('clMsg'); if(el)el.focus();
}
function clCancelReply(){window.clReplyTo=null;render();}
async function clPing(){
  save();
  try{if(typeof GH!=='undefined'&&GH.cfg){clearTimeout(GH.timer);await ghPush();}}catch(e){}
  const tag=$('clReplyTag');
  if(tag)tag.innerHTML='synced ✓ — in our chat, just say <b>“check Atelier”</b> and I’ll act right away';
  window.open('https://claude.ai/','_blank');
}
function clSend(){
  const el=$('clMsg'); if(!el||!el.value.trim())return;
  S.claude.inbox=S.claude.inbox||[];
  S.claude.inbox.push({id:uid(),text:el.value.trim(),re:window.clReplyTo||null,createdAt:Date.now()});
  window.clReplyTo=null; window.clDraft='';
  save();render();
}
function clNoteAct(nid,i){
  const n=S.claude.notes.find(n=>n.id===nid); if(!n)return;
  const a=(n.actions||[])[i]; if(!a)return;
  if(a.act==='date-today'&&n.taskId){const t=S.tasks.find(t=>t.id===n.taskId);if(t){t.due=todayStr();touch(t);}}
  else if(a.act==='do-now'&&n.taskId)clDoNow(n.taskId);
  else if(a.act==='done'&&n.taskId){const t=S.tasks.find(t=>t.id===n.taskId);if(t&&!t.done)toggleDone(n.taskId);}
  else if(a.act==='delete'&&n.taskId)S.tasks=S.tasks.filter(t=>t.id!==n.taskId);
  else if(a.act==='open'&&n.taskId){openDrawer(n.taskId);return;}
  n.resolved=Date.now();save();render();
}

/* ============ life plan ============ */
