/* storage that never throws — some phone/preview contexts forbid localStorage */
let CAN_STORE=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){CAN_STORE=false;}
const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
};
const HOSTED=true;
let S=null,FRESH=false;
try{S=JSON.parse(store.get(KEY));}catch(e){}
if(!S){S=seed();FRESH=true;}   // FRESH: embedded data (if present) replaces the sample seed outright
if(FRESH&&HOSTED){S={meta:{mission:'A calm, intentional season — health, faith, and work that matters.'},masterColumns:[{id:uid(),name:'Now'},{id:uid(),name:'This season'},{id:uid(),name:'Work'},{id:uid(),name:'Someday'}],boards:[],goals:[],tasks:[],plan:[],priCols:null};}
function addHorizonCol(b){
  if(b.columns.some(c=>/on the horizon|^shelved$/i.test(c.name)))return;
  const col={id:uid(),name:'Shelved'};
  b.columns.push(col);
}
function ensureDefaults(){
  if(!S.plan)S.plan=[];
  if(!S.priCols)S.priCols=[{id:uid(),name:'Do now!'},{id:uid(),name:'Do soon'},{id:uid(),name:'Later'}];
  /* "On the horizon" means shelved on a board — so the triage bucket takes a different word */
  (S.priCols||[]).forEach(c=>{if(/^on the horizon$/i.test(c.name.trim()))c.name='Later';});
  if(!S.meta.horizonCols){S.boards.forEach(addHorizonCol);S.meta.horizonCols=true;}
  if(!S.gcal)S.gcal=[];
  /* north stars become first-class — promoted out of the Life Plan chapter that held them */
  if(!S.stars){
    S.stars=[];
    const ns=(S.plan||[]).find(e=>/north star/i.test(e.era));
    if(ns){
      ns.items.forEach(it=>S.stars.push({id:uid(),title:it.text,note:''}));
      S.plan=S.plan.filter(e=>e!==ns);
    }
  }
  /* the plan's items were always goals — promote them, chapters keep only the time */
  if(!S.meta.planGoals){
    (S.plan||[]).forEach(ch=>{
      if(/north star/i.test(ch.era)){ch.items=[];return;}   // those are bearings, not goals
      (ch.items||[]).forEach(it=>{
        let g=S.goals.find(x=>!x.parentId&&x.title.trim().toLowerCase()===String(it.text||'').trim().toLowerCase());
        if(!g){g={id:uid(),parentId:null,title:it.text,note:''};S.goals.push(g);}
        g.era=ch.id;
        if(it.starId&&!g.starId)g.starId=it.starId;
        if(it.done)g.achieved=it.done===true?Date.now():it.done;
      });
      ch.items=[];
    });
    S.meta.planGoals=true;
  }
  if(!S.claude)S.claude={notes:[],inbox:[]};
  if(!S.claude.inbox)S.claude.inbox=[];
  if(!S.rewards)S.rewards=[];
  purgeBuried();
  if(!S.meta.doneIsStatus){
    S.boards.forEach(b=>{
      const done=(b.columns||[]).filter(c=>/^done$/i.test(String(c.name).trim()));
      if(!done.length)return;
      const home=(b.columns||[]).find(c=>!/^done$/i.test(String(c.name).trim())&&c.kind!=='routine');
      done.forEach(dc=>{
        S.tasks.forEach(t=>{
          if(t.boardId!==b.id||t.colId!==dc.id)return;
          const prev=t.prevColId&&b.columns.some(c=>c.id===t.prevColId&&c.id!==dc.id)?t.prevColId:null;
          t.colId=prev||(home?home.id:t.colId);
          t.prevColId=null;
        });
        tombstone(dc.id);
      });
      b.columns=(b.columns||[]).filter(c=>!/^done$/i.test(String(c.name).trim()));
    });
    S.meta.doneIsStatus=true;
  }
  /* One-time, 31 July: a blank Compass — asked for, and repeatedly undone by a stale tab still
     pushing the old goals around. Baked into the build so one refresh settles it on every device.
     Anything created after this instant carries a later birthday and is left alone. */
  if(!S.meta.reset||(S.meta.reset.at||0)<BOOT_RESET)S.meta.reset={at:BOOT_RESET,what:['goals','stars']};
  applyReset();
  /* the shelf got a shorter name */
  S.boards.forEach(b=>b.columns.forEach(c=>{if(/^on the horizon$/i.test((c.name||'').trim()))c.name='Shelved';}));
}
/* A merge keeps whatever exists on either side, so it can never carry a deletion.
   A reset stamp can: whoever wrote it wins once, on every device, then goes quiet. */
const BOOT_RESET=1785505465877;
/* A merge keeps whatever exists on either side — so on its own it can never carry a deletion,
   and anything you delete comes straight back from the other tab. A tombstone is the missing
   half: the id of the thing you removed, and when. It outranks any copy that shows up later. */
function tombstone(){
  S.meta.tomb=S.meta.tomb||{};
  const now=Date.now();
  [].slice.call(arguments).forEach(id=>{if(id)S.meta.tomb[id]=now;});
}
function isBuried(x){return !!(x&&x.id&&S.meta.tomb&&S.meta.tomb[x.id]);}
function purgeBuried(){
  const tomb=S.meta&&S.meta.tomb;
  if(!tomb)return;
  const cut=Date.now()-120*864e5;                       // a tombstone stops mattering after four months
  Object.keys(tomb).forEach(k=>{if(tomb[k]<cut)delete tomb[k];});
  const live=a=>(a||[]).filter(x=>!isBuried(x));
  S.masterColumns=live(S.masterColumns);
  S.boards=live(S.boards);
  S.boards.forEach(b=>{b.columns=live(b.columns);});
  S.goals=live(S.goals);
  S.stars=live(S.stars);
  S.tasks=live(S.tasks);
  S.plan=live(S.plan);
  S.plan.forEach(e=>{e.items=live(e.items);});
  S.priCols=live(S.priCols);
  S.rewards=live(S.rewards);
  if(S.claude){S.claude.notes=live(S.claude.notes);S.claude.inbox=live(S.claude.inbox);}
}
function applyReset(){
  const r=S.meta&&S.meta.reset;
  if(!r||!r.at)return;
  const what=r.what||[];
  /* Runs on every load, not once: a device that hasn't synced yet will keep pushing
     its old copies back, and each of them is older than the reset, so each gets dropped. */
  const older=x=>!x.createdAt||x.createdAt<r.at;
  if(what.indexOf('goals')>=0){
    S.goals.filter(older).forEach(g=>tombstone(g.id));
    S.goals=S.goals.filter(g=>!older(g));
    const live=new Set(S.goals.map(g=>g.id));
    S.tasks.forEach(t=>{if(t.goalId&&!live.has(t.goalId))t.goalId=null;});
  }
  if(what.indexOf('stars')>=0){
    (S.stars||[]).filter(older).forEach(x=>tombstone(x.id));
    S.stars=(S.stars||[]).filter(x=>!older(x));
    const live=new Set(S.stars.map(x=>x.id));
    S.goals.forEach(g=>{if(g.starId&&!live.has(g.starId))g.starId=null;});
    (S.plan||[]).forEach(e=>(e.items||[]).forEach(i=>{if(i.starId&&!live.has(i.starId))i.starId=null;}));
  }
  if(what.indexOf('rewards')>=0)S.rewards=(S.rewards||[]).filter(x=>!older(x));
  S.meta.resetAck=r.at;
}
ensureDefaults();
/* Claude's updates ride inside this file — merged on every load, no file link needed */
function absorbEmbedded(){
  try{
    const el=document.getElementById('claudeData');
    if(!el)return;
    const txt=el.textContent.trim();
    if(!txt||txt.startsWith('__'))return;
    const data=JSON.parse(txt);
    if(data&&data.meta){
      if(FRESH){S=data;FRESH=false;}
      else S=mergeStates(S,data);
      ensureDefaults();
    }
  }catch(e){}
}
function save(){
  S.meta.updatedAt=Date.now();
  store.set(KEY,JSON.stringify(S));
  const el=document.getElementById('saveStamp');
  if(el)el.textContent=CAN_STORE
    ?'Autosaved · '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})

}

/* ============ helpers ============ */
const board=id=>S.boards.find(b=>b.id===id);
const goal=id=>S.goals.find(g=>g.id===id);
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boardTasks=bid=>S.tasks.filter(t=>t.boardId===bid);
const colOf=t=>{const b=board(t.boardId);return b?b.columns.find(c=>c.id===t.colId):null;};
const isRoutine=t=>{const c=colOf(t);return !!(c&&c.kind==='routine');};
/* appointments: commitments AT a time, not work you can knock out early.
   Anything with a start time is one, unless explicitly kept a task. */
const isAppt=t=>t.kind==='appt'||(!t.kind&&!!t.start);
/* a column named "on the horizon" is a shelf — it asks nothing of you today */
const isShelved=t=>{const c=colOf(t);return !!(c&&/on the horizon|^shelved$/i.test(c.name));};
const plusHour=hm=>{           // an appointment with no stated end runs an hour
  let [h,m]=hm.split(':').map(Number);
  h=(h+1)%24;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
};
const endOf=t=>t.end||(t.start?plusHour(t.start):null);
/* ============ natural language capture ============
   "dinner at zuzu's 8:30pm today" → title + date + time, understood as you type. */
const NL_MONTHS={jan:0,january:0,ene:0,enero:0,feb:1,february:1,febrero:1,march:2,marzo:2,apr:3,april:3,abr:3,abril:3,may:4,mayo:4,jun:5,june:5,junio:5,jul:6,july:6,julio:6,aug:7,august:7,ago:7,agosto:7,sep:8,sept:8,september:8,septiembre:8,oct:9,october:9,octubre:9,nov:10,november:10,noviembre:10,dec:11,december:11,dic:11,diciembre:11};
const NL_DOWS={sunday:0,sun:0,domingo:0,dom:0,monday:1,mon:1,lunes:1,lun:1,tuesday:2,tue:2,tues:2,martes:2,wednesday:3,wed:3,miercoles:3,'miércoles':3,mie:3,thursday:4,thu:4,thur:4,thurs:4,jueves:4,jue:4,friday:5,fri:5,viernes:5,vie:5,saturday:6,sat:6,sabado:6,'sábado':6,sab:6};
function nlParse(raw){
  let s=' '+raw+' ';
  const out={due:null,start:null,end:null,urgent:false,title:raw};
  const pad=n=>String(n).padStart(2,'0');
  const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const now=new Date();
  const eat=re=>{const m=s.match(re); if(m)s=s.replace(m[0],' '); return m;};
  const hm=(h,mn,mer)=>{
    h=+h; mn=mn?+mn:0;
    if(mer){mer=mer.toLowerCase();
      if(/^p/.test(mer)&&h<12)h+=12;
      if(/^a/.test(mer)&&h===12)h=0;
    }
    if(h>23||mn>59)return null;
    return pad(h)+':'+pad(mn);
  };
  /* urgency */
  if(/(^|\s)(urgent|urgente|asap|!!)\b/i.test(s)){
    out.urgent=true;
    s=s.replace(/(^|\s)(urgent|urgente|asap|!!)\b[:,;\-\s]*/gi,' ');
  }
  /* spanish meridiem phrases → am/pm markers */
  s=s.replace(/\s(?:de|por)\s+la\s+(mañana|manana)\b/gi,' am')
     .replace(/\s(?:de|por)\s+la\s+(tarde|noche)\b/gi,' pm')
     .replace(/\bp\.?\s?m\.?\b/gi,'pm').replace(/\ba\.?\s?m\.?\b/gi,'am');
  const T='(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm)?';
  /* time range: 8:30-10pm · 5 to 6pm · de 5 a 6pm */
  let m=eat(new RegExp('\\s(?:from|de|desde)?\\s*'+T+'\\s*(?:-|–|—|to|a|hasta|until)\\s*'+T+'\\s','i'));
  if(m&&(m[3]||m[6]||m[2]||m[5])){
    const a=hm(m[1],m[2],m[3]||m[6]), b=hm(m[4],m[5],m[6]);
    if(a&&b){out.start=a;out.end=b;}
  }
  /* single time — needs am/pm, a colon, or an "at / a las / @" cue */
  if(!out.start){
    m=eat(new RegExp('\\s(?:at|@|a\\s+las?|para\\s+las?)\\s*'+T+'\\s','i'))
     ||eat(/\s(\d{1,2}):(\d{2})\s*(am|pm)?\s/i)
     ||eat(/\s(\d{1,2})()\s*(am|pm)\s/i);
    if(m){const a=hm(m[1],m[2],m[3]); if(a)out.start=a;}
  }
  if(eat(/\s(noon|mediod[ií]a)\s/i))out.start=out.start||'12:00';
  if(eat(/\s(midnight|medianoche)\s/i))out.start=out.start||'00:00';
  /* dates, most explicit first */
  const setD=d=>{out.due=ymd(d);};
  if(eat(/\s(today|hoy|tonight|esta\s+noche)\s/i))setD(now);
  else if(eat(/\s(tomorrow|mañana|manana)\s/i)){const d=new Date(now);d.setDate(d.getDate()+1);setD(d);}
  else if((m=eat(/\s(?:in|en)\s+(\d{1,2})\s+(days?|d[ií]as?)\s/i))){const d=new Date(now);d.setDate(d.getDate()+ +m[1]);setD(d);}
  else if(eat(/\s(next\s+week|pr[óo]xima\s+semana)\s/i)){const d=new Date(now);d.setDate(d.getDate()+7);setD(d);}
  else if((m=eat(new RegExp('\\s(next\\s+|pr[óo]ximo\\s+|este\\s+|this\\s+)?('+Object.keys(NL_DOWS).join('|')+')\\s','i')))){
    const target=NL_DOWS[m[2].toLowerCase()], d=new Date(now);
    let diff=(target-d.getDay()+7)%7;

}
function mcolFold(id){

}
/* board management straight from the sidebar */
function sideMenu(bid,ev){

    'Board: '+b.name+
    '\n\nType a new name to rename it,'+
    '\nor a number to move it:   '+cols+
    '\nor "color" to change its accent,'+
    '\nor "delete" to remove it.',b.name);

  }
  if(/^\d+$/.test(v)){

  b.name=v;save();render();
}
function dropSideBoard(ev,targetId){
  ev.preventDefault();ev.stopPropagation();

  const b=board(drag.id), t=board(targetId);
  if(!b||!t||b.id===t.id)return;
  b.masterCol=t.masterCol;                       // adopt the group you were dropped into
  S.boards=S.boards.filter(x=>x.id!==b.id);
  S.boards.splice(S.boards.findIndex(x=>x.id===t.id),0,b);
  drag=null;save();render();
}
function dropSideGroup(ev,mcolId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');

/* ============ master (studio) ============ */
/* how much a board still asks of you: 0 = live work, 1 = only scheduled, 2 = at rest */
function boardTier(b){
  const all=boardTasks(b.id).filter(t=>!t.done&&!isRoutine(t)&&!isShelved(t));
  const open=all.filter(t=>!isAppt(t)&&!t.done).length;
  if(open)return 0;
  const appt=all.filter(t=>isAppt(t)&&!t.done&&(!t.due||t.due>=todayStr())).length;
  return appt?1:2;
}
function boardCard(b){
  const all=boardTasks(b.id).filter(t=>!t.done), rn=all.filter(isRoutine).length;
  const shelved=all.filter(t=>!isRoutine(t)&&isShelved(t)&&!t.done).length;
  const timed=all.filter(t=>!isRoutine(t)&&isAppt(t)&&!isShelved(t));
  const ts=all.filter(t=>!isRoutine(t)&&!isAppt(t)&&!isShelved(t));   // only live work counts
  const open=ts.filter(t=>!t.done).length, done=ts.length-open;
  const p=progress(ts);
  const apptOpen=timed.filter(t=>!t.done&&(!t.due||t.due>=todayStr())).length;
  /* only say something if it asks something of you today */
  const today=todayStr();
  const late=ts.filter(t=>!t.done&&t.due&&t.due<today).length;
  const now=ts.filter(t=>!t.done&&t.due===today).length;
  const call=late?`<div class="bcard-due overdue">${late} overdue</div>`
    :now?`<div class="bcard-due">${now} due today</div>`:'';
  const rest=open===0&&apptOpen===0;          // nothing open at all — fully at rest
  const sched=open===0&&apptOpen>0;           // only appointments left — scheduled is half done
  const alldone=rest&&ts.length>0;            // earned its checkmark by finishing
  return `<div class="bcard ${rest?'bcard-rest':''} ${sched?'bcard-sched':''} ${alldone?'bcard-alldone':''}" draggable="true" data-bid="${b.id}"
      ondragstart="dragBoard(event,'${b.id}')" ondragend="dragEnd(event)"
      onclick="go('board','${b.id}')">
    <div class="bcard-top"><span class="dot" style="background:${b.accent}"></span>
      <span class="bcard-name">${esc(b.name)}</span></div>
    <div class="bcard-meta"><span>${open} open</span><span>${done} done</span>${apptOpen?`<span>◷ ${apptOpen}</span>`:''}${shelved?`<span>${shelved} shelved</span>`:''}${rn?`<span>${rn} routine${rn>1?'s':''}</span>`:''}</div>
    <div class="mini-track"><div class="mini-fill" style="width:${p??0}%;background:${b.accent}"></div></div>
    ${call}
  </div>`;
}
function renderMaster(){
  const cols=S.masterColumns.map(mc=>{
    /* stable sort: your hand-arranged order holds within each tier, quiet boards sink */
    const bs=S.boards.filter(b=>b.masterCol===mc.id).sort((a,c)=>boardTier(a)-boardTier(c));
    return `<div class="col" ondragover="overCol(event)" ondragleave="leaveCol(event)"
        ondrop="dropBoard(event,'${mc.id}')">
      <div class="col-head">
        <span class="col-grip" draggable="true" title="Drag to reorder column"
          ondragstart="dragAnyCol(event,'mcol','${mc.id}')" ondragend="dragEnd(event)">⠿</span>
        <input class="col-name" value="${esc(mc.name)}" onchange="renameMCol('${mc.id}',this.value)">
        <span class="col-count">${bs.length}</span>
        <button class="col-del" title="Remove column" onclick="delMCol('${mc.id}')">×</button>
      </div>
      <div class="col-body">${bs.map(boardCard).join('')}</div>
      <button class="add-inline" onclick="newBoard('${mc.id}')">+ New board</button>
    </div>`;
  }).join('');
  return `<div class="view-head">
      <div class="view-title">The Studio</div>
      <div class="view-sub">your domains, arranged your way — drag boards to reorder priorities</div>
      <div class="spacer"></div>
      <button class="btn-ghost" onclick="newMCol()">+ Column</button>
    </div>
    ${practicesStrip()}
    <div class="cols">${cols}</div>`;
}
function practicesStrip(){
  const routines=S.tasks.filter(isRoutine);
  if(!routines.length)return '';
  return `<div class="practices">
    <span class="practices-label">Practices</span>
    ${routines.map(t=>{const b=board(t.boardId);
      return `<button class="practice" onclick="openDrawer('${t.id}')" title="${esc(b?b.name:'')}">
        <span class="dot" style="background:${b?b.accent:'#999'}"></span><span>${esc(t.title)}</span>
      </button>`;}).join('')}
  </div>`;
}
function newMCol(){S.masterColumns.push({id:uid(),name:'Untitled'});render();}
function renameMCol(id,v){const c=S.masterColumns.find(c=>c.id===id);if(c&&v.trim())c.name=v.trim();save();}
function delMCol(id){
  if(S.boards.some(b=>b.masterCol===id)){alert('Move its boards elsewhere first.');return;}
  if(S.masterColumns.length<=1)return;
  tombstone(id);
  S.masterColumns=S.masterColumns.filter(c=>c.id!==id);render();
}
function newBoard(mcol){
  const name=prompt('Name this board — a domain of your life:');
  if(!name||!name.trim())return;
  S.boards.push({id:uid(),name:name.trim(),accent:ACCENTS[S.boards.length%ACCENTS.length],
    masterCol:mcol,columns:[{id:uid(),name:'To do'},{id:uid(),name:'Soon'},{id:uid(),name:'Shelved'}]});
  render();
}

/* ============ drag & drop ============ */
let drag=null; // {type:'board'|'task'|'plan'|'col'|'mcol'|'pricol', id}
function dragAnyCol(ev,type,id,boardId){
  drag={type,id,boardId};ev.dataTransfer.effectAllowed='move';ev.stopPropagation();
}
function reorderCols(list,dragId,targetId){
  if(dragId===targetId)return list;
  const from=list.findIndex(c=>c.id===dragId);
  if(from<0)return list;
  const [col]=list.splice(from,1);
  const to=targetId?list.findIndex(c=>c.id===targetId):0;
  list.splice(to<0?list.length:to,0,col);
  return list;
}
function dragBoard(ev,id){drag={type:'board',id};ev.target.classList.add('dragging');ev.dataTransfer.effectAllowed='move';}
function dragTask(ev,id){drag={type:'task',id};ev.target.classList.add('dragging');ev.dataTransfer.effectAllowed='move';ev.stopPropagation();}
function dragEnd(ev){ev.target.classList.remove('dragging');}
function overCol(ev){ev.preventDefault();ev.currentTarget.classList.add('drag-over-col');}
function leaveCol(ev){ev.currentTarget.classList.remove('drag-over-col');}
function dropBoard(ev,mcolId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(drag&&drag.type==='mcol'){reorderCols(S.masterColumns,drag.id,mcolId);drag=null;render();return;}
  if(!drag||drag.type!=='board')return;
  const b=board(drag.id); if(!b)return;
  b.masterCol=mcolId;
  // reorder: place before the card we dropped on, if any
  const overCard=ev.target.closest('.bcard');
  S.boards=S.boards.filter(x=>x.id!==b.id);
  if(overCard&&overCard.dataset.bid!==b.id){
    const i=S.boards.findIndex(x=>x.id===overCard.dataset.bid);
    S.boards.splice(i,0,b);
  }else S.boards.push(b);
  drag=null;render();
}
function dropTask(ev,colId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(drag&&drag.type==='col'){reorderCols(board(drag.boardId).columns,drag.id,colId);drag=null;render();return;}
  if(!drag||drag.type!=='task')return;
  const t=S.tasks.find(x=>x.id===drag.id); if(!t)return;
  t.colId=colId;
  const b=board(t.boardId), col=b.columns.find(c=>c.id===colId);
  if(col&&col.kind==='routine'){t.done=false;t.completedAt=null;}
  else if(col&&/done/i.test(col.name)){t.done=true;t.completedAt=Date.now();}
  touch(t);
  const overCard=ev.target.closest('.tcard');
  S.tasks=S.tasks.filter(x=>x.id!==t.id);
  if(overCard&&overCard.dataset.tid!==t.id){
    const i=S.tasks.findIndex(x=>x.id===overCard.dataset.tid);
    S.tasks.splice(i,0,t);
  }else S.tasks.push(t);
  drag=null;render();
}

/* ============ board view ============ */
function progBar(t){

function renderBoard(){

function renderKanban(b){
  const cols=b.columns.map(c=>{

    return `<div class="col" ondragover="overCol(event)" ondragleave="leaveCol(event)" ondrop="dropTask(event,'${c.id}')">
      <div class="col-head">

function passesFilters(t){
  if(filters.status==='open'&&t.done)return false;
  if(filters.status==='done'&&!t.done)return false;
  if(filters.goal!=='all'){
    if(filters.goal==='none'&&t.goalId)return false;
    if(filters.goal!=='none'&&t.goalId!==filters.goal)return false;
  }
  if(filters.due!=='all'){
    const today=todayStr();
    if(filters.due==='overdue'&&!(t.due&&t.due<today&&!t.done))return false;
    if(filters.due==='today'&&t.due!==today)return false;
    if(filters.due==='week'){
      if(!t.due)return false;
      const wk=new Date();wk.setDate(wk.getDate()+7);
      const wks=wk.getFullYear()+'-'+String(wk.getMonth()+1).padStart(2,'0')+'-'+String(wk.getDate()).padStart(2,'0');
      if(t.due>wks||t.due<today)return false;
    }
    if(filters.due==='dated'&&!t.due)return false;
  }
  return true;
}
function renderList(b){
  const goalOpts=S.goals.map(g=>`<option value="${g.id}" ${filters.goal===g.id?'selected':''}>${g.parentId?'— ':''}${esc(g.title)}</option>`).join('');
  const bar=`<div class="filters">
    <select onchange="filters.status=this.value;render()">
      ${['all','open','done'].map(v=>`<option value="${v}" ${filters.status===v?'selected':''}>${v==='all'?'All tasks':v==='open'?'Open':'Done'}</option>`).join('')}
    </select>
    <select onchange="filters.due=this.value;render()">
      ${[['all','Any due date'],['overdue','Overdue'],['today','Due today'],['week','Due this week'],['dated','Has a date']].map(([v,l])=>`<option value="${v}" ${filters.due===v?'selected':''}>${l}</option>`).join('')}
    </select>
    <select onchange="filters.goal=this.value;render()">
      <option value="all">Any goal</option><option value="none" ${filters.goal==='none'?'selected':''}>No goal</option>${goalOpts}
    </select>
  </div>`;
  const groups=b.columns.map(c=>{
    const all=S.tasks.filter(t=>t.boardId===b.id&&t.colId===c.id&&!t.done);
    const ts=byUrgent(all.filter(passesFilters));
    const rows=ts.map(t=>{
      const g=t.goalId?goal(t.goalId):null;
      const rt=isRoutine(t);
      return `<div class="lrow ${t.done?'done-card':''} ${rt?'routine-card':''}" onclick="openDrawer('${t.id}')">
        ${rt?'<span class="inf">∞</span>'
           :`<button class="tick ${t.done?'on':''}" onclick="event.stopPropagation();toggleDone('${t.id}')">
          <svg viewBox="0 0 12 12"><path d="M2 6.5 4.8 9 10 3"/></svg></button>`}
        <span class="t-title">${esc(t.title)}</span>
        <span class="lmeta">
          ${urgentChip(t)}
          ${t.progress!=null&&!t.done?`<span class="chip">${t.progress}%</span>`:''}
          ${g?`<span class="chip goal-chip">${esc(g.title)}</span>`:''}
          ${whenChip(t)}
        </span>
      </div>`;
    }).join('');
    const hiddenN=all.length-ts.length;
    return `<div class="lsec">
      <div class="list-group-name" onclick="toggleFold('${b.id}','${c.id}')">
        <span class="caret">${c.folded?'▸':'▾'}</span>${esc(c.name)}
        <span class="col-count">${ts.length}${hiddenN?' · '+hiddenN+' filtered out':''}</span>
        ${c.kind==='routine'?'<span class="col-count">∞</span>':''}
      </div>
      ${c.folded?'':`<div class="lsec-body">${rows||''}
        <button class="add-inline" onclick="quickAddList(event,'${b.id}','${c.id}')">+ Add task</button></div>`}
    </div>`;
  }).join('');
  return `<div class="list-wrap">${bar}${groups}</div>`;
}
function toggleFold(bid,cid){
  const c=board(bid).columns.find(c=>c.id===cid);
  c.folded=!c.folded;render();
}
function quickAddList(ev,bid,cid){

/* board ops */
function b_rename(id,v){const b=board(id);if(b&&v.trim())b.name=v.trim();save();}
function b_accent(id,a){board(id).accent=a;render();}
function b_delete(id){
  const n=boardTasks(id).length;
  if(!confirm('Delete this board'+(n?' and its '+n+' task(s)':'')+'?'))return;
  tombstone.apply(null,[id].concat(boardTasks(id).map(t=>t.id),
    (board(id).columns||[]).map(c=>c.id)));
  S.tasks=S.tasks.filter(t=>t.boardId!==id);
  S.boards=S.boards.filter(b=>b.id!==id);
  go('master');
}
function colRename(bid,cid,v){const c=board(bid).columns.find(c=>c.id===cid);if(c&&v.trim())c.name=v.trim();save();}
function colAdd(bid){board(bid).columns.push({id:uid(),name:'Untitled'});render();}
function colKind(bid,cid){
  const c=board(bid).columns.find(c=>c.id===cid);
  if(c.kind==='routine')delete c.kind; else{c.kind='routine';
    S.tasks.forEach(t=>{if(t.boardId===bid&&t.colId===cid){t.done=false;t.completedAt=null;}});}
  render();
}
function colDel(bid,cid){
  const b=board(bid);
  if(S.tasks.some(t=>t.boardId===bid&&t.colId===cid)){alert('Move or finish its tasks first.');return;}
  if(b.columns.length<=1)return;
  tombstone(cid);
  b.columns=b.columns.filter(c=>c.id!==cid);render();
}
/* one smart composer, used by every quick-add in the app */
function nlComposer(container,before,bid,cid){
  if(container.querySelector('.ghost-new'))return;
  const box=document.createElement('div');
  box.className='ghost-box';
  const inp=document.createElement('input');
  inp.className='ghost-new';
  inp.placeholder='What needs doing?  “dinner at Zuzu’s 8:30pm today”';
  const hint=document.createElement('div');
  hint.className='ghost-hint';
  box.appendChild(inp);box.appendChild(hint);
  if(before)container.insertBefore(box,before); else container.appendChild(box);
  inp.focus();
  let doneAdding=false;
  const refresh=()=>{
    const v=inp.value.trim();
    const h=v?nlHint(nlParse(v)):'';
    hint.innerHTML=h;hint.style.display=h?'block':'none';
  };
  const commit=()=>{
    if(doneAdding)return; doneAdding=true;
    const v=inp.value.trim();
    if(v){
      const p=nlParse(v);
      S.tasks.push({id:uid(),boardId:bid,colId:cid,title:p.title,note:'',
        due:p.due,start:p.start,end:p.end,urgent:p.appt?false:(p.urgent||undefined),
        kind:p.appt?'appt':'task',       // a stated hour, or a word like "dinner", means be there
        done:false,goalId:null,createdAt:Date.now(),touchedAt:Date.now()});
    }
    render();
  };
  inp.addEventListener('input',refresh);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){doneAdding=true;render();}});
  inp.addEventListener('blur',commit);
}
function quickAdd(bid,cid,btn){
  nlComposer(btn.parentElement.querySelector('.col-body'),null,bid,cid);
}
/* Finishing something doesn't move it. It stays in the column it belongs to — which is what
   lets a key result count "3 of 7 in Uni · Nature" instead of watching its own denominator
   walk away. Done work simply stops being shown, everywhere except the Laurels. */
function toggleDone(id){
  const t=S.tasks.find(t=>t.id===id);
  if(!t)return;
  t.done=!t.done;
  t.completedAt=t.done?Date.now():null;
  touch(t);
  render();
}

  $('drawer').innerHTML=`
    <button class="d-close" onclick="closeDrawer()">×</button>

                :'Mark finished'}</button>
      <div class="kind-note">${t.done
        ?'It keeps its place on the board — it just stops being shown until you look at the Laurels.'

    ${appt?'':`<div class="d-field"><div class="d-label">Urgency</div>
      <button class="urgent-toggle ${t.urgent?'on':''}" onclick="t_toggleUrgent()">
        ${t.urgent?'! Urgent — floats to the top everywhere':'Mark as urgent'}</button></div>`}
    <div class="d-field"><div class="d-label">Date</div>
      <input type="date" value="${t.due||''}" onchange="t_set('due',this.value||null)"></div>
    <div class="d-field"><div class="d-label">Time slot ${t.start?'':'<span style="text-transform:none;letter-spacing:0;font-size:11px">— optional</span>'}</div>
      <div class="time-row">
        <input type="time" value="${t.start||''}" onchange="t_set('start',this.value||null)">
        <span class="muted">to</span>
        <input type="time" value="${t.end||''}" onchange="t_set('end',this.value||null)">
        ${t.start?`<button class="btn-ghost" onclick="t_clearTime()">clear</button>`:''}
      </div>
      ${t.start&&!t.end?`<div class="kind-note">Ends ${fmtTime(plusHour(t.start))} — an hour, unless you say otherwise.</div>`:''}</div>
    ${appt?'':`<div class="d-field"><div class="d-label">Priority (master board)</div>
      <select onchange="t_set('priCol',this.value||null)">

      </select></div>
    <div class="d-field"><div class="d-label">Progress ${t.progress==null?'<span style="text-transform:none;letter-spacing:0;font-size:11px">— optional, for things that advance in steps</span>':''}</div>
      <div class="prog-row">
        <input type="range" min="0" max="100" step="5" value="${t.progress??0}"
          oninput="t_setProg(this.value)" onchange="t_setProg(this.value,true)">
        <span class="prog-val">${t.progress!=null?t.progress+'%':'—'}</span>
        ${t.progress!=null?`<button class="btn-ghost" onclick="t_clearProg()">clear</button>`:''}
      </div></div>
    <div class="d-field"><div class="d-label">Focus time</div>
      <button class="cl-btn" onclick="t_blockTime()" title="Create an appointment reserved for this task">◷ Block time for this</button></div>`}
    <div class="d-field"><div class="d-label">Linked goal</div>
      <select onchange="t_set('goalId',this.value||null)">${goalOpts}</select></div>
    <div class="d-field"><div class="d-label">Notes</div>
      <textarea class="d-notes" placeholder="Anything worth remembering…" onchange="t_set('note',this.value)">${esc(t.note)}</textarea></div>
    <div class="d-actions">
      <span class="small muted">${t.due
        ?(needsSync(t)?'Waiting for the calendar — send them from the Calendar page.':'On your Google Calendar ✓')
        :'No date — nothing to put on the calendar.'}</span>
      <button class="d-delete" onclick="t_delete()">Delete task</button>
    </div>`;
  $('drawer').classList.add('open');$('scrim').classList.add('open');
}
function closeDrawer(){drawerTask=null;$('drawer').classList.remove('open');$('scrim').classList.remove('open');render();}
function t_set(k,v){
  const t=S.tasks.find(x=>x.id===drawerTask); if(!t)return;
  t[k]=(k==='title'||k==='note')?v.trim()||t[k]:v;
  if(k==='start'&&v&&!t.due)t.due=todayStr();      // a time implies a day
  if(k==='start'&&v&&t.end&&t.end<=v)t.end=null;   // drop a now-invalid end
  touch(t);save();
  if(k!=='title'&&k!=='note')openDrawer(drawerTask); // refresh chips & gcal link
}
function t_setProg(v,final){
  const t=S.tasks.find(x=>x.id===drawerTask); if(!t)return;
  t.progress=Math.max(0,Math.min(100,+v));
  const el=document.querySelector('.prog-val'); if(el)el.textContent=t.progress+'%';
  touch(t);save();
  if(final)openDrawer(drawerTask);
}
function t_clearProg(){
  const t=S.tasks.find(x=>x.id===drawerTask);
  t.progress=null;touch(t);save();openDrawer(drawerTask);
}
function t_toggleUrgent(){
  const t=S.tasks.find(x=>x.id===drawerTask);
  t.urgent=!t.urgent;touch(t);save();openDrawer(drawerTask);
}
function t_setKind(k){
  const t=S.tasks.find(x=>x.id===drawerTask); if(!t)return;
  t.kind=k;
  if(k==='appt'){t.urgent=false;t.priCol=null;t.progress=null;if(!t.due)t.due=todayStr();}
  touch(t);save();openDrawer(drawerTask);
}
function t_blockTime(){
  const t=S.tasks.find(x=>x.id===drawerTask); if(!t)return;
  const n=new Date(); let h=n.getHours()+1; if(h>22)h=9;
  const p=x=>String(x).padStart(2,'0');
  const a={id:uid(),boardId:t.boardId,colId:t.colId,title:t.title,note:'',
    due:t.due&&t.due>=todayStr()?t.due:todayStr(),start:p(h)+':00',end:p((h+1)%24)+':00',
    kind:'appt',blockFor:t.id,done:false,goalId:t.goalId||null,
    createdAt:Date.now(),touchedAt:Date.now()};
  S.tasks.push(a);save();openDrawer(a.id);
}
function t_clearTime(){
  const t=S.tasks.find(x=>x.id===drawerTask);
  t.start=null;t.end=null;touch(t);save();openDrawer(drawerTask);
}
function t_setCol(cid){
  const t=S.tasks.find(x=>x.id===drawerTask);
  t.colId=cid;
  const col=board(t.boardId).columns.find(c=>c.id===cid);
  if(col&&/done/i.test(col.name)){t.done=true;t.completedAt=Date.now();}
  touch(t);save();
}
function t_delete(){
  if(!confirm('Delete this task?'))return;
  tombstone(drawerTask);
  S.tasks=S.tasks.filter(t=>t.id!==drawerTask);
  closeDrawer();
}

/* ============ goals (OKR) ============ */
function renderGoals(){
  const tops=S.goals.filter(g=>!g.parentId);
  const blocks=tops.map(g=>{
    const subs=S.goals.filter(s=>s.parentId===g.id);
    const all=goalTaskSet(g.id), p=progress(all);
    const own=S.tasks.filter(t=>t.goalId===g.id&&!isRoutine(t));
    const taskRow=t=>{
      const b=board(t.boardId);
      return `<div class="linked-t ${t.done?'done':''}" onclick="go('board','${t.boardId}');openDrawer('${t.id}')">
        <span>${t.done?'✓':'○'}</span><span>${esc(t.title)}</span>
        <span class="b-tag">${esc(b?b.name:'')}</span>
        ${t.due?`<span class="small muted">${fmtDue(t.due)}</span>`:''}
        ${t.urgent?'<span class="chip urgent-chip">!</span>':''}
      </div>`;
    };
    const subRows=subs.map(s=>{
      const st=S.tasks.filter(t=>t.goalId===s.id&&!isRoutine(t)), sp=progress(st);
      return `<div class="sub-block">
        <div class="sub-row">
          <input class="sub-title-in" value="${esc(s.title)}" onchange="g_rename('${s.id}',this.value)">
          <span class="small muted">${st.length?st.filter(t=>t.done).length+' / '+st.length:'no tasks yet'}</span>
          <div class="sub-track"><div class="fill" style="width:${sp??0}%"></div></div>
          <div class="goal-tools"><button class="btn-ghost" onclick="g_delete('${s.id}')">×</button></div>
        </div>
        <div class="sub-tasks">${st.map(taskRow).join('')||'<div class="sub-empty">no tasks yet — link some from any task’s drawer</div>'}</div>
      </div>`;
    }).join('');
    const linkedRows=own.map(taskRow).join('');
    return `<div class="goal-block">
      <div class="goal-row">
        <input class="goal-title-in" value="${esc(g.title)}" onchange="g_rename('${g.id}',this.value)">
        <span class="goal-pct">${p===null?'no tasks yet':p+'% · '+all.filter(t=>t.done).length+' of '+all.length}</span>
        <div class="goal-tools"><button class="btn-ghost" onclick="g_delete('${g.id}')">delete</button></div>
      </div>
      <div class="track"><div class="fill" style="width:${p??0}%"></div></div>
      <div class="subgoals">${subRows}
        <button class="add-inline" onclick="g_add('${g.id}',this.parentElement)">+ Sub-goal</button></div>
      ${own.length?`<div class="linked-tasks">
        ${subs.length?'<div class="d-label" style="margin:12px 0 2px">Linked directly to the goal</div>':''}
        ${linkedRows}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="mission-wrap">
      <div class="mission-label">Mission</div>
      <textarea class="mission-input" rows="2" onchange="S.meta.mission=this.value;save()">${esc(S.meta.mission)}</textarea>
    </div>
    <div class="goals-list">${blocks}
      <div class="goal-block" style="border-bottom:1px solid var(--line)">
        <button class="btn-ghost" onclick="g_add(null,this.parentElement)" style="font-size:13.5px">+ New goal</button>
      </div>
    </div>`;
}
function g_add(parentId,host,starId){
  const make=v=>{
    const g={id:uid(),parentId:parentId||null,title:v,note:'',createdAt:Date.now()};
    if(parentId){g.current=0;g.target=null;g.unit=null;goalOpen.add(parentId);}   // a key result, not a bearing-holder
    else g.starId=starId||null;                                                   // only objectives anchor to a star
    S.goals.push(g);
  };
  if(host&&host.nodeType===1)
    textComposer(host,parentId?'What number proves this happened?…':'Name this goal…',make);
  else{make(parentId?'New key result':'New goal');save();render();}
}
function g_rename(id,v){const g=goal(id);if(g&&v.trim())g.title=v.trim();save();}
function g_delete(id){
  const kids=S.goals.filter(g=>g.parentId===id);
  if(!confirm('Delete this goal'+(kids.length?' and its sub-goals':'')+'? Linked tasks stay, just unlinked.'))return;
  const ids=[id,...kids.map(k=>k.id)];
  tombstone.apply(null,ids);
  S.tasks.forEach(t=>{if(ids.includes(t.goalId))t.goalId=null;});
  S.goals=S.goals.filter(g=>!ids.includes(g.id));
  render();
}

/* ============ calendar ============ */
let calCur=null;          // {y,m,d} — anchor date
let calMode='month';      // 'month' | 'week'
const dstr=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const hmToMin=hm=>{const[a,b]=(hm||'0:0').split(':').map(Number);return a*60+(b||0);};
function calCellHTML(d,inMonth,extra,byDate,gByDate,today){
  const ds=dstr(d);
  const ts=byDate[ds]||[], gs=(gByDate&&gByDate[ds])||[];
  const n=ts.filter(t=>!t.done).length+gs.length;
  const heat=n?' heat-'+Math.min(n,4):'';
  return `<div class="cal-cell ${extra} ${inMonth?'':'cal-out'} ${ds===today?'cal-today':''}${heat}" onclick="calOpenDay('${ds}')" title="Open ${ds}">
    <div class="cal-dnum"><span>${d.getDate()}</span></div>
    <span class="cal-heatn">${n||''}</span>
    ${ts.map(t=>{const b=board(t.boardId);
      return `<div class="cal-ev ${t.done?'done':''}" onclick="event.stopPropagation();openDrawer('${t.id}')" title="${esc(b?b.name:'')} — ${esc(t.title)}">
        <span class="dot" style="background:${b?b.accent:'#999'}"></span>
        ${t.urgent?'<span class="cal-urg">!</span>':''}
        ${t.start?`<span class="cal-time">${fmtSlot(t)}</span>`:''}
        <span class="cal-ev-t">${esc(t.title)}</span>
      </div>`;}).join('')}
    ${gs.map(e=>`<div class="cal-ev gcal" title="From Google Calendar">
        <span class="gc-mark">G</span>
        ${e.start?`<span class="cal-time">${fmtSlot(e)}</span>`:''}
        <span class="cal-ev-t">${esc(e.title)}</span>
      </div>`).join('')}
  </div>`;
}
function calOpenDay(ds){
  const[y,m,dd]=ds.split('-').map(Number);
  calCur={y,m:m-1,d:dd};calMode='day';render();
}
/* week as a vertical agenda — the phone-native way to read time */
function renderWeekAgenda(start,byDate,gByDate,today,nDays){
  const days=[...Array(nDays||7)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
  return '<div class="agenda">'+days.map(d=>{
    const k=dstr(d);
    const ts=byDate[k]||[], gs=gByDate[k]||[];
    const timed=[...ts.filter(t=>t.start).map(t=>({t})),...gs.filter(e=>e.start).map(e=>({e}))]
      .sort((a,b)=>hmToMin((a.t||a.e).start)-hmToMin((b.t||b.e).start));
    const allday=[...ts.filter(t=>!t.start).map(t=>({t})),...gs.filter(e=>!e.start).map(e=>({e}))];
    const rows=[...timed,...allday].map(x=>{
      if(x.t){const t=x.t,b=board(t.boardId);
        return `<div class="ag-row ${t.done?'done-card':''}" onclick="openDrawer('${t.id}')">
          <span class="ag-time">${t.start?fmtSlot(t):'all day'}</span>
          <span class="dot" style="background:${b?b.accent:'#999'}"></span>
          ${t.urgent?'<span class="cal-urg">!</span>':''}
          <span class="ag-t ${t.done?'ag-done':''}">${esc(t.title)}</span></div>`;}
      const e=x.e;
      return `<div class="ag-row ag-gcal">
        <span class="ag-time">${e.start?fmtSlot(e):'all day'}</span>
        <span class="gc-mark">G</span><span class="ag-t">${esc(e.title)}</span></div>`;
    }).join('');
    return `<div class="ag-day ${k===today?'ag-today':''}">
      <div class="ag-head">${d.toLocaleDateString('en-US',{weekday:'long'})}
        <b>${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</b>
        ${k===today?'<span class="ag-now">today</span>':''}</div>
      ${rows||'<div class="ag-empty">nothing planned — breathe</div>'}
    </div>`;
  }).join('')+'</div>';
}
/* week with hours — timed tasks and calendar events as duration blocks */
function renderWeekGrid(start,byDate,gByDate,today){
  const S_MIN=0, E_MIN=24*60, PPH=48;   // full day, midnight to midnight
  const days=[...Array(7)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
  const heads=days.map(d=>{
    const k=dstr(d);
    const ts=(byDate[k]||[]).filter(t=>!t.start), gs=(gByDate[k]||[]).filter(e=>!e.start);
    return `<div class="wk-day-head ${k===today?'wk-today':''}">
      <div class="wk-dn">${d.toLocaleDateString('en-US',{weekday:'short'})} <b>${d.getDate()}</b></div>
      <div class="wk-allday">
        ${ts.map(t=>{const b=board(t.boardId);
          return `<div class="cal-ev ${t.done?'done':''}" onclick="openDrawer('${t.id}')">
            <span class="dot" style="background:${b?b.accent:'#999'}"></span>
            ${t.urgent?'<span class="cal-urg">!</span>':''}
            <span class="cal-ev-t">${esc(t.title)}</span></div>`;}).join('')}
        ${gs.map(e=>`<div class="cal-ev gcal"><span class="gc-mark">G</span><span class="cal-ev-t">${esc(e.title)}</span></div>`).join('')}
      </div></div>`;
  }).join('');
  const gutter=[...Array((E_MIN-S_MIN)/60)].map((_,i)=>{
    const h=S_MIN/60+i;return `<div class="wk-hour">${h%12||12}${h<12?'am':'pm'}</div>`;}).join('');
  const n=new Date(), nowMin=n.getHours()*60+n.getMinutes();
  const cols=days.map(d=>{
    const k=dstr(d);
    const items=[
      ...(byDate[k]||[]).filter(t=>t.start).map(t=>({t})),
      ...(gByDate[k]||[]).filter(e=>e.start).map(e=>({e}))
    ];
    const blocks=items.map(x=>{
      const it=x.t||x.e;
      const s=Math.max(hmToMin(it.start),S_MIN);
      const en=Math.min(hmToMin(endOf(it)||it.start)||hmToMin(it.start)+60,E_MIN);
      const top=(s-S_MIN)/60*PPH, h=Math.max(24,(en-s)/60*PPH);
      if(x.t){
        const b=board(x.t.boardId);
        return `<div class="wk-ev ${x.t.done?'done':''}" style="top:${top}px;height:${h}px;--acc:${b?b.accent:'#999'}"
          onclick="openDrawer('${x.t.id}')">
          <span class="wk-ev-time">${fmtSlot(x.t)}</span><span class="wk-ev-t">${x.t.urgent?'<span class="cal-urg">! </span>':''}${esc(x.t.title)}</span></div>`;
      }
      return `<div class="wk-ev gcal" style="top:${top}px;height:${h}px" title="From Google Calendar">
        <span class="wk-ev-time">${fmtSlot(x.e)}</span><span class="wk-ev-t">${esc(x.e.title)}</span></div>`;
    }).join('');
    const now=(k===today&&nowMin>=S_MIN&&nowMin<=E_MIN)
      ?`<div class="wk-now" style="top:${(nowMin-S_MIN)/60*PPH}px"></div>`:'';
    return `<div class="wk-col ${k===today?'wk-today':''}">${blocks}${now}</div>`;
  }).join('');
  return `<div class="wk">
    <div class="wk-row"><div class="wk-gutter-head"></div>${heads}</div>
    <div class="wk-row"><div class="wk-gutter">${gutter}</div>${cols}</div>
  </div>`;
}
function renderCal(){
  if(!calCur){const n=new Date();calCur={y:n.getFullYear(),m:n.getMonth(),d:n.getDate()};}
  const today=todayStr();
  const byDate={};
  S.tasks.forEach(t=>{if(t.due)(byDate[t.due]=byDate[t.due]||[]).push(t);});
  Object.values(byDate).forEach(a=>a.sort((x,z)=>{
    const u=(z.urgent?1:0)-(x.urgent?1:0); if(u)return u;
    return (x.start||'99')<(z.start||'99')?-1:1;}));
  const gByDate={};
  const syncedIds=new Set(S.tasks.filter(t=>t.gcalId).map(t=>t.gcalId));
  (S.gcal||[]).forEach(e=>{if(e.date&&!syncedIds.has(e.id))(gByDate[e.date]=gByDate[e.date]||[]).push(e);});
  Object.values(gByDate).forEach(a=>a.sort((x,z)=>(x.start||'99')<(z.start||'99')?-1:1));
  let label, body;
  if(calMode==='day'){
    const d=new Date(calCur.y,calCur.m,calCur.d);
    label=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    body=renderWeekAgenda(d,byDate,gByDate,today,1);
  }else if(calMode==='week'){
    const a=new Date(calCur.y,calCur.m,calCur.d);
    const start=new Date(a); start.setDate(a.getDate()-a.getDay());
    const end=new Date(start); end.setDate(start.getDate()+6);
    const f=(d,o)=>d.toLocaleDateString('en-US',o);
    label=start.getMonth()===end.getMonth()
      ? f(start,{month:'long'})+' '+start.getDate()+' – '+end.getDate()+', '+end.getFullYear()
      : f(start,{month:'short',day:'numeric'})+' – '+f(end,{month:'short',day:'numeric'})+', '+end.getFullYear();
    const NARROW=window.matchMedia&&matchMedia('(max-width:700px)').matches;
    body=NARROW?renderWeekAgenda(start,byDate,gByDate,today):renderWeekGrid(start,byDate,gByDate,today);
  }else{
    const {y,m}=calCur;
    const startDow=new Date(y,m,1).getDay(), daysIn=new Date(y,m+1,0).getDate();
    const total=Math.ceil((startDow+daysIn)/7)*7;
    let cells='';
    for(let i=0;i<total;i++){
      const dnum=i-startDow+1, d=new Date(y,m,dnum);
      cells+=calCellHTML(d,dnum>=1&&dnum<=daysIn,'',byDate,gByDate,today);
    }
    label=new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    body=`<div class="cal-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}</div>`;
  }
  return `<div class="view-head">
      <div class="view-title">Calendar</div>
      <div class="view-sub">every dated task in its place in time — click one to open it</div>
      <div class="spacer"></div>
      ${(()=>{const n=syncQueue().length;
        return n?`<span class="small muted" style="margin-right:8px">${n} dated change${n>1?'s':''} not on Google yet</span>
          <button class="cl-btn" onclick="calSync()" title="Downloads one calendar file you open once — nothing downloads on its own">⟳ Send to Google</button>`
        :`<span class="small muted" style="margin-right:4px">calendar up to date ✓</span>`;})()}
      <div class="cal-nav">
        <div class="seg">
          <button class="${calMode==='month'?'on':''}" onclick="calMode='month';render()">Month</button>
          <button class="${calMode==='week'?'on':''}" onclick="calMode='week';calJump=1;render()">Week</button>
          <button class="${calMode==='day'?'on':''}" onclick="calMode='day';render()">Day</button>
        </div>
        <span class="cal-nav-btns">
          <button class="cal-nb" onclick="calShift(-1)" title="Previous">‹</button>
          <button class="cal-nb" onclick="calCur=null;calJump=1;render()">Today</button>
          <button class="cal-nb" onclick="calShift(1)" title="Next">›</button>
        </span>
      </div>
    </div>
    ${window.calSynced?`<div class="sync-banner" style="margin:12px 0 0">
      <span><b>${window.calSynced} event${window.calSynced>1?'s':''} downloaded.</b>
      On iPhone: open the file and tap Add All. On your Mac: Google Calendar → Settings → Import.
      Re-syncing an edited item updates it — it never duplicates.</span>
      <button class="btn-ink" onclick="window.calSynced=0;render()">Got it</button></div>`:''}
    <div class="cal-month h-serif">${label}</div>
    ${body}`;
}
function calShift(n){
  const d=new Date(calCur.y,calCur.m,calCur.d);
  if(calMode==='week')d.setDate(d.getDate()+7*n);
  else if(calMode==='day')d.setDate(d.getDate()+n);
  else d.setMonth(d.getMonth()+n,1);
  calCur={y:d.getFullYear(),m:d.getMonth(),d:d.getDate()};render();
}

/* ============ priorities (expanded master) ============ */
function ptCard(t){
  const b=board(t.boardId), g=t.goalId?goal(t.goalId):null;
  return `<div class="tcard" draggable="true" data-tid="${t.id}"
      ondragstart="dragTask(event,'${t.id}')" ondragend="dragEnd(event)"
      onclick="openDrawer('${t.id}')">
    <button class="tick" onclick="event.stopPropagation();toggleDone('${t.id}')">
      <svg viewBox="0 0 12 12"><path d="M2 6.5 4.8 9 10 3"/></svg></button>
    <div class="t-main">
      <div class="pt-board"><span class="dot" style="background:${b?b.accent:'#999'};width:6px;height:6px"></span>${esc(b?b.name:'')}</div>
      <div class="t-title">${esc(t.title)}</div>
      <div class="chips">
        ${urgentChip(t)}
        ${whenChip(t)}
        ${g?`<span class="chip goal-chip">${esc(g.title)}</span>`:''}
      </div>
      ${progBar(t)}
    </div>
  </div>`;
}
function apptStrip(days,title){
  const today=todayStr();
  const lim=new Date();lim.setDate(lim.getDate()+days);
  const limS=dstr(lim);
  const list=S.tasks.filter(t=>!t.done&&isAppt(t)&&t.due&&t.due>=today&&t.due<=limS)
    .sort((a,b)=>(a.due+(a.start||'99'))<(b.due+(b.start||'99'))?-1:1);
  if(!list.length)return '';
  return `<div class="appt-strip">
    <span class="practices-label">${title}</span>
    ${list.map(t=>{const b=board(t.boardId);
      const when=t.due===today?'today':new Date(t.due+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
      return `<button class="appt-pill" onclick="openDrawer('${t.id}')">
        <span class="dot" style="background:${b?b.accent:'#999'}"></span>
        <span class="appt-when">${when}${t.start?' '+fmtSlot(t):''}</span>
        <span>${esc(t.title)}</span>
      </button>`;}).join('')}
  </div>`;
}
function renderPriorities(){
  /* triage is for live work only: no appointments, no shelved horizons */
  const open=S.tasks.filter(t=>!t.done&&!isRoutine(t)&&!isAppt(t)&&!isShelved(t));
  const valid=id=>S.priCols.some(c=>c.id===id);
  const horizon=S.priCols.find(c=>/horizon|later|someday|eventual/i.test(c.name));
  const wk=new Date();wk.setDate(wk.getDate()+7);
  const wkS=wk.getFullYear()+'-'+String(wk.getMonth()+1).padStart(2,'0')+'-'+String(wk.getDate()).padStart(2,'0');
  const unassigned=t=>!t.priCol||!valid(t.priCol);
  const doNow=S.priCols.find(c=>/\bnow\b/i.test(c.name))||S.priCols[0];
  const autoHor=t=>!!horizon&&unassigned(t)&&!t.urgent&&(!t.due||t.due>wkS);
  const autoNow=t=>!!doNow&&unassigned(t)&&t.urgent;
  const unsorted=byUrgent(open.filter(t=>unassigned(t)&&!autoHor(t)&&!autoNow(t)));
  const un=unsorted.length?`<div class="col" ondragover="overCol(event)" ondragleave="leaveCol(event)" ondrop="dropPri(event,null)">
      <div class="col-head"><span class="col-name" style="color:var(--ink-faint)">Unsorted</span>
        <span class="col-count">${unsorted.length}</span></div>
      <div class="col-body">${unsorted.map(ptCard).join('')}</div>
    </div>`:'';   // an empty inbox earns its absence
  const cols=S.priCols.map(c=>{
    const ts=byUrgent(open.filter(t=>t.priCol===c.id
      ||(horizon&&c.id===horizon.id&&autoHor(t))
      ||(doNow&&c.id===doNow.id&&autoNow(t))));
    return `<div class="col" ondragover="overCol(event)" ondragleave="leaveCol(event)" ondrop="dropPri(event,'${c.id}')">
      <div class="col-head">
        <span class="col-grip" draggable="true" title="Drag to reorder column"
          ondragstart="dragAnyCol(event,'pricol','${c.id}')" ondragend="dragEnd(event)">⠿</span>
        <input class="col-name" value="${esc(c.name)}" onchange="priRename('${c.id}',this.value)">
        <span class="col-count">${ts.length}</span>
        <button class="col-del" onclick="priDel('${c.id}')">×</button>
      </div>
      <div class="col-body">${ts.map(ptCard).join('')}</div>
    </div>`;
  }).join('');
  return `<div class="view-head">
      <div class="view-title">Priorities</div>
      <div class="view-sub">every task you can act on — urgent jumps to Do now!, undated or far out drifts to Later; anything shelved on a board stays out</div>
      <div class="spacer"></div>
      <button class="btn-ghost" onclick="priAdd()">+ Column</button>
    </div>
    ${apptStrip(7,'Commitments')}
    ${practicesStrip()}
    <div class="cols">${un}${cols}</div>`;
}
function dropPri(ev,colId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(drag&&drag.type==='pricol'){reorderCols(S.priCols,drag.id,colId);drag=null;render();return;}
  if(!drag||drag.type!=='task')return;
  const t=S.tasks.find(x=>x.id===drag.id); if(!t)return;
  t.priCol=colId||null;
  touch(t);
  const overCard=ev.target.closest('.tcard');
  S.tasks=S.tasks.filter(x=>x.id!==t.id);
  if(overCard&&overCard.dataset.tid!==t.id){
    const i=S.tasks.findIndex(x=>x.id===overCard.dataset.tid);
    S.tasks.splice(i,0,t);
  }else S.tasks.push(t);
  drag=null;render();
}
function priAdd(){
  const n=prompt('Name this priority column:');
  if(!n||!n.trim())return;
  S.priCols.push({id:uid(),name:n.trim()});render();
}
function priRename(id,v){const c=S.priCols.find(c=>c.id===id);if(c&&v.trim())c.name=v.trim();save();}
function priDel(id){
  if(!confirm('Remove this column? Its tasks go back to Unsorted.'))return;
  S.tasks.forEach(t=>{if(t.priCol===id)t.priCol=null;});
  S.priCols=S.priCols.filter(c=>c.id!==id);render();
}

/* ============ the laurels (achievements) ============ */
function renderAch(){
  const pad=n=>String(n).padStart(2,'0');
  const ymd=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
  const today=todayStr();
  const yest=(()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d.getTime());})();
  const wkAgo=Date.now()-7*864e5, moAgo=Date.now()-30*864e5;
  const done=S.tasks.filter(t=>t.done)
    .map(t=>({t,at:t.completedAt||t.createdAt||0}))
    .sort((a,b)=>b.at-a.at);
  const planDone=S.plan.flatMap(e=>e.items.filter(i=>i.done).map(i=>({text:i.text,era:e.era})));
  const nToday=done.filter(x=>x.at&&ymd(x.at)===today).length;
  const nWeek=done.filter(x=>x.at>=wkAgo).length;
  const nMonth=done.filter(x=>x.at>=moAgo).length;
  const total=done.length+planDone.length;
  /* hero line */
  let hero;
  if(total===0)hero='Nothing here yet — and that’s fine. The first checkmark is the hardest one. Go get it.';
  else if(nToday>=5)hero=nToday+' finished today. Unstoppable is a word for days like this.';
  else if(nToday>=1)hero=nToday+(nToday===1?' thing':' things')+' done today — momentum looks good on you.';
  else if(nWeek>=1)hero=nWeek+' this week. The record keeps growing.';
  else hero='The record stands at '+total+'. It only ever goes up.';
  /* milestones */
  const MS=[[1,'First stroke'],[5,'Warming up'],[10,'Ten strong'],[25,'Twenty-five deep'],
            [50,'Half a hundred'],[100,'The hundred club'],[250,'Force of nature']];
  const badges=MS.map(([n,name])=>{
    if(total>=n)return `<span class="badge"><span class="st">✦</span>${name}<span class="muted small">${n}</span></span>`;
    return '';
  }).join('');
  const next=MS.find(([n])=>total<n);
  const nextBadge=next?`<span class="badge locked"><span class="st">✧</span>${next[1]}<span class="muted small">${next[0]-total} to go</span></span>`:'';
  /* stats */
  const stats=`<div class="ach-stats">
    ${[[nToday,'today'],[nWeek,'this week'],[nMonth,'this month'],[total,'all time']].map(([n,l])=>
      `<div class="ach-stat"><div class="ach-n h-serif">${n}</div><div class="d-label" style="margin:0">${l}</div></div>`).join('')}
  </div>`;
  /* intentions realized */
  /* ── the record, counted ─────────────────────────────── */
  const wk=Date.now()-7*864e5, mo=Date.now()-30*864e5;
  const kept=done.filter(x=>isAppt(x.t)), fin=done.filter(x=>!isAppt(x.t));
  const byBoard={};
  fin.forEach(x=>{const b=board(x.t.boardId);if(!b)return;
    (byBoard[b.id]=byBoard[b.id]||{b,n:0,recent:0}).n++;
    if(x.at>=mo)byBoard[b.id].recent++;});
  const ranked=Object.values(byBoard).sort((a,b)=>b.n-a.n);
  const totalFin=fin.length;
  /* streak of consecutive days with something finished */
  const dayset=new Set(done.filter(x=>x.at).map(x=>ymd(x.at)));
  let streak=0; {const d=new Date();
    if(!dayset.has(ymd(d.getTime())))d.setDate(d.getDate()-1);
    while(dayset.has(ymd(d.getTime()))){streak++;d.setDate(d.getDate()-1);}}
  /* busiest weekday */
  const dow=[0,0,0,0,0,0,0];
  done.forEach(x=>{if(x.at)dow[new Date(x.at).getDay()]++;});
  const bestDow=dow.indexOf(Math.max(...dow));
  const DOWN=['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
  /* donut — top five domains, the rest gathered, so the eye can actually compare */
  const TOP=5;
  const slices=ranked.slice(0,TOP).map(r=>({label:r.b.name,n:r.n,color:r.b.accent}));
  const restN=ranked.slice(TOP).reduce((s,r)=>s+r.n,0);
  if(restN)slices.push({label:'Everything else',n:restN,color:'#b9b0a0'});
  const C=2*Math.PI*54;
  let acc=0;
  const arcs=slices.map(s=>{
    const len=totalFin?C*s.n/totalFin:0;
    const el=`<circle class="donut-arc" cx="70" cy="70" r="54" fill="none" stroke="${s.color}"
      stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
      stroke-dashoffset="${(-acc).toFixed(2)}"><title>${esc(s.label)}: ${s.n}</title></circle>`;
    acc+=len; return el;
  }).join('');
  const legend=slices.map(s=>`<div class="lg-row">
    <span class="lg-dot" style="background:${s.color}"></span>
    <span class="lg-name">${esc(s.label)}</span>
    <span class="lg-n">${s.n}</span>
    <span class="lg-pct">${totalFin?Math.round(100*s.n/totalFin):0}%</span>
  </div>`).join('');
  const maxN=ranked.length?ranked[0].n:1;
  const bars=ranked.map(r=>`<div class="bar-row">
    <span class="bar-name">${esc(r.b.name)}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${Math.round(100*r.n/maxN)}%;background:${r.b.accent}"></span></span>
    <span class="bar-n">${r.n}</span>
  </div>`).join('');
  /* last twelve weeks of finishing */
  const weeks=[...Array(12)].map((_,i)=>{
    const end=Date.now()-i*7*864e5, start=end-7*864e5;
    return done.filter(x=>x.at>start&&x.at<=end).length;
  }).reverse();
  const wmax=Math.max(1,...weeks);
  const spark=weeks.map((n,i)=>`<span class="wk-slot" title="${n} finished">
    <span class="wk-bar" style="height:${n?Math.max(6,Math.round(100*n/wmax)):0}%;opacity:${0.5+0.5*(i/11)}"></span>
  </span>`).join('');
  const headline=ranked.length
    ? `<b>${esc(ranked[0].b.name)}</b> carried the season — ${ranked[0].n} of your ${totalFin} finished there.`
    : 'Nothing counted yet — the first checkmark writes this line.';
  const statsHtml=totalFin+kept.length?`
    <div class="lau-h">By the numbers</div>
    <div class="lau-sub">${headline}</div>
    <div class="stats-grid">
      <div class="donut-wrap">
        <svg viewBox="0 0 140 140" class="donut">${arcs}
          <text x="70" y="66" text-anchor="middle" class="donut-n">${totalFin}</text>
          <text x="70" y="84" text-anchor="middle" class="donut-l">finished</text>
        </svg>
        <div class="legend">${legend}</div>
      </div>
      <div class="mini-stats">
        <div class="ms"><span class="ms-n">${streak}</span><span class="ms-l">day streak</span></div>
        <div class="ms"><span class="ms-n">${done.filter(x=>x.at>=wk).length}</span><span class="ms-l">this week</span></div>
        <div class="ms"><span class="ms-n">${done.filter(x=>x.at>=mo).length}</span><span class="ms-l">this month</span></div>
        <div class="ms"><span class="ms-n">${kept.length}</span><span class="ms-l">appointments kept</span></div>
        <div class="ms"><span class="ms-n">${S.goals.filter(g=>g.achieved).length}</span><span class="ms-l">goals achieved</span></div>
        <div class="ms"><span class="ms-n">${S.goals.filter(g=>g.rewardClaimed).length+(S.rewards||[]).filter(r=>r.claimed).length}</span><span class="ms-l">rewards claimed</span></div>
      </div>
    </div>
    <div class="spark-wrap">
      <div class="lau-h sm">The last twelve weeks</div>
      <div class="spark">${spark}</div>
      <div class="spark-foot"><span>12 weeks ago</span><span>you finish most things on <b>${DOWN[bestDow]}</b></span><span>this week</span></div>
    </div>
    ${ranked.length>1?`<div class="bars-wrap"><div class="lau-h sm">Every domain, ranked</div>${bars}</div>`:''}`:'';

  /* promises — set, tracked and claimed here, where the finishing is counted */
  const rewardHtml=rewardsBlock({streak,fin:totalFin});
  const intentions=planDone.length?`
    <div class="list-group-name" style="cursor:default">Intentions realized</div>
    ${planDone.map(p=>`<div class="ach-row"><span class="ach-check" style="color:var(--ochre)">◆</span>
      <span class="ach-t" style="font-family:var(--serif);font-style:italic;font-size:15px">${esc(p.text)}</span>
      <span class="b-tag">${esc(p.era)}</span></div>`).join('')}`:'';
  /* timeline groups */
  const groups=[];
  const push=(label,x)=>{let g=groups.find(g=>g.label===label);
    if(!g){g={label,items:[]};groups.push(g);}g.items.push(x);};
  done.forEach(x=>{
    if(!x.at){push('Some time ago',x);return;}
    const ds=ymd(x.at);
    if(ds===today)push('Today',x);
    else if(ds===yest)push('Yesterday',x);
    else if(x.at>=wkAgo)push('Earlier this week',x);
    else push(new Date(x.at).toLocaleDateString('en-US',{month:'long',year:'numeric'}),x);
  });
  const timeline=groups.map(g=>`
    <div class="list-group-name" style="cursor:default">${g.label}
      <span class="col-count">${g.items.length}</span></div>
    ${g.items.map(x=>{
      const b=board(x.t.boardId), gl=x.t.goalId?goal(x.t.goalId):null;
      const when=!x.at?'':(ymd(x.at)===today
        ?new Date(x.at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})
        :new Date(x.at).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
      return `<div class="ach-row" onclick="openDrawer('${x.t.id}')">
        <span class="ach-check">✓</span>
        <span class="ach-t">${esc(x.t.title)}</span>
        ${gl?`<span class="chip goal-chip">${esc(gl.title)}</span>`:''}
        <span class="b-tag">${esc(b?b.name:'')}</span>
        <span class="muted small" style="margin-left:auto;flex-shrink:0">${when}</span>
      </div>`;}).join('')}`).join('');
  return `<div class="view-head">
      <div class="view-title">The Laurels</div>
      <div class="view-sub">everything you have finished — kept, counted, and celebrated</div>
    </div>
    <div class="ach-hero">${hero}</div>
    ${stats}
    <div class="badges">${badges}${nextBadge}</div>
    <div class="ach-wrap">${statsHtml}${rewardHtml}${intentions}${timeline||''}</div>`;
}

/* ============ rewards — promises, kept where the record is kept ============ */
const RW_MILES=[[10,'10 things finished'],[25,'25 things finished'],[50,'50 things finished'],
                [100,'100 things finished'],[250,'250 things finished']];
const RW_STREAK=[[3,'a 3-day streak'],[7,'a 7-day streak'],[14,'a 14-day streak'],[30,'a 30-day streak']];
const rwHave=(r,ctx)=>r.kind==='streak'?ctx.streak:ctx.fin;
const rwEarned=(r,ctx)=>rwHave(r,ctx)>=r.n;
const rwWhen=r=>r.kind==='streak'
  ? 'when you string '+r.n+' days together'
  : 'when '+r.n+' things are finished';
const dshort=ms=>new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric'});
function rewardsBlock(ctx){
  const row=(cls,mark,title,right,btn)=>`<div class="reward-row ${cls}">
    <span class="reward-mark">${mark}</span>
    <span class="ach-t">${title}</span>
    ${right?`<span class="muted small rw-right">${right}</span>`:'<span class="rw-right"></span>'}
    ${btn||''}</div>`;
  const promised=S.goals.filter(g=>!g.parentId&&g.reward);
  const bigRows=promised.map(g=>{
    const p=progress(goalTaskSet(g.id));
    const earned=!!(g.achieved||p===100);
    if(g.rewardClaimed)return row('big claimed','✦✦',esc(g.reward),'claimed '+dshort(g.rewardClaimed),
      `<button class="btn-ghost" onclick="rw_clearGoal('${g.id}')">×</button>`);
    if(earned)return row('big earned','✦✦',
      `<b>${esc(g.reward)}</b> — earned. <i>${esc(g.title)}</i> is done.`,'',
      `<button class="cl-btn" onclick="g_claim('${g.id}')">Claim it</button>`);
    return row('big','✦✦',esc(g.reward),
      esc(g.title)+' · '+(p===null?'not started':p+'%'),
      `<button class="btn-ghost" onclick="rw_clearGoal('${g.id}')">×</button>`);
  }).join('');
  const smallRows=(S.rewards||[]).map(r=>{
    if(r.claimed)return row('claimed','🜲',esc(r.title),'claimed '+dshort(r.claimed),
      `<button class="btn-ghost" onclick="rw_del('${r.id}')">×</button>`);
    if(rwEarned(r,ctx))return row('earned','🜲',
      `<b>${esc(r.title)}</b> — earned. You said ${rwWhen(r)}, and you did.`,'',
      `<button class="cl-btn" onclick="rw_claim('${r.id}')">Claim it</button>`);
    return row('','🜲',esc(r.title),rwWhen(r)+' · '+rwHave(r,ctx)+' of '+r.n,
      `<button class="btn-ghost" onclick="rw_del('${r.id}')">×</button>`);
  }).join('');
  const clip=(t,n)=>t.length>n?t.slice(0,n-1).trimEnd()+'…':t;
  const goalOpts=S.goals.filter(g=>!g.parentId&&!g.achieved)
    .map(g=>`<option value="g:${g.id}" title="${esc(g.title)}">${esc(clip(g.title,34))}</option>`).join('');
  return `
    <div class="lau-h">Rewards</div>
    <div class="lau-sub">what you promised yourself — a finished goal is worth more than a finished errand,
      so the big ones sit on top.</div>
    ${bigRows?`<div class="rw-lane"><div class="lau-h sm">The big ones — when a whole goal gets marked</div>${bigRows}</div>`:''}
    ${smallRows?`<div class="rw-lane"><div class="lau-h sm">Smaller ones — for simply keeping at it</div>${smallRows}</div>`:''}
    ${bigRows||smallRows?'':'<div class="empty-note" style="margin:4px 0 0">Nothing promised yet — name one thing you’ll give yourself. It works better than discipline.</div>'}
    <div class="rw-new">
      <input id="rwT" placeholder="What will you give yourself?"
        onkeydown="if(event.key==='Enter')rw_add()">
      <select id="rwTrig" title="What has to happen before you collect">
        ${goalOpts?`<optgroup label="When a goal gets marked — the big ones">${goalOpts}</optgroup>`:''}
        <optgroup label="Smaller milestones">
          ${RW_MILES.map(([n,l])=>`<option value="count:${n}">${l}</option>`).join('')}
          ${RW_STREAK.map(([n,l])=>`<option value="streak:${n}">${l}</option>`).join('')}
        </optgroup>
      </select>
      <button class="btn-ink" onclick="rw_add()">Promise it</button>
    </div>
    <div class="rw-ideas">
      <span class="rw-ideas-l">or borrow one:</span>
      ${RW_IDEAS.map(i=>`<button class="ch" onclick="rw_idea(this)">${esc(i)}</button>`).join('')}
    </div>`;
}
/* small, specific, and actually collectable — vague rewards never get claimed */
const RW_IDEAS=[
  'A proper massage',
  'Dinner at the place I keep postponing',
  'A day with my phone off',
  'The next book on my list, hardcover',
  'A weekend in Antigua',
  'A facial, no rushing',
  'Coffee alone with a novel',

/* ============ claude — the resident reviewer ============ */
function renderClaude(){
  const now=Date.now(), today=todayStr();
  const open=S.tasks.filter(t=>!t.done&&!isRoutine(t)&&!isAppt(t)&&!isShelved(t));
  const taskOf=id=>S.tasks.find(t=>t.id===id);
  const bAcc=t=>{const b=board(t.boardId);return b?b.accent:'#999';};
  const bName=t=>{const b=board(t.boardId);return b?b.name:'';};
  /* my letters — written from our sessions, actionable in place */
  const notes=((S.claude&&S.claude.notes)||[]).filter(n=>{
    if(n.resolved)return false;
    if(n.taskId){const t=taskOf(n.taskId);if(!t||t.done)return false;}
    return true;
  });
  const exc=(s,k)=>s&&s.length>k?s.slice(0,k-1)+'…':(s||'');
  const repliedTo=new Set(((S.claude&&S.claude.inbox)||[]).filter(m=>!m.processed&&m.re).map(m=>m.re));
  const noteHtml=notes.map(n=>{
    const t=n.taskId?taskOf(n.taskId):null;
    return `<div class="cl-note">
      ${n.reText?`<div class="cl-quote">you said: “${esc(exc(n.reText,110))}”</div>`:''}
      <div class="cl-text">${esc(n.text)}</div>
      ${t?`<div class="cl-task"><span class="dot" style="background:${bAcc(t)}"></span>
        <span class="cl-task-t" onclick="openDrawer('${t.id}')">${esc(t.title)}</span>
        <span class="b-tag">${esc(bName(t))}</span>${whenChip(t)}</div>`:''}
      <div class="cl-actions">
        ${(n.actions||[]).map((a,i)=>`<button class="cl-btn ${a.act==='delete'?'danger':''}" onclick="clNoteAct('${n.id}',${i})">${esc(a.label)}</button>`).join('')}
        <button class="cl-btn ghost" onclick="clReply('${n.id}')">Reply</button>
        <button class="cl-btn ghost" onclick="clDismiss('${n.id}')">Not now</button>
      </div>
      <div class="cl-sig">— Claude
        ${repliedTo.has(n.id)?'<span class="cl-replied">↪ your reply is on its way to me</span>':''}
      </div>
    </div>`;
  }).join('');
  /* standing reviews — computed fresh every time */
  const row=(t,btns)=>`<div class="cl-row">
    <span class="dot" style="background:${bAcc(t)}"></span>
    <span class="cl-row-t" onclick="openDrawer('${t.id}')">${esc(t.title)}</span>
    <span class="b-tag">${esc(bName(t))}</span>
    ${whenChip(t)}
    <span class="cl-row-btns">${btns}</span>
  </div>`;
  const btn=(label,fn,danger)=>`<button class="cl-btn ${danger?'danger':''}" onclick="${fn}">${label}</button>`;
  const overdue=open.filter(t=>t.due&&t.due<today);
  const QW=/^(buy|call|book|send|schedule|check|email|text|ask|pay|order|register|renew|clean)\b/i;
  const wins=open.filter(t=>!t.due&&QW.test(t.title)).slice(0,7);
  const stale=open.filter(t=>!t.due&&!t.priCol&&Math.max(t.touchedAt||0,t.createdAt||0)<now-7*864e5).slice(0,10);
  const sec=(title,subtitle,items,empty)=>`
    <div class="list-group-name" style="cursor:default;margin-top:30px">${title}</div>
    <div class="cl-sub">${subtitle}</div>
    ${items.length?items.join(''):`<div class="empty-note">${empty}</div>`}`;
  /* what's coming at a fixed hour — nothing to do but show up */
  const tmr=(()=>{const d=new Date();d.setDate(d.getDate()+1);return dstr(d);})();
  const soon=S.tasks.filter(t=>!t.done&&isAppt(t)&&(t.due===today||t.due===tmr))
    .sort((a,b)=>(a.due+(a.start||'99'))<(b.due+(b.start||'99'))?-1:1);
  const comingHtml=soon.length?sec('Coming up','you can’t get these done early — just be there',
    soon.map(t=>{const b=board(t.boardId);
      const blk=t.blockFor?S.tasks.find(x=>x.id===t.blockFor):null;
      return `<div class="cl-row">
        <span class="dot" style="background:${b?b.accent:'#999'}"></span>
        <span class="cl-when">${t.due===today?'Today':'Tomorrow'}${t.start?' · '+fmtSlot(t):''}</span>
        <span class="cl-row-t" onclick="openDrawer('${t.id}')">${esc(t.title)}</span>
        ${blk?`<span class="b-tag">focus time</span>`:`<span class="b-tag">${esc(b?b.name:'')}</span>`}
      </div>`;}),''):'';
  /* the bearings, read the way the Compass actually works now */
  const objectives=S.goals.filter(g=>!g.parentId);
  const starRows=(S.stars||[]).map(s=>{
    const st=starStats(s.id);
    const at=st.atTarget;
    let verdict,cls;
    if(!st.goals.length){verdict='nothing points here yet — a star you never steer by is only scenery';cls='drift';}
    else{
      const measured=st.goals.filter(g=>goalKrs(g.id).length).length;
      verdict=st.goals.length+(st.goals.length>1?' objectives':' objective')
        +(st.eras.length?' · '+st.eras.join(' · '):'')
        +(at?' · '+at+' at target':measured?'':' · none measured yet');
      if(!measured)cls='drift';
    }
    return `<div class="cl-row">
      <span class="star-mark">✶</span>
      <input class="cl-star-in" value="${esc(s.title)}" onchange="star_rename('${s.id}',this.value)">
      <span class="cl-verdict ${cls||''}">${verdict}</span>
    </div>`;
  }).join('');
  /* the two honest gaps in an OKR compass: a goal with no bearing, and a goal with nothing measuring it */
  const loose=objectives.filter(g=>!g.starId);
  const unmeasured=objectives.filter(g=>!goalKrs(g.id).length);
  const unlinked=S.goals.filter(g=>g.parentId&&!g.link&&!isMetric(g));
  const gap=(label,list,line)=>list.length?`<div class="cl-gapline">
      <div class="cl-gaph"><b>${list.length} ${label}${list.length>1?'s':''}</b> — ${line}</div>
      <div class="cl-gap">${list.slice(0,6).map(g=>`<span class="b-tag" onclick="go('compass')">${esc(g.title)}</span>`).join('')}
        ${list.length>6?`<span class="small muted">+${list.length-6} more</span>`:''}</div>
    </div>`:'';
  const northHtml=(S.stars||[]).length||objectives.length?`
    <div class="list-group-name" style="cursor:default;margin-top:30px">True north</div>
    <div class="cl-sub">a bearing for the next thirty years — nothing here is measured in weeks.
      The only questions worth asking are whether anything is pointed at it, and whether that thing is being measured at all.</div>
    ${starRows||'<div class="empty-note">No bearings set yet — name the two or three things that would make a decade worth it.</div>'}
    ${(loose.length||unmeasured.length||unlinked.length)?`<div class="cl-gaps">
      ${gap('objective without a bearing',loose,'a goal that serves no star is worth saying out loud.')}
      ${gap('objective with nothing measuring it',unmeasured,'an objective with no key results can’t move.')}
      ${gap('key result measuring nothing',unlinked,'link each to the work that would prove it happened.')}
      <button class="cl-btn" onclick="go('compass')">Open the Compass</button>
    </div>`:''}`:'';
  const overdueHtml=sec('Slipped past their date','honest accounting — reschedule or finish, but don’t let them haunt',
    overdue.map(t=>row(t,btn('Move to today',`clToday('${t.id}')`)+btn('Done ✓',`toggleDone('${t.id}')`))),
    'nothing overdue — a clean conscience');
  const winsHtml=sec('Quick wins on the table','each of these smells like fifteen minutes — knock one out for momentum',
    wins.map(t=>row(t,btn('Today',`clToday('${t.id}')`)+btn('Do now!',`clDoNow('${t.id}')`))),
    'no obvious quick wins right now');
  const staleHtml=sec('Gathering dust','undated, untriaged, untouched for a week — decide: give it a date, or let it go with grace',
    stale.map(t=>row(t,btn('Date today',`clToday('${t.id}')`)+btn('Still matters',`clStill('${t.id}')`)+btn('Let it go',`clDelete('${t.id}')`,true))),
    'nothing abandoned — everything here is either moving or resting on purpose');
  return `<div class="view-head">
      <div class="view-title">Claude <span style="color:var(--ochre);font-size:22px">✦</span></div>
      <div class="view-sub">your resident reviewer — notes from me, plus standing audits of the boards</div>
    </div>
    <div class="cl-wrap">
      <div class="cl-compose">
        <textarea id="clMsg" rows="2" oninput="window.clDraft=this.value"
          placeholder="Write to Claude — instruct, ask, push back. ‘Split the Nature paper into smaller tasks’, ‘date all the gift-buying for Friday’, ‘why the CV nagging?’…">${esc(window.clDraft||'')}</textarea>
        <div class="cl-compose-row">
          <span class="small muted" id="clReplyTag">${(()=>{
            const rn=window.clReplyTo?((S.claude&&S.claude.notes)||[]).find(n=>n.id===window.clReplyTo):null;
            return rn?`replying to: “${esc(exc(rn.text,60))}” <button class="cl-cancel" onclick="clCancelReply()">×</button>`:'';
          })()}</span>
          <span style="display:flex;gap:8px">
            <button class="cl-btn" onclick="clPing()" title="Push everything up so it’s waiting for me">⚡ Save for Claude</button>
            <button class="btn-ink" onclick="clSend()">Send to Claude</button>
          </span>
        </div>
      </div>
      ${((S.claude&&S.claude.inbox)||[]).filter(m=>!m.processed).map(m=>{
        const rn=m.re?((S.claude&&S.claude.notes)||[]).find(n=>n.id===m.re):null;
        return `<div class="cl-you">
          <button class="more cl-you-x" title="Delete this message" onclick="clUnsend('${m.id}')">×</button>
          ${rn?`<div class="cl-quote">↪ replying to: “${esc(exc(rn.text,110))}”</div>`:''}
          <div class="cl-you-t">${esc(m.text)}</div>
          <div class="cl-you-s">waiting for Claude — he’ll read this the next time you open a conversation with him
            <button class="cl-btn" style="margin-left:10px;padding:3px 11px;font-size:11px" onclick="clPing()">⚡ Save for Claude</button>
          </div>
        </div>`;}).join('')}
      ${noteHtml||'<div class="empty-note">No new notes from me — write above or ask in our chat, and my reply lands here.</div>'}
      ${comingHtml}
      ${overdueHtml}
      ${winsHtml}
      ${staleHtml}
      ${northHtml}
      <div class="cl-foot">Want a deeper review — priorities challenged, boards reorganized, honest opinions? Just tell me in our conversation; I read everything here and write back.</div>
    </div>`;
}

function clNoteAct(nid,i){
  const n=S.claude.notes.find(n=>n.id===nid); if(!n)return;
  const a=(n.actions||[])[i]; if(!a)return;
  if(a.act==='date-today'&&n.taskId){const t=S.tasks.find(t=>t.id===n.taskId);if(t){t.due=todayStr();touch(t);}}
  else if(a.act==='do-now'&&n.taskId)clDoNow(n.taskId);
  else if(a.act==='done'&&n.taskId){const t=S.tasks.find(t=>t.id===n.taskId);if(t&&!t.done)toggleDone(n.taskId);}
  else if(a.act==='delete'&&n.taskId)S.tasks=S.tasks.filter(t=>t.id!==n.taskId);
  else if(a.act==='open'&&n.taskId){openDrawer(n.taskId);return;}
  n.resolved=Date.now();save();render();
}

/* ============ compass — stars, goals, and the plan as one instrument ============ */
let compassMode='stars';
const star=id=>(S.stars||[]).find(s=>s.id===id);
/* A star is a bearing, not a destination — so it reports heading, never progress. */
function starStats(sid){
  const gs=S.goals.filter(g=>!g.parentId&&g.starId===sid);
  const krs=gs.flatMap(g=>goalKrs(g.id));
  const items=S.plan.flatMap(e=>e.items.filter(i=>i.starId===sid).map(i=>({...i,era:e.era})));
  /* No clocks here. A bearing is not late — it is either steered toward or ignored. */
  const eras=[...new Set(gs.map(g=>g.era).filter(Boolean))]
    .map(id=>{const e=S.plan.find(x=>x.id===id);return e?e.era:null;}).filter(Boolean);
  const atTarget=gs.filter(g=>(goalPct(g.id)??0)>=TARGET_PCT).length;
  const drift=!gs.length;
  const heading=gs.length
    ? gs.length+(gs.length>1?' goals point here':' goal points here')
    : 'nothing points here yet';
  return {goals:gs,krs,tasks:[],live:krs.length,items,eras,atTarget,heading,drift};
}

/* a small inline field — never prompt(), which a home-screen web app silently swallows */
function textComposer(host,ph,cb){
  if(!host)return;
  const ex=host.querySelector('.ghost-new');
  if(ex){ex.focus();return;}
  const inp=document.createElement('input');
  inp.className='ghost-new'; inp.placeholder=ph;
  host.appendChild(inp);
  setTimeout(()=>inp.focus(),0);
  let closed=false;
  const commit=()=>{
    if(closed)return; closed=true;
    const v=inp.value.trim();
    if(v)cb(v);
    save();render();
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();commit();}
    if(e.key==='Escape'){closed=true;render();}
  });
  inp.addEventListener('blur',commit);
}

function krPicker(kr){
  const sug=krSuggest(kr);
  const cur=kr.link||{};
  const picked=(cur.kind==='tasks'&&cur.taskIds)||[];
  const bid=cur.boardId||krBrowse.get(kr.id)||null;
  const cb=bid?board(bid):null;
  const bOpts=S.boards.map(b=>`<option value="${b.id}" ${bid===b.id?'selected':''}>${esc(b.name)}</option>`).join('');
  const cOpts=cb?(cb.columns||[]).map(c=>`<option value="${c.id}" ${cur.colId===c.id?'selected':''}>${esc(c.name)}</option>`).join(''):'';
  /* the tasks you could hand-pick — narrowed to a column once one is chosen */
  const pool=cb?S.tasks.filter(t=>t.boardId===cb.id&&!isRoutine(t)&&!isAppt(t)

function renderCompass(){
  if(compassMode==='stars')compassMode='time';
  const head=`<div class="view-head">
      <div class="view-title">Compass</div>
      <div class="view-sub">goals across time, the map they form, and the bearings they all serve</div>
      <div class="spacer"></div>

        <button class="${compassMode==='time'?'on':''}" onclick="compassMode='time';render()">Timeline</button>

`;
  return head+(compassMode==='tree'?compassMap():compassTime())

/* which domain a goal really lives in — inferred from where its tasks are */
function goalDept(g){
  const ids=[g.id,...S.goals.filter(s=>s.parentId===g.id).map(s=>s.id)];
  const c={};
  S.tasks.filter(t=>ids.includes(t.goalId)).forEach(t=>{c[t.boardId]=(c[t.boardId]||0)+1;});
  let best=null,n=0;
  Object.keys(c).forEach(k=>{if(c[k]>n){n=c[k];best=k;}});
  return best;
}
/* the bearings — always last, never decomposed */
function starsFooter(){
  const stars=(S.stars||[]).map(s=>{
