<script>
/* ============ state & persistence ============ */
const KEY='atelier.v2';
const ACCENTS=['#8a9b7e','#c17b5d','#7e93a8','#c2a05a','#a08398','#b0876d'];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

function seed(){
  const C=n=>({id:uid(),name:n});
  const RC=n=>({id:uid(),name:n,kind:'routine'});
  const mcNow=uid(),mcSeason=uid(),mcWork=uid(),mcSome=uid();
  const mkB=(name,accent,mcol,cols)=>({id:uid(),name,accent,masterCol:mcol,columns:cols});
  const pc =mkB('Personal Care','#a08398',mcNow,[C('To do'),C('Doing'),C('Done')]);
  const ff =mkB('Friends & Family','#c17b5d',mcNow,[C('To do'),C('Doing'),C('Done')]);
  const wl =mkB('Wellness','#8a9b7e',mcNow,[RC('Routines'),C('To do'),C('Done')]);
  const uni=mkB('Uni','#7e93a8',mcSeason,[C('Nature'),C('EIB'),C('Get Diploma in Oct')]);
  const si =mkB('Self Improvement','#c2a05a',mcSeason,[C('To do'),C('Doing'),C('Done')]);
  const corp=mkB('Corporate','#b0876d',mcWork,[C('Recruiting'),C('To do'),C('Done')]);
  const som =mkB('Somerset','#7e93a8',mcWork,[C('To do'),C('Doing'),C('Done')]);
  const pdc =mkB('Personal PDC','#c2a05a',mcWork,[C('To do'),C('Done')]);
  const st  =mkB('Startup','#c17b5d',mcWork,[C('To do'),C('Done')]);
  const per =mkB('Personal','#a08398',mcWork,[C('To do'),C('Done')]);
  const g1={id:uid(),parentId:null,title:'Finish strong at uni — diploma in October',note:''};
  const g2={id:uid(),parentId:null,title:'Bikini-comp ready — strongest body yet',note:''};
  const g3={id:uid(),parentId:null,title:'Figure out my path — Somerset, startup, or corporate',note:''};
  const T=[];
  const t=(b,ci,title,extra={})=>T.push({id:uid(),boardId:b.id,colId:b.columns[ci].id,
    title,note:'',due:null,done:false,goalId:null,createdAt:Date.now(),...extra});
  /* Personal Care */
  t(pc,0,'Lash extension inquiry (brown lashes)');
  t(pc,0,'Book dentist appointment');
  t(pc,0,'Appointment with Gaby (psychiatrist)');
  t(pc,0,'Buy Wellbutrin');
  t(pc,0,'Buy Tretinoin 0.025');
  t(pc,0,'Nail appointment');
  t(pc,0,'Laser appointment',{due:'2026-08-01'});
  t(pc,0,'Hair cut in NY',{due:'2026-08-25',note:'Late August — while in NY (date approximate)'});
  /* Friends & Family */
  t(ff,0,"Buy Sofi's birthday gift");
  t(ff,0,"Buy Zuzu's birthday gift");
  t(ff,0,"Plan Zuzu's birthday",{due:'2026-08-12',note:'Before Aug 12'});
  t(ff,0,'Lunch with Marias',{due:'2026-08-01',note:'Sábado'});
  t(ff,0,'Brunch con aguas',{due:'2026-07-28',note:'Today, 2:00 pm'});
  /* Wellness — routines + to dos */
  t(wl,0,'Lean Bulk — diet phase');
  t(wl,0,'Bikini Comp — PPP2x split');
  t(wl,1,'Find registrations for fit modeling comps',{goalId:g2.id});
  t(wl,1,'Buy lifting straps');
  t(wl,1,'Buy lifting belt');
  t(wl,1,'Buy sema');
  t(wl,1,'Buy corset',{due:'2026-08-25',note:'Late August — while in NY (date approximate)'});
  /* Uni */
  t(uni,0,'Schedule meeting with Yiye',{due:'2026-07-28',note:'URGENT'});
  t(uni,0,'Create methods section',{goalId:g1.id});
  t(uni,0,'Do results section',{goalId:g1.id});
  t(uni,0,'Do statistical analysis code',{goalId:g1.id});
  t(uni,0,'Review all citations manually',{goalId:g1.id});
  t(uni,1,'Fix UI');
  t(uni,1,'Add teammates to GitHub');
  t(uni,1,'Schedule office hours with Prof. Hirsa');
  /* Work sub-boards */
  t(corp,0,'Send CV');
  t(som,0,'Set up meeting with equity analyst',{goalId:g3.id});
  t(som,0,'Start working on family office',{due:'2026-09-12',note:'Starts Sep 12'});
  t(pdc,0,'Reunión en La Antigua',{due:'2026-08-08',note:'8 de agosto'});
  t(st,0,'Meeting with Dad about POS idea',{goalId:g3.id});
  t(st,0,'Set a timeline for the POS idea');
  t(per,0,'Brainstorm what I really want',{goalId:g3.id});
  t(per,0,'Set up coffee with Dad');
  const P=(era,items)=>({id:uid(),era,items:items.map(x=>({id:uid(),text:x,done:false}))});
  return {
    meta:{mission:'A calm, intentional season — health, faith, and work that matters.'},
    masterColumns:[{id:mcNow,name:'Now'},{id:mcSeason,name:'This season'},{id:mcWork,name:'Work'},{id:mcSome,name:'Someday'}],
    boards:[pc,ff,wl,uni,si,corp,som,pdc,st,per],
    goals:[g1,g2,g3],
    tasks:T,
    plan:[
      P('Now — late summer ’26',['Wrap up the Nature paper','Lean bulk + PPP2x phase','Plan & celebrate Zuzu’s birthday']),
      P('Fall ’26',['Sep 12 — start at the family office (Somerset)','October — get my diploma','Decide on the POS idea with Dad']),
      P('2027',['Choose my main lane — corporate, startup, or my own thing']),
      P('Someday',['Fit modeling comps']),
    ]
  };
}
/* storage that never throws — some phone/preview contexts forbid localStorage */
let CAN_STORE=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){CAN_STORE=false;}
['keydown','keypress','keyup'].forEach(ev=>window.addEventListener(ev,e=>{
  const t=e.target;
  if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.isContentEditable)
     &&!e.metaKey&&!e.ctrlKey&&!e.altKey)e.stopPropagation();
},true));
const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
};
const HOSTED=true;
var HOSTED_EMPTY=false;   // true while a hosted device is waiting for its first sync
let S=null,FRESH=false;
try{S=JSON.parse(store.get(KEY));}catch(e){}
if(!S){S=seed();FRESH=true;}   // FRESH: embedded data (if present) replaces the sample seed outright
if(FRESH&&HOSTED){S={meta:{mission:''},masterColumns:[],boards:[],goals:[],tasks:[],plan:[],priCols:null,stars:[],rewards:[]};HOSTED_EMPTY=true;}
function addHorizonCol(b){
  if(b.columns.some(c=>/on the horizon|^shelved$/i.test(c.name)))return;
  const col={id:uid(),name:'Shelved'};
  b.columns.push(col);
}
function ensureDefaults(){
  if(!S.plan)S.plan=[];
  if(!S.priCols)S.priCols=[{id:uid(),name:'Do now!'},{id:uid(),name:'Do soon'},{id:uid(),name:'Later'}];
  /* "On the horizon" means shelved on a board — so the triage bucket takes a different word */
  (S.priCols||[]).forEach(c=>{if(/^on the horizon$/i.test(c.name.trim()))c.name='Later';});
  if(!S.meta.horizonCols){S.boards.forEach(addHorizonCol);S.meta.horizonCols=true;}
  if(!S.gcal)S.gcal=[];
  /* north stars become first-class — promoted out of the Life Plan chapter that held them */
  if(!S.stars){
    S.stars=[];
    const ns=(S.plan||[]).find(e=>/north star/i.test(e.era));
    if(ns){
      ns.items.forEach(it=>S.stars.push({id:uid(),title:it.text,note:''}));
      S.plan=S.plan.filter(e=>e!==ns);
    }
  }
  /* the plan's items were always goals — promote them, chapters keep only the time */
  if(!S.meta.planGoals){
    (S.plan||[]).forEach(ch=>{
      if(/north star/i.test(ch.era)){ch.items=[];return;}   // those are bearings, not goals
      (ch.items||[]).forEach(it=>{
        let g=S.goals.find(x=>!x.parentId&&x.title.trim().toLowerCase()===String(it.text||'').trim().toLowerCase());
        if(!g){g={id:uid(),parentId:null,title:it.text,note:''};S.goals.push(g);}
        g.era=ch.id;
        if(it.starId&&!g.starId)g.starId=it.starId;
        if(it.done)g.achieved=it.done===true?Date.now():it.done;
      });
      ch.items=[];
    });
    S.meta.planGoals=true;
  }
  if(!S.claude)S.claude={notes:[],inbox:[]};
  if(!S.claude.inbox)S.claude.inbox=[];
  if(!S.imports)S.imports=[];
  if(!S.rewards)S.rewards=[];
  if(!S.meta.ints)S.meta.ints={gcal:{}};
  purgeBuried();
  /* seed ghosts: an empty "Now", "Boards", or "This season" group is scaffolding leaked in
     from an old build's merge — bury it on sight so it dies on every device, forever */
  if(S.masterColumns.length>1)
    S.masterColumns=S.masterColumns.filter(c=>{
      if(/^(now|boards|this season)$/i.test((c.name||'').trim())&&!S.boards.some(b=>b.masterCol===c.id)){
        tombstone(c.id);return false;
      }
      return true;
    });
  /* never leave the app without somewhere to put a board, but never invent groups either */
  if(!S.masterColumns.length&&(S.boards.length||!HOSTED_EMPTY))
    S.masterColumns=[{id:uid(),name:'Boards'}];
  if(S.masterColumns.length){
    const first=S.masterColumns[0].id, have=new Set(S.masterColumns.map(c=>c.id));
    S.boards.forEach(b=>{if(!have.has(b.masterCol))b.masterCol=first;});
  }
  if(!S.meta.doneIsStatus){
    S.boards.forEach(b=>{
      const done=(b.columns||[]).filter(c=>/^done$/i.test(String(c.name).trim()));
      if(!done.length)return;
      const home=(b.columns||[]).find(c=>!/^done$/i.test(String(c.name).trim())&&c.kind!=='routine');
      done.forEach(dc=>{
        S.tasks.forEach(t=>{
          if(t.boardId!==b.id||t.colId!==dc.id)return;
          const prev=t.prevColId&&b.columns.some(c=>c.id===t.prevColId&&c.id!==dc.id)?t.prevColId:null;
          t.colId=prev||(home?home.id:t.colId);
          t.prevColId=null;
        });
        tombstone(dc.id);
      });
      b.columns=(b.columns||[]).filter(c=>!/^done$/i.test(String(c.name).trim()));
    });
    S.meta.doneIsStatus=true;
  }
  /* One-time, 31 July: a blank Compass — asked for, and repeatedly undone by a stale tab still
     pushing the old goals around. Baked into the build so one refresh settles it on every device.
     Anything created after this instant carries a later birthday and is left alone. */
  if(!S.meta.reset||(S.meta.reset.at||0)<BOOT_RESET)S.meta.reset={at:BOOT_RESET,what:['goals','stars']};
  applyReset();
  /* the shelf got a shorter name */
  S.boards.forEach(b=>b.columns.forEach(c=>{if(/^on the horizon$/i.test((c.name||'').trim()))c.name='Shelved';}));
}
/* A merge keeps whatever exists on either side, so it can never carry a deletion.
   A reset stamp can: whoever wrote it wins once, on every device, then goes quiet. */
const BOOT_RESET=1785505465877;
/* A merge keeps whatever exists on either side — so on its own it can never carry a deletion,
   and anything you delete comes straight back from the other tab. A tombstone is the missing
   half: the id of the thing you removed, and when. It outranks any copy that shows up later. */
function tombstone(){
  S.meta.tomb=S.meta.tomb||{};
  const now=Date.now();
  [].slice.call(arguments).forEach(id=>{if(id)S.meta.tomb[id]=now;});
}
function isBuried(x){return !!(x&&x.id&&S.meta.tomb&&S.meta.tomb[x.id]);}
function purgeBuried(){
  const tomb=S.meta&&S.meta.tomb;
  if(!tomb)return;
  const cut=Date.now()-120*864e5;                       // a tombstone stops mattering after four months
  Object.keys(tomb).forEach(k=>{if(tomb[k]<cut)delete tomb[k];});
  const live=a=>(a||[]).filter(x=>!isBuried(x));
  S.masterColumns=live(S.masterColumns);
  S.boards=live(S.boards);
  S.boards.forEach(b=>{b.columns=live(b.columns);});
  S.goals=live(S.goals);
  S.stars=live(S.stars);
  S.tasks=live(S.tasks);
  S.plan=live(S.plan);
  S.plan.forEach(e=>{e.items=live(e.items);});
  S.priCols=live(S.priCols);
  S.rewards=live(S.rewards);
  S.imports=live(S.imports||[]);
  if(S.claude){S.claude.notes=live(S.claude.notes);S.claude.inbox=live(S.claude.inbox);}
}
function applyReset(){
  const r=S.meta&&S.meta.reset;
  if(!r||!r.at)return;
  const what=r.what||[];
  /* Runs on every load, not once: a device that hasn't synced yet will keep pushing
     its old copies back, and each of them is older than the reset, so each gets dropped. */
  const older=x=>!x.createdAt||x.createdAt<r.at;
  if(what.indexOf('goals')>=0){
    S.goals.filter(older).forEach(g=>tombstone(g.id));
    S.goals=S.goals.filter(g=>!older(g));
    const live=new Set(S.goals.map(g=>g.id));
    S.tasks.forEach(t=>{if(t.goalId&&!live.has(t.goalId))t.goalId=null;});
  }
  if(what.indexOf('stars')>=0){
    (S.stars||[]).filter(older).forEach(x=>tombstone(x.id));
    S.stars=(S.stars||[]).filter(x=>!older(x));
    const live=new Set(S.stars.map(x=>x.id));
    S.goals.forEach(g=>{if(g.starId&&!live.has(g.starId))g.starId=null;});
    (S.plan||[]).forEach(e=>(e.items||[]).forEach(i=>{if(i.starId&&!live.has(i.starId))i.starId=null;}));
  }
  if(what.indexOf('rewards')>=0)S.rewards=(S.rewards||[]).filter(x=>!older(x));
  S.meta.resetAck=r.at;
}
ensureDefaults();
resigAll(S);
/* Claude's updates ride inside this file — merged on every load, no file link needed */
function absorbEmbedded(){
  try{
    const el=document.getElementById('claudeData');
    if(!el)return;
    const txt=el.textContent.trim();
    if(!txt||txt.startsWith('__'))return;
    const data=JSON.parse(txt);
    if(data&&data.meta){
      if(FRESH){S=data;FRESH=false;}
      else S=mergeStates(S,data);
      ensureDefaults();
    }
  }catch(e){}
}
/* who touched what: save() notices edited goals/stars/boards/chapters and stamps them,
   so no mutation site anywhere needs to remember to. Signatures refresh after every merge
   so freshly merged-in objects don't read as local edits. */
var _sig=null;   // var: boot calls resigAll before this line executes
function _sigOf(o){const c={...o};delete c.touchedAt;return JSON.stringify(c);}
function resigAll(st){_sig={};[st.goals,st.stars,st.boards,st.plan,st.masterColumns].forEach(a=>(a||[]).forEach(o=>{if(o&&o.id)_sig[o.id]=_sigOf(o);}));}
function stampChanged(){
  if(!_sig){resigAll(S);return;}
  [S.goals,S.stars,S.boards,S.plan,S.masterColumns].forEach(a=>(a||[]).forEach(o=>{
    if(!o||!o.id)return;
    const j=_sigOf(o);
    if(_sig[o.id]!==undefined&&_sig[o.id]!==j)o.touchedAt=Date.now();
    _sig[o.id]=j;
  }));
}
function save(){
  stampChanged();
  S.meta.updatedAt=Date.now();
  /* never let an empty shell pave over a real document — if this boot came up blank
     (storage evicted, read raced, private mode) but the key now holds substance, keep it */
  if(!S.tasks.length&&!S.boards.length&&!S.goals.length&&!Object.keys((S.meta&&S.meta.tomb)||{}).length){
    const held=store.get(KEY);
    if(held&&held.length>1000)return;
  }
  store.set(KEY,JSON.stringify(S));
  const el=document.getElementById('saveStamp');
  if(el){
    const t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    el.textContent=(typeof SB!=='undefined'&&SB.user)
      ?'Saved to your account · '+t
      :'Saved on this device · '+t;
  }
  if(typeof sbSchedulePush==='function')sbSchedulePush();
  if(typeof gcalScheduleAuto==='function')gcalScheduleAuto();
}

/* ============ helpers ============ */
const board=id=>S.boards.find(b=>b.id===id);
const goal=id=>S.goals.find(g=>g.id===id);
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const boardTasks=bid=>S.tasks.filter(t=>t.boardId===bid);
const colOf=t=>{const b=board(t.boardId);return b?b.columns.find(c=>c.id===t.colId):null;};
const isRoutine=t=>{const c=colOf(t);return !!(c&&c.kind==='routine');};
/* appointments: commitments AT a time, not work you can knock out early.

/* ============ one-press calendar sync ============
   Builds a single .ics of everything dated that Google hasn't seen yet.
   Stable UIDs mean re-syncing an edited item updates it instead of duplicating. */
const needsSync=t=>!!t.due&&!t.done&&!isRoutine(t)&&
  (!t.gcalId||(t.touchedAt||0)>(t.gcalSyncAt||0));
function syncQueue(){return S.tasks.filter(needsSync);}
function icsEsc(s){return String(s||'').replace(/([\\,;])/g,'\\$1').replace(/\r?\n/g,'\\n');}
function icsBuild(list){
  const p=n=>String(n).padStart(2,'0');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const dayAfter=d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+1);
    return x.getFullYear()+p(x.getMonth()+1)+p(x.getDate());};
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Atelier//Personal//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(t=>{
    const b=board(t.boardId), d=t.due.replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:'+t.id+'@atelier','DTSTAMP:'+stamp,
      'SUMMARY:'+icsEsc(t.title),
      'DESCRIPTION:'+icsEsc((t.note?t.note+'\n\n':'')+'From Atelier · '+(b?b.name:'')));
    if(t.start){
      L.push('DTSTART;TZID=America/Guatemala:'+d+'T'+t.start.replace(':','')+'00',
             'DTEND;TZID=America/Guatemala:'+d+'T'+endOf(t).replace(':','')+'00');
    }else{
      L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+dayAfter(t.due));
    }
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function calSyncFileFallback(){
  const list=syncQueue();
  if(!list.length)return;
  const blob=new Blob([icsBuild(list)],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download='atelier-'+todayStr()+'.ics';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  const now=Date.now();
  list.forEach(t=>{if(!t.gcalId)t.gcalId='ics-'+t.id;t.gcalSyncAt=now;});
  save();
  window.calSynced=list.length;
  render();
}

/* ============ master (studio) ============ */
/* how much a board still asks of you: 0 = live work, 1 = only scheduled, 2 = at rest */
function boardTier(b){
  const all=boardTasks(b.id).filter(t=>!t.done&&!isRoutine(t)&&!isShelved(t));
  const live=all.filter(t=>!isAppt(t)&&!t.done);
  const open=live.filter(t=>!isWaiting(t)).length;   // waiting work isn't callable work
  if(open)return 0;
  if(live.length)return 2;                            // everything here waits on something or someone
  const appt=all.filter(t=>isAppt(t)&&!t.done&&(!t.due||t.due>=todayStr())).length;
  return appt?1:2;
}
function boardCard(b){
  const all=boardTasks(b.id).filter(t=>!t.done), rn=all.filter(isRoutine).length;
  const shelved=all.filter(t=>!isRoutine(t)&&isShelved(t)&&!t.done).length;
  const timed=all.filter(t=>!isRoutine(t)&&isAppt(t)&&!isShelved(t));
  const ts=all.filter(t=>!isRoutine(t)&&!isAppt(t)&&!isShelved(t));   // only live work counts
  const open=ts.filter(t=>!t.done).length, done=ts.length-open;
  const p=progress(ts);
  const apptOpen=timed.filter(t=>!t.done&&(!t.due||t.due>=todayStr())).length;
  /* only say something if it asks something of you today */
  const today=todayStr();
  const late=ts.filter(t=>!t.done&&t.due&&t.due<today).length;
  const now=ts.filter(t=>!t.done&&t.due===today).length;
  const call=late?`<div class="bcard-due overdue">${late} overdue</div>`
    :now?`<div class="bcard-due">${now} due today</div>`:'';
  /* dim exactly as we sort: the same tier drives both, so a dimmed board is always low */
  const tier=boardTier(b);
  const rest=tier===2;                        // at rest, or everything on it waits
  const sched=tier===1;                       // only appointments left
  const alldone=rest&&ts.length>0&&ts.every(t=>t.done);   // the checkmark is for finishing, not waiting

      ondragstart="dragBoard(event,'${b.id}')" ondragend="dragEnd(event)"

    <div class="bcard-meta"><span>${open} open</span><span>${done} done</span>${apptOpen?`<span>◷ ${apptOpen}</span>`:''}${shelved?`<span>${shelved} shelved</span>`:''}${rn?`<span>${rn} routine${rn>1?'s':''}</span>`:''}</div>
    <div class="mini-track"><div class="mini-fill" style="width:${p??0}%;background:${b.accent}"></div></div>
    ${call}
  </div>`;
}

/* The Rhythm — once a week the Studio asks for an honest word on each practice.
   Three answers, no checkboxes, no streaks; the truth is the whole mechanism. */
const RHYTHM_GAP=6.5*864e5;
const lastPulse=t=>(t.pulse||[])[(t.pulse||[]).length-1]||null;
function rhythmDue(){
  return S.tasks.some(isRoutine) && Date.now()-(S.meta.rhythmAt||0)>RHYTHM_GAP;
}
function rhythmMark(id,v){
  const t=S.tasks.find(t=>t.id===id); if(!t)return;
  t.pulse=(t.pulse||[]).slice(-25);
  t.pulse.push({at:Date.now(),v});
  touch(t);
  if(S.tasks.filter(isRoutine).every(r=>{const p=lastPulse(r);return p&&Date.now()-p.at<12*3600e3;}))
    S.meta.rhythmAt=Date.now();
  save();render();
}
function rhythmLater(){S.meta.rhythmAt=Date.now()-RHYTHM_GAP+2*864e5;save();render();}
function rhythmStrip(){
  if(!rhythmDue())return '';
  const routines=S.tasks.filter(isRoutine);
  const V=[['kept','kept'],['wobbly','wobbly'],['slipped','let it slip']];
  return `<div class="rhythm">
    <div class="rhythm-head">
      <span class="rhythm-t">The rhythm</span>
      <span class="rhythm-sub">a week's honest word on each practice — that's the whole ritual</span>
      <span class="spacer"></span>
      <button class="cl-live-link" onclick="rhythmLater()">not now</button>
    </div>
    ${routines.map(t=>{
      const b=board(t.boardId), p=lastPulse(t), fresh=p&&Date.now()-p.at<12*3600e3;
      return `<div class="rhythm-row">
        <span class="dot" style="background:${b?b.accent:'#999'}"></span>
        <span class="rhythm-name">${esc(t.title)}</span>
        ${fresh?`<span class="rhythm-said ${p.v}">${p.v==='slipped'?'let it slip':p.v}</span>`
          :V.map(([v,l])=>`<button class="rhythm-btn ${v}" onclick="rhythmMark('${t.id}','${v}')">${l}</button>`).join('')}
      </div>`;}).join('')}
  </div>`;
}
/* adherence — how the recent rhythm words lean: 1 kept, 0 slipped, quietly in between */
function adherence(t){
  const ps=(t.pulse||[]).slice(-4);
  if(!ps.length)return null;
  const val={kept:1,wobbly:.5,slipped:0};
  let num=0,den=0;
  ps.forEach((p,i)=>{const w=i+1;num+=w*(val[p.v]??.5);den+=w;});
  return num/den;
}
/* a key result can be held by a practice: a season with an end date, graded by the rhythm */
function krRoutineOf(kr){const l=kr&&kr.link;return l&&l.kind==='routine'?S.tasks.find(t=>t.id===l.taskId):null;}
function krSeason(kr){
  const l=kr&&kr.link, t=krRoutineOf(kr); if(!t)return null;
  const end=l.until?new Date(l.until+'T23:59:59').getTime():Infinity;
  const ps=(t.pulse||[]).filter(p=>p.at>=(l.since||0)&&p.at<=end);
  if(!ps.length)return null;
  const val={kept:1,wobbly:.5,slipped:0};
  return ps.reduce((a,p)=>a+(val[p.v]??.5),0)/ps.length;   // the plain average — the season's grade

/* ============ drag & drop ============ */
let drag=null; // {type:'board'|'task'|'plan'|'col'|'mcol'|'pricol', id}
function dragAnyCol(ev,type,id,boardId){
  drag={type,id,boardId};ev.dataTransfer.effectAllowed='move';ev.stopPropagation();
}
function reorderCols(list,dragId,targetId){
  if(dragId===targetId)return list;
  const from=list.findIndex(c=>c.id===dragId);
  if(from<0)return list;
  const [col]=list.splice(from,1);
  const to=targetId?list.findIndex(c=>c.id===targetId):0;
  list.splice(to<0?list.length:to,0,col);
  return list;
}
function dragBoard(ev,id){drag={type:'board',id};ev.target.classList.add('dragging');ev.dataTransfer.effectAllowed='move';}
function dragTask(ev,id){drag={type:'task',id};ev.target.classList.add('dragging');ev.dataTransfer.effectAllowed='move';ev.stopPropagation();}
function dragEnd(ev){ev.target.classList.remove('dragging');}
function overCol(ev){ev.preventDefault();ev.currentTarget.classList.add('drag-over-col');}
function leaveCol(ev){ev.currentTarget.classList.remove('drag-over-col');}
function dropBoard(ev,mcolId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(drag&&drag.type==='mcol'){reorderCols(S.masterColumns,drag.id,mcolId);drag=null;render();return;}
  if(!drag||drag.type!=='board')return;
  const b=board(drag.id); if(!b)return;
  b.masterCol=mcolId;
  // reorder: place before the card we dropped on, if any
  const overCard=ev.target.closest('.bcard');
  S.boards=S.boards.filter(x=>x.id!==b.id);
  if(overCard&&overCard.dataset.bid!==b.id){
    const i=S.boards.findIndex(x=>x.id===overCard.dataset.bid);
    S.boards.splice(i,0,b);
  }else S.boards.push(b);
  drag=null;render();
}
function dropTask(ev,colId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(drag&&drag.type==='col'){reorderCols(board(drag.boardId).columns,drag.id,colId);drag=null;render();return;}
  if(!drag||drag.type!=='task')return;
  const t=S.tasks.find(x=>x.id===drag.id); if(!t)return;
  t.colId=colId;
  const b=board(t.boardId), col=b.columns.find(c=>c.id===colId);
  if(col&&col.kind==='routine'){t.done=false;t.completedAt=null;}
  else if(col&&/done/i.test(col.name)){t.done=true;t.completedAt=Date.now();}
  touch(t);
  const overCard=ev.target.closest('.tcard');
  S.tasks=S.tasks.filter(x=>x.id!==t.id);
  if(overCard&&overCard.dataset.tid!==t.id){
    const i=S.tasks.findIndex(x=>x.id===overCard.dataset.tid);
    S.tasks.splice(i,0,t);
  }else S.tasks.push(t);
  drag=null;render();
}

function passesFilters(t){
  if(filters.status==='open'&&t.done)return false;
  if(filters.status==='done'&&!t.done)return false;
  if(filters.goal!=='all'){
    if(filters.goal==='none'&&t.goalId)return false;
    if(filters.goal!=='none'&&t.goalId!==filters.goal)return false;
  }
  if(filters.due!=='all'){
    const today=todayStr();
    if(filters.due==='overdue'&&!(t.due&&t.due<today&&!t.done))return false;
    if(filters.due==='today'&&t.due!==today)return false;
    if(filters.due==='week'){
      if(!t.due)return false;
      const wk=new Date();wk.setDate(wk.getDate()+7);
      const wks=wk.getFullYear()+'-'+String(wk.getMonth()+1).padStart(2,'0')+'-'+String(wk.getDate()).padStart(2,'0');
      if(t.due>wks||t.due<today)return false;
    }
    if(filters.due==='dated'&&!t.due)return false;
  }
  return true;
}
function renderList(b){
  const goalOpts=S.goals.map(g=>`<option value="${g.id}" ${filters.goal===g.id?'selected':''}>${g.parentId?'— ':''}${esc(g.title)}</option>`).join('');
  const bar=`<div class="filters">
    <select onchange="filters.status=this.value;render()">
      ${['all','open','done'].map(v=>`<option value="${v}" ${filters.status===v?'selected':''}>${v==='all'?'All tasks':v==='open'?'Open':'Done'}</option>`).join('')}
    </select>
    <select onchange="filters.due=this.value;render()">
      ${[['all','Any due date'],['overdue','Overdue'],['today','Due today'],['week','Due this week'],['dated','Has a date']].map(([v,l])=>`<option value="${v}" ${filters.due===v?'selected':''}>${l}</option>`).join('')}
    </select>
    <select onchange="filters.goal=this.value;render()">
      <option value="all">Any goal</option><option value="none" ${filters.goal==='none'?'selected':''}>No goal</option>${goalOpts}
    </select>
  </div>`;
  const groups=b.columns.map(c=>{
    const all=S.tasks.filter(t=>t.boardId===b.id&&t.colId===c.id&&!t.done);
    const ts=byUrgent(all.filter(passesFilters));
    const rows=ts.map(t=>{
      const g=t.goalId?goal(t.goalId):null;
      const rt=isRoutine(t);
      return `<div class="lrow ${t.done?'done-card':''} ${rt?'routine-card':''}" ${rt?`style="${adhStyle(t)}"`:''} onclick="openDrawer('${t.id}')">
        ${rt?'<span class="inf">∞</span>'
           :`<button class="tick ${t.done?'on':''}" onclick="event.stopPropagation();toggleDone('${t.id}')">
          <svg viewBox="0 0 12 12"><path d="M2 6.5 4.8 9 10 3"/></svg></button>`}
        <span class="t-title">${esc(t.title)}</span>
        <span class="lmeta">
          ${urgentChip(t)}
        ${ageChip(t)}
          ${t.progress!=null&&!t.done?`<span class="chip">${t.progress}%</span>`:''}
          ${g?`<span class="chip goal-chip">${esc(g.title)}</span>`:''}
          ${whenChip(t)}
        </span>
      </div>`;
    }).join('');
    const hiddenN=all.length-ts.length;
    return `<div class="lsec">
      <div class="list-group-name" onclick="toggleFold('${b.id}','${c.id}')">
        <span class="caret">${c.folded?'▸':'▾'}</span>${esc(c.name)}
        <span class="col-count">${ts.length}${hiddenN?' · '+hiddenN+' filtered out':''}</span>
        ${c.kind==='routine'?'<span class="col-count">∞</span>':''}
      </div>
      ${c.folded?'':`<div class="lsec-body">${rows||''}
        <button class="add-inline" onclick="quickAddList(event,'${b.id}','${c.id}')">+ Add task</button></div>`}
    </div>`;
  }).join('');
  return `<div class="list-wrap">${bar}${groups}</div>`;
}

function b_delete(id){
  const b=board(id);
  const mine=boardTasks(id), openN=mine.filter(t=>!t.done).length, doneN=mine.length-openN;
  if(!confirm('Delete this board'+(openN?' and its '+openN+' open task(s)':'')+'?'
      +(doneN?' Its '+doneN+' finished one(s) stay in the Laurels.':'')))return;
  mine.forEach(t=>{if(t.done){t.boardName=b.name;t.touchedAt=Date.now();}});   // the record keeps the name
  tombstone.apply(null,[id].concat(mine.filter(t=>!t.done).map(t=>t.id),
    (b.columns||[]).map(c=>c.id)));
  S.tasks=S.tasks.filter(t=>!(t.boardId===id&&!t.done));
  S.boards=S.boards.filter(x=>x.id!==id);
  go('master');
}

    S.tasks.forEach(t=>{if(t.boardId===bid&&t.colId===cid){t.done=false;t.completedAt=null;}});}

/* one smart composer, used by every quick-add in the app */
function nlComposer(container,before,bid,cid){
  if(container.querySelector('.ghost-new'))return;
  const box=document.createElement('div');
  box.className='ghost-box';
  const inp=document.createElement('input');
  inp.className='ghost-new';
  inp.placeholder='What needs doing?  “dinner at Zuzu’s 8:30pm today”';
  const hint=document.createElement('div');
  hint.className='ghost-hint';
  box.appendChild(inp);box.appendChild(hint);
  if(before)container.insertBefore(box,before); else container.appendChild(box);
  inp.focus();
  let doneAdding=false;
  const refresh=()=>{
    const v=inp.value.trim();
    const h=v?nlHint(nlParse(v)):'';
    hint.innerHTML=h;hint.style.display=h?'block':'none';
  };
  const commit=()=>{
    if(doneAdding)return; doneAdding=true;
    const v=inp.value.trim();
    if(v){
      const p=nlParse(v);
      S.tasks.push({id:uid(),boardId:bid,colId:cid,title:p.title,note:'',
        due:p.due,start:p.start,end:p.end,urgent:p.appt?false:(p.urgent||undefined),
        kind:p.appt?'appt':'task',       // a stated hour, or a word like "dinner", means be there
        done:false,goalId:null,createdAt:Date.now(),touchedAt:Date.now()});
    }
    render();
  };
  inp.addEventListener('input',refresh);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){doneAdding=true;render();}});
  inp.addEventListener('blur',commit);
}
function quickAdd(bid,cid,btn){
  nlComposer(btn.parentElement.querySelector('.col-body'),null,bid,cid);
}
/* Finishing something doesn't move it. It stays in the column it belongs to — which is what
   lets a key result count "3 of 7 in Uni · Nature" instead of watching its own denominator
   walk away. Done work simply stops being shown, everywhere except the Laurels. */
function toggleDone(id){
  const t=S.tasks.find(t=>t.id===id);
  if(!t)return;
  t.done=!t.done;
  t.completedAt=t.done?Date.now():null;
  if(t.done){
    const ev=window.event;
    const cx=ev&&ev.clientX?ev.clientX:innerWidth/2, cy=ev&&ev.clientX?ev.clientY:innerHeight*0.35;
    celebrate(cx,cy);
    const freed=S.tasks.filter(x=>x.after===id&&!x.done);
    if(freed.length)setTimeout(()=>{
      const w=document.createElement('div');
      w.className='burst-word';
      w.textContent='unblocks '+(freed.length===1?'\u201c'+(freed[0].title.length>26?freed[0].title.slice(0,25)+'\u2026':freed[0].title)+'\u201d':freed.length+' tasks');
      w.style.cssText='left:'+cx+'px;top:'+(cy+26)+'px';
      document.body.appendChild(w);
      setTimeout(()=>w.remove(),1600);
    },420);
  }
  touch(t);
  render();
}
/* a finished thing deserves a small firework */
function celebrate(x,y){
  const colors=['var(--sage)','var(--star)','var(--terracotta)','var(--dusk)','var(--mauve)'];
  for(let i=0;i<12;i++){
    const s=document.createElement('span');
    s.className='burst';
    s.textContent=Math.random()<0.35?'✦':'•';
    const a=(Math.PI*2*i)/12+(Math.random()-.5)*.7, d=30+Math.random()*36;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.fontSize=(9+Math.random()*7)+'px';
    s.style.setProperty('--dx',Math.cos(a)*d+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d-16)+'px');
    s.style.color=colors[i%colors.length];
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),820);
  }
  const w=document.createElement('span');
  w.className='burst-word';
  w.textContent='done.';
  w.style.left=x+'px'; w.style.top=y+'px';
  document.body.appendChild(w);
  setTimeout(()=>w.remove(),950);
}

function closeDrawer(){drawerTask=null;$('drawer').classList.remove('open');$('scrim').classList.remove('open');document.body.classList.remove('drawer-open');render();}
/* typing "urgent" / "urgente" / "asap" — or any ! — anywhere in a title IS the urgent tag */
function urgentStrip(v){
  const g=[];
  v=String(v).replace(/\\+([^\s\\]+)/g,(m,w)=>{g.push(w);return '\u0001'+(g.length-1)+'\u0001';});
  const has=/(^|\s)(urgent|urgente|asap)\b/i.test(v)||v.includes('!');
  const title=v.replace(/(^|\s)(urgent|urgente|asap)\b[:,;\-\s]*/gi,' ').replace(/!+/g,'').replace(/\s+/g,' ').trim()
    .replace(/\u0001(\d+)\u0001/g,(m,i)=>g[+i]);
  return {has,title};
}
function t_set(k,v){
  const t=S.tasks.find(x=>x.id===drawerTask); if(!t)return;
  if(k==='after'&&v)t.waitWho=null;   // one wait at a time
  let reopen=false;
  if(k==='title'){
    /* edits get the same natural-language treatment as new tasks: dates, times, urgency */
    const p=nlParse(v);
    if(p.urgent)t.urgent=true;
    if(p.due){t.due=p.due;reopen=true;}
    if(p.start){t.start=p.start;if(!t.due)t.due=todayStr();reopen=true;}
    if(p.end){t.end=p.end;reopen=true;}
    if(p.title&&p.title!==v){v=p.title;
      const el=document.querySelector('.d-title');if(el)el.value=v;}
  }
  t[k]=(k==='title'||k==='note')?v.trim()||t[k]:v;
  if(k==='start'&&v&&!t.due)t.due=todayStr();      // a time implies a day
  if(k==='start'&&v&&t.end&&t.end<=v)t.end=null;   // drop a now-invalid end
  touch(t);save();
  if((k!=='title'&&k!=='note')||reopen)openDrawer(drawerTask); // refresh chips, dates & gcal link
}
function t_delegate(){
  const t=S.tasks.find(x=>x.id===drawerTask); if(!t)return;
  t.claude=t.claude?undefined:true;
  touch(t);save();
  if(t.claude)askClaude(taskPrompt(t.id,'delegate'));   // delegating means: get Claude on it now
  openDrawer(drawerTask);render();
}
function clUndelegate(id){
  const t=S.tasks.find(x=>x.id===id); if(!t)return;
  t.claude=undefined;touch(t);save();render();
}
function t_setProg(v,final){
  const t=S.tasks.find(x=>x.id===drawerTask); if(!t)return;
  t.progress=Math.max(0,Math.min(100,+v));
  const el=document.querySelector('.prog-val'); if(el)el.textContent=t.progress+'%';
  touch(t);save();
  if(final)openDrawer(drawerTask);
}
function t_clearProg(){
  const t=S.tasks.find(x=>x.id===drawerTask);
  t.progress=null;touch(t);save();openDrawer(drawerTask);
}
function t_toggleUrgent(){
  const t=S.tasks.find(x=>x.id===drawerTask);
  t.urgent=!t.urgent;touch(t);save();openDrawer(drawerTask);
}
function t_setKind(k){
  const t=S.tasks.find(x=>x.id===drawerTask); if(!t)return;
  t.kind=k;
  if(k==='appt'){t.urgent=false;t.priCol=null;t.progress=null;if(!t.due)t.due=todayStr();}
  touch(t);save();openDrawer(drawerTask);
}
function t_blockTime(){
  const t=S.tasks.find(x=>x.id===drawerTask); if(!t)return;
  const n=new Date(); let h=n.getHours()+1; if(h>22)h=9;
  const p=x=>String(x).padStart(2,'0');
  const a={id:uid(),boardId:t.boardId,colId:t.colId,title:t.title,note:'',
    due:t.due&&t.due>=todayStr()?t.due:todayStr(),start:p(h)+':00',end:p((h+1)%24)+':00',
    kind:'appt',blockFor:t.id,done:false,goalId:t.goalId||null,
    createdAt:Date.now(),touchedAt:Date.now()};
  S.tasks.push(a);save();openDrawer(a.id);
}
function t_clearTime(){
  const t=S.tasks.find(x=>x.id===drawerTask);
  t.start=null;t.end=null;touch(t);save();openDrawer(drawerTask);
}
function t_setCol(cid){
  const t=S.tasks.find(x=>x.id===drawerTask);
  t.colId=cid;
  const col=board(t.boardId).columns.find(c=>c.id===cid);
  if(col&&/done/i.test(col.name)){t.done=true;t.completedAt=Date.now();}
  touch(t);save();
}
function t_delete(){
  if(!confirm('Delete this task?'))return;
  tombstone(drawerTask);
  S.tasks=S.tasks.filter(t=>t.id!==drawerTask);
  closeDrawer();
}

/* ============ goals (OKR) ============ */
function renderGoals(){
  const tops=S.goals.filter(g=>!g.parentId);
  const blocks=tops.map(g=>{
    const subs=S.goals.filter(s=>s.parentId===g.id);
    const all=goalTaskSet(g.id), p=progress(all);
    const own=S.tasks.filter(t=>t.goalId===g.id&&!isRoutine(t));
    const taskRow=t=>{
      const b=board(t.boardId);
      return `<div class="linked-t ${t.done?'done':''}" onclick="go('board','${t.boardId}');openDrawer('${t.id}')">
        <span>${t.done?'✓':'○'}</span><span>${esc(t.title)}</span>
        <span class="b-tag">${esc(b?b.name:'')}</span>
        ${t.due?`<span class="small muted">${fmtDue(t.due)}</span>`:''}
        ${t.urgent?'<span class="chip urgent-chip">!</span>':''}
      </div>`;
    };
    const subRows=subs.map(s=>{
      const st=S.tasks.filter(t=>t.goalId===s.id&&!isRoutine(t)), sp=progress(st);
      return `<div class="sub-block">
        <div class="sub-row">
          <input class="sub-title-in" value="${esc(s.title)}" onchange="g_rename('${s.id}',this.value)">
          <span class="small muted">${st.length?st.filter(t=>t.done).length+' / '+st.length:'no tasks yet'}</span>
          <div class="sub-track"><div class="fill" style="width:${sp??0}%"></div></div>
          <div class="goal-tools"><button class="btn-ghost" onclick="g_delete('${s.id}')">×</button></div>
        </div>
        <div class="sub-tasks">${st.map(taskRow).join('')||'<div class="sub-empty">no tasks yet — link some from any task’s drawer</div>'}</div>
      </div>`;
    }).join('');
    const linkedRows=own.map(taskRow).join('');
    return `<div class="goal-block">
      <div class="goal-row">
        <input class="goal-title-in" value="${esc(g.title)}" onchange="g_rename('${g.id}',this.value)">
        <span class="goal-pct">${p===null?'no tasks yet':p+'% · '+all.filter(t=>t.done).length+' of '+all.length}</span>
        <div class="goal-tools"><button class="btn-ghost" onclick="g_delete('${g.id}')">delete</button></div>
      </div>
      <div class="track"><div class="fill" style="width:${p??0}%"></div></div>
      <div class="subgoals">${subRows}
        <button class="add-inline" onclick="g_add('${g.id}',this.parentElement)">+ Sub-goal</button></div>
      ${own.length?`<div class="linked-tasks">
        ${subs.length?'<div class="d-label" style="margin:12px 0 2px">Linked directly to the goal</div>':''}
        ${linkedRows}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="mission-wrap">
      <div class="mission-label">Mission</div>
      <textarea class="mission-input" rows="2" onchange="S.meta.mission=this.value;save()">${esc(S.meta.mission)}</textarea>
    </div>
    <div class="goals-list">${blocks}
      <div class="goal-block" style="border-bottom:1px solid var(--line)">
        <button class="btn-ghost" onclick="g_add(null,this.parentElement)" style="font-size:13.5px">+ New goal</button>
      </div>
    </div>`;
}
function g_add(parentId,host,starId){
  const make=v=>{
    const g={id:uid(),parentId:parentId||null,title:v,note:'',createdAt:Date.now()};
    if(parentId){g.current=0;g.target=null;g.unit=null;goalOpen.add(parentId);}   // a key result, not a bearing-holder
    else g.starId=starId||null;                                                   // only objectives anchor to a star
    S.goals.push(g);
  };
  if(host&&host.nodeType===1)
    textComposer(host,parentId?'What number proves this happened?…':'Name this goal…',make);
  else{make(parentId?'New key result':'New goal');save();render();}
}
function g_rename(id,v){const g=goal(id);if(g&&v.trim())g.title=v.trim();save();}
function g_delete(id){
  const kids=S.goals.filter(g=>g.parentId===id);
  if(!confirm('Delete this goal'+(kids.length?' and its sub-goals':'')+'? Linked tasks stay, just unlinked.'))return;
  const ids=[id,...kids.map(k=>k.id)];
  tombstone.apply(null,ids);
  S.tasks.forEach(t=>{if(ids.includes(t.goalId))t.goalId=null;});
  S.goals=S.goals.filter(g=>!ids.includes(g.id));
  render();
}

/* ============ calendar ============ */
let calCur=null;          // {y,m,d} — anchor date
let calMode='month';      // 'month' | 'week'
const dstr=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const hmToMin=hm=>{const[a,b]=(hm||'0:0').split(':').map(Number);return a*60+(b||0);};
function calCellHTML(d,inMonth,extra,byDate,gByDate,today){
  const ds=dstr(d);
  const ts=byDate[ds]||[], gs=(gByDate&&gByDate[ds])||[];
  const n=ts.filter(t=>!t.done).length+gs.length;
  const heat=n?' heat-'+Math.min(n,4):'';
  return `<div class="cal-cell ${extra} ${inMonth?'':'cal-out'} ${ds===today?'cal-today':''}${heat}" onclick="calOpenDay('${ds}')" title="Open ${ds}">
    <div class="cal-dnum"><span>${d.getDate()}</span><button class="cal-addbtn" onclick="calAddPop(event,'${ds}')" title="Add a task on this day">+</button></div>
    <span class="cal-heatn">${n||''}</span>
    ${[...ts.filter(t=>!t.done).map(t=>({t,s:t.start||'99:99'})),...gs.map(e=>({e,s:e.start||'99:99'}))]
      .sort((a,b)=>a.s<b.s?-1:a.s>b.s?1:0)
      .map(x=>{
        if(x.t){const t=x.t,b=board(t.boardId);
          return `<div class="cal-ev" onclick="event.stopPropagation();openDrawer('${t.id}')" title="${esc(b?b.name:'')} — ${esc(t.title)}">
            <span class="dot" style="background:${b?b.accent:'#999'}"></span>
            ${t.urgent?'<span class="cal-urg">!</span>':''}
            ${t.start?`<span class="cal-time">${fmtSlot(t)}</span>`:''}
            <span class="cal-ev-t">${esc(t.title)}</span>
          </div>`;}
        const e=x.e;
        return `<div class="cal-ev gcal" title="From Google Calendar">
        <span class="gc-mark">G</span>
        ${e.start?`<span class="cal-time">${fmtSlot(e)}</span>`:''}
        <span class="cal-ev-t">${esc(e.title)}</span>
      </div>`;}).join('')}
  </div>`;
}
function calOpenDay(ds){
  const[y,m,dd]=ds.split('-').map(Number);
  calCur={y,m:m-1,d:dd};calMode='day';render();
}
/* week as a vertical agenda — the phone-native way to read time */
function renderWeekAgenda(start,byDate,gByDate,today,nDays){
  const days=[...Array(nDays||7)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
  return '<div class="agenda">'+days.map(d=>{
    const k=dstr(d);
    const ts=(byDate[k]||[]).filter(t=>!t.done), gs=gByDate[k]||[];
    const timed=[...ts.filter(t=>t.start).map(t=>({t})),...gs.filter(e=>e.start).map(e=>({e}))]
      .sort((a,b)=>hmToMin((a.t||a.e).start)-hmToMin((b.t||b.e).start));
    const allday=[...ts.filter(t=>!t.start).map(t=>({t})),...gs.filter(e=>!e.start).map(e=>({e}))];
    const rows=[...timed,...allday].map(x=>{
      if(x.t){const t=x.t,b=board(t.boardId);
        return `<div class="ag-row ${t.done?'done-card':''}" onclick="openDrawer('${t.id}')">
          <span class="ag-time">${t.start?fmtSlot(t):'all day'}</span>
          <span class="dot" style="background:${b?b.accent:'#999'}"></span>
          ${t.urgent?'<span class="cal-urg">!</span>':''}
          <span class="ag-t ${t.done?'ag-done':''}">${esc(t.title)}</span></div>`;}
      const e=x.e;
      return `<div class="ag-row ag-gcal">
        <span class="ag-time">${e.start?fmtSlot(e):'all day'}</span>
        <span class="gc-mark">G</span><span class="ag-t">${esc(e.title)}</span></div>`;
    }).join('');
    return `<div class="ag-day ${k===today?'ag-today':''}">
      <div class="ag-head">${d.toLocaleDateString('en-US',{weekday:'long'})}
        <b>${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</b>
        <button class="cal-addbtn" onclick="calAddPop(event,'${k}')" title="Add a task on this day">+</button>
        ${k===today?'<span class="ag-now">today</span>':''}</div>
      ${rows||'<div class="ag-empty">nothing planned — breathe</div>'}
    </div>`;
  }).join('')+'</div>';
}
/* week with hours — timed tasks and calendar events as duration blocks */
function renderWeekGrid(start,byDate,gByDate,today){
  const days=[...Array(7)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
  /* the day runs 7am–9pm unless something real happens outside it — no acres of empty night */
  let S_MIN=7*60, E_MIN=21*60; const PPH=48;
  days.forEach(d=>{
    const k=dstr(d);
    [...(byDate[k]||[]).filter(t=>t.start&&!t.done),...(gByDate[k]||[]).filter(e=>e.start)].forEach(it=>{
      const s=hmToMin(it.start), en=hmToMin(endOf(it)||it.start)||s+60;
      S_MIN=Math.min(S_MIN,Math.floor(s/60)*60);
      E_MIN=Math.max(E_MIN,Math.ceil(en/60)*60);
    });
  });
  const heads=days.map(d=>{
    const k=dstr(d);
    const ts=(byDate[k]||[]).filter(t=>!t.start&&!t.done), gs=(gByDate[k]||[]).filter(e=>!e.start);
    return `<div class="wk-day-head ${k===today?'wk-today':''}">
      <div class="wk-dn">${d.toLocaleDateString('en-US',{weekday:'short'})} <b>${d.getDate()}</b>
        <button class="cal-addbtn" onclick="calAddPop(event,'${k}')" title="Add a task on this day">+</button></div>
      <div class="wk-allday">
        ${ts.map(t=>{const b=board(t.boardId);
          return `<div class="cal-ev ${t.done?'done':''}" onclick="openDrawer('${t.id}')">
            <span class="dot" style="background:${b?b.accent:'#999'}"></span>
            ${t.urgent?'<span class="cal-urg">!</span>':''}
            <span class="cal-ev-t">${esc(t.title)}</span></div>`;}).join('')}
        ${gs.map(e=>`<div class="cal-ev gcal"><span class="gc-mark">G</span><span class="cal-ev-t">${esc(e.title)}</span></div>`).join('')}
      </div></div>`;
  }).join('');
  const gutter=[...Array((E_MIN-S_MIN)/60)].map((_,i)=>{
    const h=S_MIN/60+i;return `<div class="wk-hour">${h%12||12}${h<12?'am':'pm'}</div>`;}).join('');
  const n=new Date(), nowMin=n.getHours()*60+n.getMinutes();
  const cols=days.map(d=>{
    const k=dstr(d);
    const items=[
      ...(byDate[k]||[]).filter(t=>t.start&&!t.done).map(t=>({t})),
      ...(gByDate[k]||[]).filter(e=>e.start).map(e=>({e}))
    ];
    const blocks=items.map(x=>{
      const it=x.t||x.e;
      const s=Math.max(hmToMin(it.start),S_MIN);
      const en=Math.min(hmToMin(endOf(it)||it.start)||hmToMin(it.start)+60,E_MIN);
      const top=(s-S_MIN)/60*PPH, h=Math.max(24,(en-s)/60*PPH);
      if(x.t){
        const b=board(x.t.boardId);
        return `<div class="wk-ev ${x.t.done?'done':''}" style="top:${top}px;height:${h}px;--acc:${b?b.accent:'#999'}"
          onclick="openDrawer('${x.t.id}')">
          <span class="wk-ev-time">${fmtSlot(x.t)}</span><span class="wk-ev-t">${x.t.urgent?'<span class="cal-urg">! </span>':''}${esc(x.t.title)}</span></div>`;
      }
      return `<div class="wk-ev gcal" style="top:${top}px;height:${h}px" title="From Google Calendar">

  }).join('');
  return `<div class="wk">

}
/* ---------- Today — the landing page: your day on one quiet sheet ---------- */
function renderToday(){
  const today=todayStr();
  const now=new Date();
  const tmr=(()=>{const d=new Date();d.setDate(d.getDate()+1);return dstr(d);})();
  /* same lenses the calendar uses */
  const byDate={};
  S.tasks.forEach(t=>{if(t.due)(byDate[t.due]=byDate[t.due]||[]).push(t);});
  Object.values(byDate).forEach(a=>a.sort((x,z)=>{
    const xs=x.start||'99:99', zs=z.start||'99:99';
    if(xs!==zs)return xs<zs?-1:1;
    return (z.urgent?1:0)-(x.urgent?1:0);}));
  const gByDate={};
  const syncedIds=new Set(S.tasks.filter(t=>t.gcalId).map(t=>t.gcalId));
  (S.gcal||[]).forEach(e=>{if(e.date&&!syncedIds.has(e.id))(gByDate[e.date]=gByDate[e.date]||[]).push(e);});
  Object.values(gByDate).forEach(a=>a.sort((x,z)=>(x.start||'99')<(z.start||'99')?-1:1));

  const open=S.tasks.filter(t=>!t.done&&!isRoutine(t)&&!isAppt(t)&&!isShelved(t));
  const dueToday=(byDate[today]||[]).filter(t=>!t.done);
  const appts=dueToday.filter(isAppt).length+((gByDate[today]||[]).length);
  const overdue=open.filter(t=>t.due&&t.due<today&&!isWaiting(t)).sort((a,b)=>a.due<b.due?-1:1);
  const doNowCol=S.priCols.find(c=>/\bnow\b/i.test(c.name));
  const front=byUrgent(open.filter(t=>(t.urgent||(doNowCol&&t.priCol===doNowCol.id))&&t.due!==today&&!isWaiting(t)&&priEligible(t))).slice(0,8);
  const struck=S.tasks.filter(t=>t.done&&!isRoutine(t)&&t.completedAt&&dstr(new Date(t.completedAt))===today)
    .sort((a,b)=>b.completedAt-a.completedAt);
  const tmrN=((byDate[tmr]||[]).filter(t=>!t.done).length)+((gByDate[tmr]||[]).length);

  const bAcc=t=>{const b=board(t.boardId);return b?b.accent:'#999';};
  const bName=t=>{const b=board(t.boardId);return b?b.name:'';};
  const row=(t,btns)=>`<div class="cl-row">
    <span class="dot" style="background:${bAcc(t)}"></span>
    <span class="cl-row-t" onclick="openDrawer('${t.id}')">${esc(t.title)}</span>
    <span class="b-tag">${esc(bName(t))}</span>
    ${whenChip(t)}
    <span class="cl-row-btns">${btns}</span>
  </div>`;
  const btn=(label,fn)=>`<button class="cl-btn" onclick="${fn}">${label}</button>`;

  const pulse=(()=>{
    const bits=[];
    if(appts)bits.push(appts+' to show up for');
    const chores=dueToday.filter(t=>!isAppt(t)).length;
    if(chores)bits.push(chores+' due');
    if(overdue.length)bits.push(overdue.length+' slipped');
    if(struck.length)bits.push(struck.length+' already struck');
    return bits.length?bits.join(' · '):'nothing asked of today — it\u2019s yours';
  })();

  return `<div class="view-head">
      <div class="view-title">Today</div>
      <div class="view-sub">${now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} — ${pulse}</div>
    </div>
    ${practicesStrip()}
    ${renderWeekAgenda(now,byDate,gByDate,today,1)}
    ${overdue.length?`
      <div class="list-group-name" style="cursor:default;margin-top:28px">Slipped</div>
      <div class="cl-sub">carried from days past — finish, or give an honest new date</div>
      ${overdue.slice(0,8).map(t=>row(t,btn('Today',`clToday('${t.id}')`)+btn('Done \u2713',`toggleDone('${t.id}')`))).join('')}`:''}
    ${front.length?`
      <div class="list-group-name" style="cursor:default;margin-top:28px">The front of the queue</div>
      <div class="cl-sub">urgent or marked for now — the day\u2019s discretionary hours go here</div>
      ${front.map(t=>row(t,btn('Today',`clToday('${t.id}')`)+btn('Done \u2713',`toggleDone('${t.id}')`))).join('')}`:''}
    ${struck.length?`
      <div class="list-group-name" style="cursor:default;margin-top:28px">Struck today</div>
      ${struck.slice(0,8).map(t=>`<div class="cl-row"><span class="dot" style="background:${bAcc(t)}"></span>
        <span class="cl-row-t" style="text-decoration:line-through;color:var(--ink-faint)" onclick="openDrawer('${t.id}')">${esc(t.title)}</span>
        <span class="b-tag">${esc(bName(t))}</span></div>`).join('')}`:''}
    <div class="cl-sub" style="margin-top:30px">${tmrN?'tomorrow holds '+tmrN+' \u2014 it can wait':'tomorrow is clear'}</div>`;
}

function calShift(n){
  const d=new Date(calCur.y,calCur.m,calCur.d);

  else d.setMonth(d.getMonth()+n,1);
  calCur={y:d.getFullYear(),m:d.getMonth(),d:d.getDate()};render();
}

function renderPriorities(){
  /* triage is for live work only: no appointments, no shelved horizons, no opted-out boards */
  const open=S.tasks.filter(t=>!t.done&&!isRoutine(t)&&!isAppt(t)&&!isShelved(t)&&priEligible(t));
  const valid=id=>S.priCols.some(c=>c.id===id);
  const horizon=S.priCols.find(c=>/horizon|later|someday|eventual/i.test(c.name));
  const wk=new Date();wk.setDate(wk.getDate()+7);
  const wkS=wk.getFullYear()+'-'+String(wk.getMonth()+1).padStart(2,'0')+'-'+String(wk.getDate()).padStart(2,'0');
  const unassigned=t=>!t.priCol||!valid(t.priCol);
  const doNow=S.priCols.find(c=>/\bnow\b/i.test(c.name))||S.priCols[0];
  const autoHor=t=>!!horizon&&unassigned(t)&&(isWaiting(t)||(!t.urgent&&(!t.due||t.due>wkS)));
  const autoNow=t=>!!doNow&&unassigned(t)&&t.urgent&&!isWaiting(t);
  const unsorted=byUrgent(open.filter(t=>unassigned(t)&&!autoHor(t)&&!autoNow(t)));

  const cols=S.priCols.map(c=>{

  }).join('');
  return `<div class="view-head">
      <div class="view-title">Priorities</div>
      <div class="view-sub">every task you can act on — urgent jumps to Do now!, undated or far out drifts to Later; anything shelved on a board stays out</div>
      <div class="spacer"></div>
      <button class="btn-ghost" onclick="priAdd()">+ Column</button>
    </div>
    ${apptStrip(7,'Commitments')}
    ${rhythmStrip()}
    ${practicesStrip()}
    <div class="cols">${un}${cols}</div>`;

function dropPri(ev,colId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(drag&&drag.type==='pricol'){reorderCols(S.priCols,drag.id,colId);drag=null;render();return;}
  if(!drag||drag.type!=='task')return;
  const t=S.tasks.find(x=>x.id===drag.id); if(!t)return;
  t.priCol=colId||null;
  touch(t);
  const overCard=ev.target.closest('.tcard');
  S.tasks=S.tasks.filter(x=>x.id!==t.id);
  if(overCard&&overCard.dataset.tid!==t.id){
    const i=S.tasks.findIndex(x=>x.id===overCard.dataset.tid);
    S.tasks.splice(i,0,t);
  }else S.tasks.push(t);
  drag=null;render();
}
function priAdd(){

function priRename(id,v){const c=S.priCols.find(c=>c.id===id);if(c&&v.trim())c.name=v.trim();save();}
function priDel(id){

/* ============ the laurels (achievements) ============ */
function renderAch(){
  const pad=n=>String(n).padStart(2,'0');
  const ymd=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
  const today=todayStr();
  const yest=(()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d.getTime());})();
  const wkAgo=Date.now()-7*864e5, moAgo=Date.now()-30*864e5;
  const done=S.tasks.filter(t=>t.done&&!isAppt(t))
    .map(t=>({t,at:t.completedAt||t.createdAt||0}))
    .sort((a,b)=>b.at-a.at);
  const planDone=S.plan.flatMap(e=>e.items.filter(i=>i.done).map(i=>({text:i.text,era:e.era})));
  const nToday=done.filter(x=>x.at&&ymd(x.at)===today).length;
  const nWeek=done.filter(x=>x.at>=wkAgo).length;
  const nMonth=done.filter(x=>x.at>=moAgo).length;
  const total=done.length+planDone.length;
  /* hero line */
  let hero;
  if(total===0)hero='Nothing here yet — and that’s fine. The first checkmark is the hardest one. Go get it.';
  else if(nToday>=5)hero=nToday+' finished today. Unstoppable is a word for days like this.';
  else if(nToday>=1)hero=nToday+(nToday===1?' thing':' things')+' done today — momentum looks good on you.';
  else if(nWeek>=1)hero=nWeek+' this week. The record keeps growing.';
  else hero='The record stands at '+total+'. It only ever goes up.';
  /* milestones */
  const MS=[[1,'First stroke'],[5,'Warming up'],[10,'Ten strong'],[25,'Twenty-five deep'],
            [50,'Half a hundred'],[100,'The hundred club'],[250,'Force of nature']];
  const badges=MS.map(([n,name])=>{
    if(total>=n)return `<span class="badge"><span class="st">✦</span>${name}<span class="muted small">${n}</span></span>`;
    return '';
  }).join('');
  const next=MS.find(([n])=>total<n);
  const nextBadge=next?`<span class="badge locked"><span class="st">✧</span>${next[1]}<span class="muted small">${next[0]-total} to go</span></span>`:'';
  /* stats */
  const stats=`<div class="ach-stats">
    ${[[nToday,'today'],[nWeek,'this week'],[nMonth,'this month'],[total,'all time']].map(([n,l])=>
      `<div class="ach-stat"><div class="ach-n h-serif">${n}</div><div class="d-label" style="margin:0">${l}</div></div>`).join('')}
  </div>`;
  /* intentions realized */
  /* ── the record, counted ─────────────────────────────── */
  const wk=Date.now()-7*864e5, mo=Date.now()-30*864e5;
  const kept=done.filter(x=>isAppt(x.t)), fin=done.filter(x=>!isAppt(x.t));
  const byBoard={};
  fin.forEach(x=>{const b=board(x.t.boardId)||(x.t.boardName?{id:'gone-'+x.t.boardName,name:x.t.boardName,accent:'#9a938a'}:null);if(!b)return;
    (byBoard[b.id]=byBoard[b.id]||{b,n:0,recent:0}).n++;
    if(x.at>=mo)byBoard[b.id].recent++;});
  const ranked=Object.values(byBoard).sort((a,b)=>b.n-a.n);
  const totalFin=fin.length;
  /* streak of consecutive days with something finished */
  const dayset=new Set(done.filter(x=>x.at).map(x=>ymd(x.at)));
  let streak=0; {const d=new Date();
    if(!dayset.has(ymd(d.getTime())))d.setDate(d.getDate()-1);
    while(dayset.has(ymd(d.getTime()))){streak++;d.setDate(d.getDate()-1);}}
  /* busiest weekday */
  const dow=[0,0,0,0,0,0,0];
  done.forEach(x=>{if(x.at)dow[new Date(x.at).getDay()]++;});
  const bestDow=dow.indexOf(Math.max(...dow));
  const DOWN=['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
  /* donut — top five domains, the rest gathered, so the eye can actually compare */
  const TOP=5;
  const slices=ranked.slice(0,TOP).map(r=>({label:r.b.name,n:r.n,color:r.b.accent}));
  const restN=ranked.slice(TOP).reduce((s,r)=>s+r.n,0);
  if(restN)slices.push({label:'Everything else',n:restN,color:'#b9b0a0'});
  const C=2*Math.PI*54;
  let acc=0;
  const arcs=slices.map(s=>{
    const len=totalFin?C*s.n/totalFin:0;
    const el=`<circle class="donut-arc" cx="70" cy="70" r="54" fill="none" stroke="${s.color}"
      stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
      stroke-dashoffset="${(-acc).toFixed(2)}"><title>${esc(s.label)}: ${s.n}</title></circle>`;
    acc+=len; return el;
  }).join('');
  const legend=slices.map(s=>`<div class="lg-row">
    <span class="lg-dot" style="background:${s.color}"></span>
    <span class="lg-name">${esc(s.label)}</span>
    <span class="lg-n">${s.n}</span>
    <span class="lg-pct">${totalFin?Math.round(100*s.n/totalFin):0}%</span>
  </div>`).join('');
  const maxN=ranked.length?ranked[0].n:1;
  const bars=ranked.map(r=>`<div class="bar-row">
    <span class="bar-name">${esc(r.b.name)}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${Math.round(100*r.n/maxN)}%;background:${r.b.accent}"></span></span>
    <span class="bar-n">${r.n}</span>
  </div>`).join('');
  /* last twelve weeks of finishing */
  const weeks=[...Array(12)].map((_,i)=>{
    const end=Date.now()-i*7*864e5, start=end-7*864e5;

        <div class="ms"><span class="ms-n">${S.goals.filter(g=>g.rewardClaimed).length+(S.rewards||[]).filter(r=>r.claimed).length}</span><span class="ms-l">rewards claimed</span></div>
      </div>

/* ============ the tray — drop a file anywhere, Claude turns it into tasks ============ */
const IMPORT_API='https://atelier-mcp.vercel.app/api/import';
let dzDepth=0;
window.addEventListener('dragenter',e=>{
  if(!e.dataTransfer||![].slice.call(e.dataTransfer.types||[]).includes('Files'))return;
  dzDepth++;const d=$('dropzone');if(d)d.classList.add('show');
});
window.addEventListener('dragleave',()=>{
  dzDepth=Math.max(0,dzDepth-1);
  if(!dzDepth){const d=$('dropzone');if(d)d.classList.remove('show');}
});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',async e=>{
  e.preventDefault();dzDepth=0;const d=$('dropzone');if(d)d.classList.remove('show');
  const files=[].slice.call((e.dataTransfer&&e.dataTransfer.files)||[]);
  if(!files.length)return;
  if(!(SB.client&&SB.user)){alert('Sign in first — the tray lives in your account.');sbSignIn();return;}
  const {data:{session}}=await SB.client.auth.getSession();
  if(!session){sbSignIn();return;}
  let madeAppt=false;
  for(const f of files){
    /* a real calendar file needs no intelligence — it becomes an appointment right now */
    if(/\.ics$/i.test(f.name)||f.type==='text/calendar'){
      try{
        const evs=icsImport(await f.text());
        if(evs){madeAppt=true;continue;}
      }catch(e){}
    }
    if(f.size>4*1024*1024){alert(f.name+' is over 4MB — too big for the tray.');continue;}
    try{
      const r=await fetch(IMPORT_API,{method:'POST',headers:{
        'Authorization':'Bearer '+session.access_token,
        'Content-Type':f.type||'application/octet-stream',
        'X-Filename':encodeURIComponent(f.name)},body:f});
      const j=await r.json();
      if(!r.ok)throw new Error(j.error||('upload failed ('+r.status+')'));
      S.imports.push({id:uid(),name:j.name,path:j.path,type:j.type,size:j.size,addedAt:Date.now()});
    }catch(err){alert('Could not add '+f.name+' — '+(err.message||err));}
  }
  save();
  if(madeAppt&&!S.imports.length)go('cal');else go('claude');
});
/* .ics → appointments on the spot, no inference needed */
function icsImport(txt){
  const out=[];
  txt.replace(/\r\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1).forEach(b=>{
    const get=k=>{const m=b.match(new RegExp('\\n'+k+'[^:\\n]*:([^\\r\\n]*)'));
      return m?m[1].trim().replace(/\\,/g,',').replace(/\\n/gi,' · '):null;};
    const dt=v=>{if(!v)return null;const m=v.match(/(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d))?/);
      return m?{date:m[1]+'-'+m[2]+'-'+m[3],time:m[4]?m[4]+':'+m[5]:null}:null;};
    const s=dt(get('DTSTART')), e=dt(get('DTEND'));
    if(!s)return;
    const loc=get('LOCATION');
    const bid=store.get('atelier.addBoard');
    const brd=board(bid)||S.boards[0]; if(!brd)return;
    const col=brd.columns.find(c=>c.kind!=='routine'&&!/^shelved$/i.test(String(c.name).trim()))||brd.columns[0];
    S.tasks.push({id:uid(),boardId:brd.id,colId:col.id,title:get('SUMMARY')||'Event',
      note:loc?('At '+loc):'',due:s.date,start:s.time,end:(e&&e.time)||null,kind:'appt',
      done:false,goalId:null,createdAt:Date.now(),touchedAt:Date.now()});
    out.push(s.date);
  });
  return out.length;
}
async function trayRemove(id){
  const item=S.imports.find(i=>i.id===id);if(!item)return;
  tombstone(id);
  S.imports=S.imports.filter(i=>i.id!==id);save();render();
  try{
    const {data:{session}}=await SB.client.auth.getSession();
    if(session)fetch(IMPORT_API,{method:'DELETE',headers:{
      'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({path:item.path})});
  }catch(e){}
}

/* copy that works everywhere: the old synchronous way first, the modern API as backup */
function copyText(t){
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-200px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,t.length);
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok)return true;
  }catch(e){}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);return true;}}catch(e){}
  return false;
}
function clRitual(key,btn){askClaude(RITUALS[key],btn);}
/* the universal door: copy any prompt, open claude.ai, paste — from anywhere in the app */
function askClaude(text,btn){
  if(!text)return;
  if(!copyText(text)){prompt('Copy this, then paste it to Claude:',text);return;}
  if(btn){const s=btn.querySelector('.rit-sub');
    if(s)s.textContent='✓ copied — paste it to Claude (⌘V)';
    else btn.textContent='✓ copied — paste (⌘V)';}
  window.open('https://claude.ai/new','_blank');
  setTimeout(()=>render(),3600);
}

    :`Using my Atelier connector for context, help me with this task: ${ctx} (task id ${t.id}). Advise me, break it into smaller tasks on the board if that would help, or take parts of it on yourself.`;

function renderClaude(){
  const now=Date.now(), today=todayStr();
  const open=S.tasks.filter(t=>!t.done&&!isRoutine(t)&&!isAppt(t)&&!isShelved(t));
  const taskOf=id=>S.tasks.find(t=>t.id===id);
  const bAcc=t=>{const b=board(t.boardId);return b?b.accent:'#999';};
  const bName=t=>{const b=board(t.boardId);return b?b.name:'';};
  /* standing reviews — computed fresh every time */
  const row=(t,btns)=>`<div class="cl-row">
    <span class="dot" style="background:${bAcc(t)}"></span>
    <span class="cl-row-t" onclick="openDrawer('${t.id}')">${esc(t.title)}</span>
    <span class="b-tag">${esc(bName(t))}</span>
    ${whenChip(t)}
    <span class="cl-row-btns">${btns}</span>
  </div>`;
  const btn=(label,fn,danger)=>`<button class="cl-btn ${danger?'danger':''}" onclick="${fn}">${label}</button>`;
  const overdue=open.filter(t=>t.due&&t.due<today&&!isWaiting(t));
  const QW=/^(buy|call|book|send|schedule|check|email|text|ask|pay|order|register|renew|clean)\b/i;
  const wins=open.filter(t=>!t.due&&QW.test(t.title)&&!isWaiting(t)&&priEligible(t)).slice(0,7);
  const stale=open.filter(t=>!t.due&&!t.priCol&&!isWaiting(t)&&priEligible(t)&&Math.max(t.touchedAt||0,t.createdAt||0)<now-7*864e5).slice(0,10);
  const sec=(title,subtitle,items)=>items.length?`
    <div class="list-group-name" style="cursor:default;margin-top:30px">${title}</div>
    <div class="cl-sub">${subtitle}</div>
    ${items.join('')}`:'';
  /* what's coming at a fixed hour — nothing to do but show up */
  const tmr=(()=>{const d=new Date();d.setDate(d.getDate()+1);return dstr(d);})();
  const soon=S.tasks.filter(t=>!t.done&&isAppt(t)&&(t.due===today||t.due===tmr))
    .sort((a,b)=>(a.due+(a.start||'99'))<(b.due+(b.start||'99'))?-1:1);
  const comingHtml=soon.length?sec('Coming up','you can’t get these done early — just be there',
    soon.map(t=>{const b=board(t.boardId);
      const blk=t.blockFor?S.tasks.find(x=>x.id===t.blockFor):null;
      return `<div class="cl-row">
        <span class="dot" style="background:${b?b.accent:'#999'}"></span>
        <span class="cl-when">${t.due===today?'Today':'Tomorrow'}${t.start?' · '+fmtSlot(t):''}</span>
        <span class="cl-row-t" onclick="openDrawer('${t.id}')">${esc(t.title)}</span>
        ${blk?`<span class="b-tag">focus time</span>`:`<span class="b-tag">${esc(b?b.name:'')}</span>`}
      </div>`;}),''):'';
  /* the bearings, read the way the Compass actually works now */
  const objectives=S.goals.filter(g=>!g.parentId);
  const starRows=(S.stars||[]).map(s=>{
    const st=starStats(s.id);
    const at=st.atTarget;
    let verdict,cls;
    if(!st.goals.length){verdict='nothing points here yet — a star you never steer by is only scenery';cls='drift';}
    else{
      const measured=st.goals.filter(g=>goalKrs(g.id).length).length;
      verdict=st.goals.length+(st.goals.length>1?' objectives':' objective')
        +(st.eras.length?' · '+st.eras.join(' · '):'')
        +(at?' · '+at+' at target':measured?'':' · none measured yet');
      if(!measured)cls='drift';
    }
    return `<div class="cl-row">
      <span class="star-mark">✶</span>
      <input class="cl-star-in" value="${esc(s.title)}" onchange="star_rename('${s.id}',this.value)">
      <span class="cl-verdict ${cls||''}">${verdict}</span>
    </div>`;
  }).join('');
  /* the two honest gaps in an OKR compass: a goal with no bearing, and a goal with nothing measuring it */
  const loose=objectives.filter(g=>!g.starId);

let compassMode='stars';
const star=id=>(S.stars||[]).find(s=>s.id===id);
/* A star is a bearing, not a destination — so it reports heading, never progress. */
function starStats(sid){
  const gs=S.goals.filter(g=>!g.parentId&&g.starId===sid);
  const krs=gs.flatMap(g=>goalKrs(g.id));
  const items=S.plan.flatMap(e=>e.items.filter(i=>i.starId===sid).map(i=>({...i,era:e.era})));
  /* No clocks here. A bearing is not late — it is either steered toward or ignored. */
  const eras=[...new Set(gs.map(g=>g.era).filter(Boolean))]
    .map(id=>{const e=S.plan.find(x=>x.id===id);return e?e.era:null;}).filter(Boolean);
  const atTarget=gs.filter(g=>(goalPct(g.id)??0)>=TARGET_PCT).length;
  const drift=!gs.length;
  const heading=gs.length
    ? gs.length+(gs.length>1?' goals point here':' goal points here')
    : 'nothing points here yet';
  return {goals:gs,krs,tasks:[],live:krs.length,items,eras,atTarget,heading,drift};
}

/* a small inline field — never prompt(), which a home-screen web app silently swallows */
function textComposer(host,ph,cb){
  if(!host)return;
  const ex=host.querySelector('.ghost-new');
  if(ex){ex.focus();return;}
  const inp=document.createElement('input');
  inp.className='ghost-new'; inp.placeholder=ph;
  host.appendChild(inp);
  setTimeout(()=>inp.focus(),0);
  let closed=false;
  const commit=()=>{
    if(closed)return; closed=true;
    const v=inp.value.trim();
    if(v)cb(v);
    save();render();
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();commit();}
    if(e.key==='Escape'){closed=true;render();}
  });
  inp.addEventListener('blur',commit);
}

      m.style.cssText='position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0';
      document.body.appendChild(m);}
    const cs=getComputedStyle(el);
    m.style.fontFamily=cs.fontFamily;m.style.fontSize=cs.fontSize;
    m.style.fontWeight=cs.fontWeight;m.style.fontStyle=cs.fontStyle;m.style.letterSpacing=cs.letterSpacing;
    m.textContent=el.value||el.placeholder||'';

/* which domain a goal really lives in — inferred from where its tasks are */
function goalDept(g){
  const ids=[g.id,...S.goals.filter(s=>s.parentId===g.id).map(s=>s.id)];
  const c={};
  S.tasks.filter(t=>ids.includes(t.goalId)).forEach(t=>{c[t.boardId]=(c[t.boardId]||0)+1;});
  let best=null,n=0;
  Object.keys(c).forEach(k=>{if(c[k]>n){n=c[k];best=k;}});
  return best;
}
/* the bearings — always last, never decomposed */
function starsFooter(){

/* ================= the strategy map =================
   Mission → chapters → objectives, with key results folded inside their card.
   Columns are laid out absolutely; the cards inside them flow, so a long title
   never breaks the geometry. Edges are measured from the painted cards. */
let mapZoom=null, mapPan=null, mapDrag=null, mapNat=null;
const MAP_W=264, MAP_COLGAP=44, MAP_CHAP_Y=200;
function mapZoomBy(d){mapZoom=Math.max(.35,Math.min(1.6,+((mapZoom||1)+d).toFixed(2)));applyMap();}
function mapFit(){mapZoom=null;mapPan=null;mapNat=null;render();}
function applyMap(){
  const inner=document.querySelector('.map-inner');
  if(!inner||!mapPan)return;
  inner.style.transform=`translate(${mapPan.x}px,${mapPan.y}px) scale(${mapZoom||1})`;
  const z=document.querySelector('.map-zoom'); if(z)z.textContent=Math.round((mapZoom||1)*100)+'%';
}
function mapDown(ev){
  if(ev.target.closest('input,textarea,button,select,a'))return;
  const pt=ev.touches?ev.touches[0]:ev;
  mapDrag={x:pt.clientX,y:pt.clientY,ox:mapPan.x,oy:mapPan.y};
  document.addEventListener('mousemove',mapMove);
  document.addEventListener('mouseup',mapUp);
  document.addEventListener('touchmove',mapMove,{passive:false});
  document.addEventListener('touchend',mapUp);
  ev.preventDefault();
}
function mapMove(ev){
  if(!mapDrag)return;
  const pt=ev.touches?ev.touches[0]:ev;
  mapPan.x=mapDrag.ox+(pt.clientX-mapDrag.x);
  mapPan.y=mapDrag.oy+(pt.clientY-mapDrag.y);
  applyMap();
  if(ev.cancelable)ev.preventDefault();
}
function mapUp(){
  mapDrag=null;
  document.removeEventListener('mousemove',mapMove);
  document.removeEventListener('mouseup',mapUp);
  document.removeEventListener('touchmove',mapMove);
  document.removeEventListener('touchend',mapUp);
}
/* a key result as the map shows it: what it measures and how far along, nothing to type into */

  const pct=krPct(kr), l=kr.link?krLinkLabel(kr):(isMetric(kr)?(kr.current??0)+' / '+kr.target+(kr.unit?' '+kr.unit:''):'');

  return `<div class="mkr" style="${rl?krSeasonTint(kr):''}">
    <span class="mkr-tick ${pct>=100?'on':''}">${pct>=100?'◆':'◇'}</span>
    <span class="mkr-t">${esc(kr.title)}</span>

    <span class="mkr-bar"><span class="fill ${pct>=TARGET_PCT?'won':''}" style="width:${pct}%"></span>

function mapGoalCard(g){

const chapOpen=new Set();
function chap_expand(id){chapOpen.has(id)?chapOpen.delete(id):chapOpen.add(id);render();}
let mapFrom=null, mapTo=null;                 // indices into S.plan; null on both ends means all of it
function mapRange(which,v){
  const i=v===''?null:+v;
  if(which==='from'){mapFrom=i; if(mapTo!==null&&i!==null&&i>mapTo)mapTo=i;}
  else{mapTo=i; if(mapFrom!==null&&i!==null&&i<mapFrom)mapFrom=i;}
  mapZoom=null;mapPan=null;mapNat=null;render();
}
function mapRangeAll(){mapFrom=null;mapTo=null;mapZoom=null;mapPan=null;mapNat=null;render();}
function compassMap(){
  const a=mapFrom===null?0:mapFrom, b=mapTo===null?S.plan.length-1:mapTo;
  const ranged=mapFrom!==null||mapTo!==null;
  const chapters=S.plan.filter((e,i)=>i>=a&&i<=b)
    .map(e=>({id:e.id,label:e.era,goals:S.goals.filter(g=>!g.parentId&&g.era===e.id)}));
  const loose=S.goals.filter(g=>!g.parentId&&!g.era);
  if(loose.length&&!ranged)chapters.push({id:null,label:'Unscheduled',goals:loose});
  const totalW=Math.max(chapters.length,1)*(MAP_W+MAP_COLGAP)-MAP_COLGAP;
  const missionW=Math.min(420,Math.max(MAP_W,totalW*0.4));
  const missionX=Math.max(0,(totalW-missionW)/2);
  const edges=[];

  const cols=chapters.map((c,i)=>{
    const key=c.id||'none', open=chapOpen.has(key);
    edges.push(['mission','era-'+key]);
    if(open)c.goals.forEach(g=>edges.push(['era-'+key,g.id]));
    return `<div class="map-col" style="left:${i*(MAP_W+MAP_COLGAP)}px;top:${MAP_CHAP_Y}px;width:${MAP_W}px">
      <div class="mnode chapter${open?' open':''}" data-mid="era-${key}"
        onclick="chap_expand('${key}')" title="${open?'Fold':'Unfold'} this chapter">
        <span class="chap-mark">✦</span>
        <span class="chap-t${c.id?'':' none'}">${esc(c.label)}</span>
        <span class="col-count">${c.goals.length}</span>
      </div>
      ${open?`<div class="map-objs">${c.goals.map(mapGoalCard).join('')
        ||'<div class="mnode ghost quiet">nothing in this chapter</div>'}</div>`:''}
    </div>`;
  }).join('');

  if(!mapPan)mapPan={x:20,y:16,set:false};
  const anyOpen=chapOpen.size>0||S.goals.some(g=>!g.parentId&&goalOpen.has(g.id));
  const stars=(S.stars||[]).map(s=>{
    const st=starStats(s.id);
    return `<span class="map-star">
      <span class="star-mark">✶</span>
      <input class="map-star-in" value="${esc(s.title)}" onchange="star_rename('${s.id}',this.value)">
      <span class="star-heading ${st.drift?'drift':''}">${st.heading}</span>
    </span>`;
  }).join('');
  return `<div class="map-wrap">
    <div class="map-bar">
      <span class="map-range">
        <span class="mr-l">From</span>
        <select onchange="mapRange('from',this.value)">
          ${S.plan.map((e,i)=>`<option value="${i}" ${(mapFrom===null?0:mapFrom)===i?'selected':''}>${esc(e.era)}</option>`).join('')}
        </select>
        <span class="mr-l">to</span>
        <select onchange="mapRange('to',this.value)">
          ${S.plan.map((e,i)=>`<option value="${i}" ${(mapTo===null?S.plan.length-1:mapTo)===i?'selected':''}>${esc(e.era)}</option>`).join('')}
        </select>
        ${ranged?`<button class="cal-nb" onclick="mapRangeAll()">All</button>`:''}
      </span>
      <span class="spacer"></span>
      <button class="cal-nb" onclick="mapFoldAll(${anyOpen?'true':'false'})">${anyOpen?'Collapse all':'Expand all'}</button>
      <button class="cal-nb" onclick="mapZoomBy(-.12)">−</button>
      <span class="map-zoom">${Math.round((mapZoom||1)*100)}%</span>
      <button class="cal-nb" onclick="mapZoomBy(.12)">+</button>
      <button class="cal-nb" onclick="mapFit()" title="Fit to the frame">⤢</button>
    </div>
    <div class="map-canvas" onmousedown="mapDown(event)" ontouchstart="mapDown(event)">
      <div class="map-inner" data-edges="${esc(JSON.stringify(edges))}" data-total="${Math.round(totalW)}"
        style="transform:translate(${mapPan.x}px,${mapPan.y}px) scale(${mapZoom||1})">
        <svg class="map-edges" width="${Math.round(totalW+60)}" height="900"></svg>
        <div class="mnode mission" data-mid="mission"
          style="left:${missionX}px;top:0;width:${missionW}px">
          <div class="mn-kind">Mission</div>
          <div class="mn-t mission-t">${esc(S.meta.mission||'—')}</div>
        </div>
        ${cols}
      </div>
    </div>
    <div class="map-stars">
      <span class="stars-label" style="margin:0 10px 0 0">✶ North Stars</span>${stars||'<span class="small muted">none set</span>'}
      <span class="spacer"></span>
      <button class="add-inline" onclick="star_add(this.parentElement)">+ New north star</button>
    </div>
  </div>`;
}
function mapFoldAll(fold){
  S.goals.filter(g=>!g.parentId).forEach(g=>{fold?goalOpen.delete(g.id):goalOpen.add(g.id);});
  S.plan.forEach(e=>{fold?chapOpen.delete(e.id):chapOpen.add(e.id);});
  fold?chapOpen.delete('none'):chapOpen.add('none');
  mapZoom=null;mapPan=null;mapNat=null;      // refit, since the shape just changed a lot
  render();
}
/* edges are measured from the painted cards, so a long title never breaks the drawing */
function drawMapEdges(){
  const svg=document.querySelector('.map-edges');
  const inner=document.querySelector('.map-inner');
  if(!svg||!inner)return;
  let edges=[]; try{edges=JSON.parse(inner.getAttribute('data-edges')||'[]');}catch(e){return;}
  const canvas=document.querySelector('.map-canvas');
  /* first paint: measure the map unscaled, then shrink it until it fits the frame */
  if(canvas&&mapZoom===null){
    const prev=inner.style.transform;
    inner.style.transform='translate(0px,0px) scale(1)';
    const nb=inner.getBoundingClientRect();
    let nw=0,nh=0;
    inner.querySelectorAll('.mnode').forEach(el=>{const r=el.getBoundingClientRect();
      nw=Math.max(nw,r.right-nb.left); nh=Math.max(nh,r.bottom-nb.top);});
    inner.style.transform=prev;
    mapNat={w:nw,h:nh};
    mapZoom=Math.max(.3,Math.min(1,
      Math.min((canvas.clientWidth-44)/(nw+24),(canvas.clientHeight-44)/(nh+24))));
  }
  applyMap();
  const z=mapZoom||1;
  const box=inner.getBoundingClientRect();
  const rect=id=>{
    const el=inner.querySelector(`[data-mid="${CSS.escape(id)}"]`);
    if(!el)return null;
    const r=el.getBoundingClientRect();
    return {x:(r.left-box.left)/z, y:(r.top-box.top)/z, w:r.width/z, h:r.height/z};
  };
  svg.innerHTML=edges.map(([a,b])=>{
    const ra=rect(a), rb=rect(b);
    if(!ra||!rb)return '';
    const x1=ra.x+ra.w/2, y1=ra.y+ra.h, x2=rb.x+rb.w/2, y2=rb.y;
    const d=Math.max(24,(y2-y1)/2);
    return `<path d="M${x1},${y1} C${x1},${y1+d} ${x2},${y2-d} ${x2},${y2}" fill="none"/>`;
  }).join('');
  let maxB=0,maxR=0;
  inner.querySelectorAll('.mnode').forEach(el=>{
    const r=el.getBoundingClientRect();
    maxB=Math.max(maxB,(r.bottom-box.top)/z);
    maxR=Math.max(maxR,(r.right-box.left)/z);
  });
  svg.setAttribute('height',Math.ceil(maxB+40));
  svg.setAttribute('width',Math.ceil(maxR+40));
  if(mapPan&&!mapPan.set&&canvas){
    const w=(mapNat&&mapNat.w)||maxR;
    mapPan.x=Math.max(14,(canvas.clientWidth-w*z)/2);
    mapPan.y=16; mapPan.set=true;
    applyMap();
  }
}
function star_add(host){

/* ============ life plan ============ */

function planFind(id){for(const e of S.plan){const it=e.items.find(i=>i.id===id);if(it)return{era:e,it};}return null;}
function era_add(host){

function era_rename(id,v){const e=S.plan.find(e=>e.id===id);if(e&&v.trim())e.era=v.trim();save();}
function era_del(id){
  const e=S.plan.find(e=>e.id===id);
  if(e.items.length&&!confirm('Delete this chapter and its '+e.items.length+' intention(s)?'))return;
  tombstone.apply(null,[id].concat((e.items||[]).map(i=>i.id)));
  S.goals.forEach(g=>{if(g.era===id)g.era=undefined;});   // its goals fall back to unscheduled, not into the void
  S.plan=S.plan.filter(x=>x.id!==id);render();
}
function p_add(eraId){
  const t=prompt('What do you intend for this chapter?');
  if(!t||!t.trim())return;
  S.plan.find(e=>e.id===eraId).items.push({id:uid(),text:t.trim(),done:false});render();
}
function p_edit(id,v){const f=planFind(id);if(f&&v.trim())f.it.text=v.trim();save();}
function p_toggle(id){const f=planFind(id);f.it.done=!f.it.done;render();}
