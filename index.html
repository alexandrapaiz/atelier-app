/* ================= the strategy map =================
   Mission → chapters → objectives, with key results folded inside their card.
   Columns are laid out absolutely; the cards inside them flow, so a long title
   never breaks the geometry. Edges are measured from the painted cards. */
let mapZoom=null, mapPan=null, mapDrag=null, mapNat=null;
const MAP_W=264, MAP_COLGAP=44, MAP_CHAP_Y=200;
function mapZoomBy(d){mapZoom=Math.max(.35,Math.min(1.6,+((mapZoom||1)+d).toFixed(2)));applyMap();}
function mapFit(){mapZoom=null;mapPan=null;mapNat=null;render();}
function applyMap(){
  const inner=document.querySelector('.map-inner');
  if(!inner||!mapPan)return;
  inner.style.transform=`translate(${mapPan.x}px,${mapPan.y}px) scale(${mapZoom||1})`;
  const z=document.querySelector('.map-zoom'); if(z)z.textContent=Math.round((mapZoom||1)*100)+'%';
}
function mapDown(ev){
  if(ev.target.closest('input,textarea,button,select,a'))return;
  const pt=ev.touches?ev.touches[0]:ev;
  mapDrag={x:pt.clientX,y:pt.clientY,ox:mapPan.x,oy:mapPan.y};
  document.addEventListener('mousemove',mapMove);
  document.addEventListener('mouseup',mapUp);
  document.addEventListener('touchmove',mapMove,{passive:false});
  document.addEventListener('touchend',mapUp);
  ev.preventDefault();
}
function mapMove(ev){
  if(!mapDrag)return;
  const pt=ev.touches?ev.touches[0]:ev;
  mapPan.x=mapDrag.ox+(pt.clientX-mapDrag.x);
  mapPan.y=mapDrag.oy+(pt.clientY-mapDrag.y);
  applyMap();
  if(ev.cancelable)ev.preventDefault();
}
function mapUp(){
  mapDrag=null;
  document.removeEventListener('mousemove',mapMove);
  document.removeEventListener('mouseup',mapUp);
  document.removeEventListener('touchmove',mapMove);
  document.removeEventListener('touchend',mapUp);
}
function mapGoalCard(g){
  const krs=goalKrs(g.id), p=goalPct(g.id);
  const open=goalOpen.has(g.id);
  return `<div class="mnode goal${g.achieved?' achieved':''}" data-mid="${g.id}">

        onclick="g_expand('${g.id}')">${open?'▾':'▸'}</button>

      <span class="mn-kind">Objective</span>

      onchange="g_rename('${g.id}',this.value)">${esc(g.title)}</textarea>

      <span class="mn-pct ${(p??0)>=TARGET_PCT?'won':''}">${p===null?'—':p+'%'}</span>

        <span class="mn-fold">${open?'▾':'▸'}</span> ${krs.length?krs.length+' key result'+(krs.length>1?'s':''):'no key results'}</button>

    </div>
    ${open?`<div class="mn-krs">
      ${krs.map(krRow).join('')}

    </div>`:''}
  </div>`;
}
const chapOpen=new Set();
function chap_expand(id){chapOpen.has(id)?chapOpen.delete(id):chapOpen.add(id);render();}
function compassMap(){
  const chapters=S.plan.map(e=>({id:e.id,label:e.era,goals:S.goals.filter(g=>!g.parentId&&g.era===e.id)}));
  const loose=S.goals.filter(g=>!g.parentId&&!g.era);
  if(loose.length)chapters.push({id:null,label:'Unscheduled',goals:loose});
  const totalW=Math.max(chapters.length,1)*(MAP_W+MAP_COLGAP)-MAP_COLGAP;
  const missionW=Math.min(420,Math.max(MAP_W,totalW*0.4));
  const missionX=Math.max(0,(totalW-missionW)/2);
  const edges=[];

  const cols=chapters.map((c,i)=>{
    const key=c.id||'none', open=chapOpen.has(key);
    edges.push(['mission','era-'+key]);
    if(open)c.goals.forEach(g=>edges.push(['era-'+key,g.id]));
    return `<div class="map-col" style="left:${i*(MAP_W+MAP_COLGAP)}px;top:${MAP_CHAP_Y}px;width:${MAP_W}px">
      <div class="mnode chapter" data-mid="era-${key}">
        <button class="mn-fold-btn" title="${open?'Fold this chapter':'Unfold this chapter'}"
          onclick="chap_expand('${key}')">${open?'▾':'▸'}</button>
        <span class="chap-mark">✦</span>
        ${c.id?`<textarea class="chap-t grow" rows="1" oninput="fitTA(this)" onkeydown="${TA_KEYS}"
          onchange="era_rename('${c.id}',this.value)">${esc(c.label)}</textarea>`
          :`<span class="chap-t none">${esc(c.label)}</span>`}
        <span class="col-count">${c.goals.length}</span>
      </div>
      ${open?`<div class="map-objs">
        ${c.goals.map(mapGoalCard).join('')}
        ${c.id?`<div class="mnode ghost"><button class="add-inline"
          onclick="g_addIn('${c.id}',this.parentElement)">+ Objective</button></div>`:''}
      </div>`:''}
    </div>`;
  }).join('');

  if(!mapPan)mapPan={x:20,y:16,set:false};
  const anyOpen=chapOpen.size>0||S.goals.some(g=>!g.parentId&&goalOpen.has(g.id));
  const stars=(S.stars||[]).map(s=>{
    const st=starStats(s.id);
    return `<span class="map-star">
      <span class="star-mark">✶</span>
      <input class="map-star-in" value="${esc(s.title)}" onchange="star_rename('${s.id}',this.value)">
      <span class="star-heading ${st.drift?'drift':''}">${st.heading}</span>
    </span>`;
  }).join('');
  return `<div class="map-wrap">
    <div class="map-bar">
      <span class="map-hint">drag to pan</span>
      <span class="spacer"></span>
      <button class="cal-nb" onclick="mapFoldAll(${anyOpen?'true':'false'})">${anyOpen?'Collapse all':'Expand all'}</button>
      <button class="cal-nb" onclick="mapZoomBy(-.12)">−</button>
      <span class="map-zoom">${Math.round((mapZoom||1)*100)}%</span>
      <button class="cal-nb" onclick="mapZoomBy(.12)">+</button>
      <button class="cal-nb" onclick="mapFit()" title="Fit to the frame">⤢</button>
    </div>
    <div class="map-canvas" onmousedown="mapDown(event)" ontouchstart="mapDown(event)">
      <div class="map-inner" data-edges="${esc(JSON.stringify(edges))}" data-total="${Math.round(totalW)}"
        style="transform:translate(${mapPan.x}px,${mapPan.y}px) scale(${mapZoom||1})">
        <svg class="map-edges" width="${Math.round(totalW+60)}" height="900"></svg>
        <div class="mnode mission" data-mid="mission"
          style="left:${missionX}px;top:0;width:${missionW}px">
          <div class="mn-kind">Mission</div>
          <textarea class="mn-t mission-t grow" rows="2" oninput="fitTA(this)"
            onchange="S.meta.mission=this.value;save()"
            placeholder="the one sentence everything below is in service of…">${esc(S.meta.mission||'')}</textarea>
        </div>
        ${cols}
      </div>
    </div>
    <div class="map-stars">
      <span class="stars-label" style="margin:0 10px 0 0">✶ North Stars</span>${stars||'<span class="small muted">none set</span>'}
      <span class="spacer"></span>
      <button class="add-inline" onclick="star_add(this.parentElement)">+ New north star</button>
    </div>
  </div>`;
}
function mapFoldAll(fold){
  S.goals.filter(g=>!g.parentId).forEach(g=>{fold?goalOpen.delete(g.id):goalOpen.add(g.id);});
  S.plan.forEach(e=>{fold?chapOpen.delete(e.id):chapOpen.add(e.id);});
  fold?chapOpen.delete('none'):chapOpen.add('none');
  mapZoom=null;mapPan=null;mapNat=null;      // refit, since the shape just changed a lot
  render();
}
/* edges are measured from the painted cards, so a long title never breaks the drawing */
function drawMapEdges(){
  const svg=document.querySelector('.map-edges');
  const inner=document.querySelector('.map-inner');
  if(!svg||!inner)return;
  let edges=[]; try{edges=JSON.parse(inner.getAttribute('data-edges')||'[]');}catch(e){return;}
  const canvas=document.querySelector('.map-canvas');
  /* first paint: measure the map unscaled, then shrink it until it fits the frame */
  if(canvas&&mapZoom===null){
    const prev=inner.style.transform;
    inner.style.transform='translate(0px,0px) scale(1)';
    const nb=inner.getBoundingClientRect();
    let nw=0,nh=0;
    inner.querySelectorAll('.mnode').forEach(el=>{const r=el.getBoundingClientRect();
      nw=Math.max(nw,r.right-nb.left); nh=Math.max(nh,r.bottom-nb.top);});
    inner.style.transform=prev;
    mapNat={w:nw,h:nh};
    mapZoom=Math.max(.3,Math.min(1,
      Math.min((canvas.clientWidth-44)/(nw+24),(canvas.clientHeight-44)/(nh+24))));
  }
  applyMap();
  const z=mapZoom||1;
  const box=inner.getBoundingClientRect();
  const rect=id=>{
    const el=inner.querySelector(`[data-mid="${CSS.escape(id)}"]`);
    if(!el)return null;
    const r=el.getBoundingClientRect();
    return {x:(r.left-box.left)/z, y:(r.top-box.top)/z, w:r.width/z, h:r.height/z};
  };
  svg.innerHTML=edges.map(([a,b])=>{
    const ra=rect(a), rb=rect(b);
    if(!ra||!rb)return '';
    const x1=ra.x+ra.w/2, y1=ra.y+ra.h, x2=rb.x+rb.w/2, y2=rb.y;
    const d=Math.max(24,(y2-y1)/2);
    return `<path d="M${x1},${y1} C${x1},${y1+d} ${x2},${y2-d} ${x2},${y2}" fill="none"/>`;
  }).join('');
  let maxB=0,maxR=0;
  inner.querySelectorAll('.mnode').forEach(el=>{
    const r=el.getBoundingClientRect();
    maxB=Math.max(maxB,(r.bottom-box.top)/z);
    maxR=Math.max(maxR,(r.right-box.left)/z);
  });
  svg.setAttribute('height',Math.ceil(maxB+40));
  svg.setAttribute('width',Math.ceil(maxR+40));
  if(mapPan&&!mapPan.set&&canvas){
    const w=(mapNat&&mapNat.w)||maxR;
    mapPan.x=Math.max(14,(canvas.clientWidth-w*z)/2);
    mapPan.y=16; mapPan.set=true;
    applyMap();
  }
}
function star_add(host){
  const make=v=>S.stars.push({id:uid(),title:v,note:'',createdAt:Date.now()});
  if(host&&host.nodeType===1)textComposer(host,'A bearing you steer by…',make);
  else{make('New north star');save();render();}
}
function star_rename(id,v){const s=star(id);if(s&&v.trim())s.title=v.trim();save();}
function star_del(id){
  if(!confirm('Remove this north star? Goals and intentions stay — they just become unanchored.'))return;
  S.goals.forEach(g=>{if(g.starId===id)g.starId=null;});
  S.plan.forEach(e=>e.items.forEach(i=>{if(i.starId===id)i.starId=null;}));
  tombstone(id);

      <div class="plan-item ${it.done?'done-card':''} ${ns?'ns-item':''}" draggable="true" data-pid="${it.id}"

      <button class="btn-ghost" onclick="era_add()">+ Chapter</button>
    </div>
    <div class="plan">${eras||'<div class="empty-note">Add a chapter — a month, a season, a year, a someday.</div>'}</div>`;
}

/* Save on every keystroke: any text field with an onchange handler also
   commits on input, so nothing is lost if the tab closes mid-edit. */
document.addEventListener('input',e=>{
  const el=e.target;
  if(!(el instanceof HTMLElement))return;
  if(el.classList.contains('ghost-new'))return;        // quick-add commits on Enter/blur only
  if(el.matches('input[type=date],input[type=time],input[type=range],select'))return; // these fire change natively / handle input themselves
  if(el.getAttribute('onchange'))el.dispatchEvent(new Event('change'));
});
function themeApply(t){
  if(t==='dark')document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  const btn=$('themeBtn'); if(btn)btn.textContent=t==='dark'?'☼':'☾';   // ☼ stays a glyph, never an emoji
  const mc=document.getElementById('themeColor'); if(mc)mc.setAttribute('content',t==='dark'?'#181613':'#faf8f3');
}

  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  const next=cur==='dark'?'light':'dark';

/* ============ shared data file ============
   Mirrors all data into a real .json file on disk (in addition to browser
   storage), so Claude — or any other tool — can read and edit the same
   data. On open, whichever copy is newer wins. Chrome/Edge/Arc only. */
const FS_OK='showSaveFilePicker' in window;
let fileHandle=null, pendingHandle=null, wTimer=null;
function idbOpen(){return new Promise((res,rej)=>{
  const r=indexedDB.open('atelier-fs',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idbOpen();return new Promise((res,rej)=>{
  const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);
  tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{
  const rq=db.transaction('kv').objectStore('kv').get(k);
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function linkDataFile(){
  try{
    fileHandle=await showSaveFilePicker({suggestedName:'atelier-data.json',
      types:[{description:'Atelier data',accept:{'application/json':['.json']}}]});
    await idbSet('handle',fileHandle);
    await adoptNewer(); updateFileStatus();
  }catch(e){/* user cancelled */}
}
async function reconnectFile(){
  if(!pendingHandle)return;
  try{
    if(await pendingHandle.requestPermission({mode:'readwrite'})!=='granted')return;
    fileHandle=pendingHandle; pendingHandle=null;
    await adoptNewer(); updateFileStatus();
  }catch(e){}
}
/* Merge, never clobber: entities that exist on only one side are kept;
   for entities on both sides, the side with the newer overall stamp wins. */
function mergeStates(loc,rem){
  if(!rem||!rem.meta)return loc;
  const preferRem=(rem.meta.updatedAt||0)>(loc.meta.updatedAt||0);
  /* graves first — every side's deletions, newest wins, before anything is let back in */
  loc.meta.tomb=loc.meta.tomb||{};
  if(rem.meta.tomb)Object.keys(rem.meta.tomb).forEach(k=>{
    if(!loc.meta.tomb[k]||rem.meta.tomb[k]>loc.meta.tomb[k])loc.meta.tomb[k]=rem.meta.tomb[k];
  });
  const tomb=loc.meta.tomb;
  const buried=x=>!!(x&&x.id&&tomb[x.id]);
  const merge=(la,ra)=>{
    if(!la||!ra)return la||ra||[];
    const m=new Map(la.map((x,i)=>[x.id,i]));
    ra.forEach(x=>{
      if(buried(x))return;                       // it was deleted on purpose; don't resurrect it
      if(!m.has(x.id))la.push(x);
      else if(preferRem)la[m.get(x.id)]=x;
    });
    return la;
  };
  merge(loc.masterColumns,rem.masterColumns);
  merge(loc.boards,rem.boards);
  merge(loc.stars=loc.stars||[],rem.stars);
  merge(loc.goals,rem.goals);
  /* tasks resolve per-item: newer touch wins, regardless of which side is globally newer */
  {
    const m=new Map(loc.tasks.map((x,i)=>[x.id,i]));
    (rem.tasks||[]).forEach(x=>{
      if(buried(x))return;
      if(!m.has(x.id))loc.tasks.push(x);
      else{
        const i=m.get(x.id), l=loc.tasks[i];
        if((x.touchedAt||x.createdAt||0)>(l.touchedAt||l.createdAt||0))loc.tasks[i]=x;
      }
    });
  }
  merge(loc.priCols,rem.priCols);
  merge(loc.rewards=loc.rewards||[],rem.rewards);
  const em=new Map((loc.plan||[]).map(e=>[e.id,e]));
  (rem.plan||[]).forEach(e=>{
    if(buried(e))return;
    if(!em.has(e.id))loc.plan.push(e);
    else merge(em.get(e.id).items,e.items);
  });
  /* board columns live one level down and need the same protection */
  {
    const bm=new Map(loc.boards.map(b=>[b.id,b]));
    (rem.boards||[]).forEach(rb=>{
      const lb=bm.get(rb.id);
      if(lb&&rb.columns)merge(lb.columns,rb.columns);
    });
  }
  if(rem.gcal&&rem.gcal.length&&(preferRem||!(loc.gcal||[]).length))loc.gcal=rem.gcal;
  if(rem.claude){
    if(!loc.claude)loc.claude={notes:[],inbox:[]};
    const sticky=(la,ra,flag)=>{
      if(!ra)return;
      const m=new Map(la.map((x,i)=>[x.id,i]));
      ra.forEach(x=>{
        if(!m.has(x.id))la.push(x);
        else{const l=la[m.get(x.id)]; if(x[flag]&&!l[flag])l[flag]=x[flag];}
      });
    };
    sticky(loc.claude.notes=loc.claude.notes||[],rem.claude.notes,'resolved');
    sticky(loc.claude.inbox=loc.claude.inbox||[],rem.claude.inbox,'processed');
  }
  if(preferRem&&rem.meta.mission)loc.meta.mission=rem.meta.mission;
  /* a reset always travels, newest wins, whichever side is globally newer */
  if(rem.meta.reset&&(rem.meta.reset.at||0)>((loc.meta.reset&&loc.meta.reset.at)||0))
    loc.meta.reset=rem.meta.reset;
  return loc;
}
async function adoptNewer(){
  try{
    const f=await fileHandle.getFile(), txt=await f.text();
    lastMod=f.lastModified;
    if(txt.trim()){
      const data=JSON.parse(txt);
      if(data&&data.meta){
        S=mergeStates(S,data); ensureDefaults(); dedupeState();
        save(); render(); return;   // save() persists the merged whole to browser and file
      }
    }
  }catch(e){}
  writeToFile();
}
async function writeToFile(){
  if(!fileHandle)return;
  try{
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(S,null,2)); await w.close();
    lastMod=Date.now();
  }catch(e){}
}
/* live sync — notice outside edits to the file within seconds */
let lastMod=0;
async function pollFile(){
  if(!fileHandle)return;
  try{
    const f=await fileHandle.getFile();
    if(f.lastModified<=lastMod)return;
    lastMod=f.lastModified;
    const txt=await f.text(); if(!txt.trim())return;
    const data=JSON.parse(txt);
    if(data&&data.meta){
      const before=JSON.stringify(S);
      S=mergeStates(S,data);ensureDefaults();dedupeState();
      if(JSON.stringify(S)!==before){
        store.set(KEY,JSON.stringify(S));render();
      }
    }
  }catch(e){}
}
setInterval(pollFile,4000);
function scheduleWrite(){if(!fileHandle)return;clearTimeout(wTimer);wTimer=setTimeout(writeToFile,400);}
function updateFileStatus(){
  const el=$('fileLink'), bn=$('syncBanner'); if(!el||!FS_OK)return;
  if(fileHandle){
    el.innerHTML='· shared file: '+esc(fileHandle.name)+' ✓ · live sync on';
    if(bn)bn.innerHTML='';
  }else if(pendingHandle){
    el.innerHTML='· <button onclick="reconnectFile()">Reconnect shared file</button>';
    if(bn)bn.innerHTML=`<div class="sync-banner">
      <span>Your shared data file is disconnected — the browser asks again after a restart. One click brings in the latest (including anything Claude added).</span>
      <button class="btn-ink" onclick="reconnectFile()">Reconnect</button></div>`;
  }else{
    el.innerHTML='· <button onclick="linkDataFile()" title="Mirror your data into a real file that Claude can also read and edit">Link shared data file</button>';
    if(bn)bn.innerHTML='';
  }
}
(async()=>{
  if(!FS_OK)return;
  try{
    const h=await idbGet('handle');
    if(h){
      const q=await h.queryPermission({mode:'readwrite'});
      if(q==='granted'){fileHandle=h;await adoptNewer();}
      else pendingHandle=h;
    }
  }catch(e){}
  updateFileStatus();
})();

/* ============ dedupe — heal double imports from divergent copies ============ */
function dedupeState(){
  /* only an objective steers by a star — a key result belongs to its objective */
  S.goals.forEach(g=>{if(g.parentId&&g.starId)g.starId=null;});
  const low=s=>(s||'').trim().toLowerCase();
  { /* master columns by name */
    const seen={};
    S.masterColumns=S.masterColumns.filter(c=>{
      const k=low(c.name);
      if(seen[k]){S.boards.forEach(b=>{if(b.masterCol===c.id)b.masterCol=seen[k].id;});return false;}
      seen[k]=c;return true;
    });
  }
  { /* boards by name — merge columns by name, re-point tasks */
    const seen={},removed=[];
    S.boards=S.boards.filter(b=>{
      const k=low(b.name);
      if(!seen[k]){seen[k]=b;return true;}
      removed.push([b,seen[k]]);return false;
    });
    removed.forEach(([dup,keep])=>{
      dup.columns.forEach(dc=>{
        let kc=keep.columns.find(c=>low(c.name)===low(dc.name));
        if(!kc){keep.columns.push(dc);kc=dc;}
        if(dc.kind==='routine')kc.kind='routine';
        S.tasks.forEach(t=>{if(t.boardId===dup.id&&t.colId===dc.id)t.colId=kc.id;});
      });
      S.tasks.forEach(t=>{if(t.boardId===dup.id)t.boardId=keep.id;});
    });
  }
  { /* a goal that shares a north star's name is a migration artifact — the star already exists */
    const starNames=new Set((S.stars||[]).map(s=>low(s.title)));
    S.goals.filter(g=>!g.parentId&&starNames.has(low(g.title))&&
        !S.tasks.some(t=>t.goalId===g.id)&&!S.goals.some(x=>x.parentId===g.id))
      .forEach(g=>{S.goals=S.goals.filter(x=>x.id!==g.id);});
  }
  { /* goals by title — keep the richer twin */
    const rich=g=>(g.era?2:0)+(g.starId?2:0)
      +S.goals.filter(x=>x.parentId===g.id).length*3
      +S.tasks.filter(t=>t.goalId===g.id).length;
    const seen={};
    S.goals=S.goals.filter(g=>{
      const k=(g.parentId?'s|'+g.parentId+'|':'g|')+low(g.title);
      const prev=seen[k];
      if(!prev){seen[k]=g;return true;}
      const keep=rich(g)>rich(prev)?g:prev, drop=keep===g?prev:g;
      S.tasks.forEach(t=>{if(t.goalId===drop.id)t.goalId=keep.id;});
      S.goals.forEach(x=>{if(x.parentId===drop.id)x.parentId=keep.id;});
      if(keep===g){                       // swap the survivor into the map
        seen[k]=g;
        S.goals=S.goals.filter(x=>x.id!==prev.id);
        return true;
      }
      return false;
    });
  }
  /* chapters carry time only; north-star chapters are obsolete */
  if(S.meta&&S.meta.planGoals){
    S.plan=(S.plan||[]).filter(e=>!/north star/i.test(e.era));
    S.plan.forEach(e=>{e.items=[];});
  }
  { /* priority columns by name */
    const seen={};
    S.priCols=S.priCols.filter(c=>{
      const k=low(c.name);
      if(seen[k]){S.tasks.forEach(t=>{if(t.priCol===c.id)t.priCol=seen[k].id;});return false;}
      seen[k]=c;return true;
    });
  }
  { /* plan eras by name; items by text */
    const seen={};
    S.plan=S.plan.filter(e=>{
      const k=low(e.era);
      if(seen[k]){
        e.items.forEach(it=>{if(!seen[k].items.some(x=>low(x.text)===low(it.text)))seen[k].items.push(it);});
        return false;
      }
      seen[k]=e;return true;
    });
    S.plan.forEach(e=>{
      const s={};
      e.items=e.items.filter(it=>{const k=low(it.text);if(s[k])return false;s[k]=1;return true;});
    });
  }
  { /* tasks: same board + same title → keep the richer/newer one */
    const score=t=>(t.touchedAt||0)+(t.completedAt||0)+(t.createdAt||0)/1e6
      +(t.urgent?1:0)+(t.progress!=null?1:0)+(t.due?1:0)+(t.note?1:0)+(t.done?1:0);
    const seen={};
    S.tasks=S.tasks.filter(t=>{
      const k=t.boardId+'|'+low(t.title);
      const prev=seen[k];
      if(!prev){seen[k]=t;return true;}
      if(score(t)>score(prev)){
        Object.keys(prev).forEach(key=>delete prev[key]);
        Object.assign(prev,t);
      }
      return false;
    });
  }
}

/* ============ github sync — one private repo, every device ============ */
const GH={cfg:null,sha:null,busy:false,timer:null,poll:null};
try{GH.cfg=JSON.parse(store.get('atelier.sync'));}catch(e){}
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
const ghHeaders=()=>({'Authorization':'Bearer '+GH.cfg.token,'Accept':'application/vnd.github+json'});
const ghUrl=()=>'https://api.github.com/repos/'+GH.cfg.user+'/atelier-data/contents/data.json';
function ghStatus(s){
  const el=$('ghLink');
  if(el&&GH.cfg)el.innerHTML='· GitHub sync '+esc(s)+' <button class="btn-ghost" style="padding:2px 6px" onclick="ghDisconnect()" title="Disconnect this device">×</button>';
}
async function ghPull(quiet){
  if(!GH.cfg)return;
  try{
    const r=await ghFetch(ghUrl()+'?ref=main&_='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
    if(r.status===404){GH.sha=null;await ghPush();return;}   // empty repo: seed it with current state
    if(!r.ok)throw 0;
    const j=await r.json();
    if(j.sha===GH.sha){ghStatus('✓');return;}
    GH.sha=j.sha;
    const data=JSON.parse(b64d((j.content||'').replace(/\n/g,'')));
    if(data&&data.meta){
      const before=JSON.stringify(S);
      S=mergeStates(S,data);ensureDefaults();dedupeState();
      if(JSON.stringify(S)!==before){store.set(KEY,JSON.stringify(S));render();}
    }
    ghStatus('✓');
  }catch(e){if(!quiet)ghStatus('offline');}
}
function ghSchedulePush(){if(!GH.cfg)return;clearTimeout(GH.timer);GH.timer=setTimeout(ghPush,1500);}
function ghFetch(url,opts){
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;
  const t=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},12000);
  return fetch(url,Object.assign({},opts,ctl?{signal:ctl.signal}:{})).finally(()=>clearTimeout(t));
}
async function ghPush(){
  if(!GH.cfg||GH.busy)return;GH.busy=true;
  try{
    const body={message:'atelier sync',content:b64e(JSON.stringify(S,null,1)),branch:'main'};
    if(GH.sha)body.sha=GH.sha;
    const r=await ghFetch(ghUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
    if(r.ok){const j=await r.json();GH.sha=j.content.sha;ghStatus('✓');}
    else if(r.status===409||r.status===422){   // someone else pushed first: take theirs, merge, retry
      GH.busy=false;GH.sha=null;await ghPull(true);ghSchedulePush();return;
    }else ghStatus('error '+r.status);
  }catch(e){ghStatus('offline')}
  GH.busy=false;
}
function ghStartPolling(){clearInterval(GH.poll);GH.poll=setInterval(()=>ghPull(true),20000);}
function ghConnect(){
  const user=prompt('Your GitHub username:',GH.cfg?GH.cfg.user:'alexandrapaiz');
  if(!user||!user.trim())return;
  const token=prompt('Paste your GitHub token (github_pat_…):','');
  if(!token||!token.trim())return;
  GH.cfg={user:user.trim(),token:token.trim()};
  store.set('atelier.sync',JSON.stringify(GH.cfg));
  ghStatus('connecting…');ghPull();ghStartPolling();
}
function ghDisconnect(){
  GH.cfg=null;GH.sha=null;clearInterval(GH.poll);
  store.set('atelier.sync','null');updateGhLink();
}
function updateGhLink(){
  const el=$('ghLink');if(!el)return;
  if(GH.cfg){ghStatus('✓');}
  else el.innerHTML='· <button onclick="ghConnect()" title="Sync across your devices via your private GitHub repo">Connect GitHub sync</button>';
}

/* ============ init ============ */
absorbEmbedded();
dedupeState();
restoreRoute();
render();
updateGhLink();
if(GH.cfg){ghPull();ghStartPolling();}
if(window.matchMedia)matchMedia('(max-width:700px)').addEventListener('change',()=>render());
themeApply(document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light');
</script>
