function dragPlan(ev,id){drag={type:'plan',id};ev.target.classList.add('dragging');ev.dataTransfer.effectAllowed='move';}
function dropPlan(ev,eraId){
  ev.preventDefault();ev.currentTarget.classList.remove('drag-over-col');
  if(!drag||drag.type!=='plan')return;
  const f=planFind(drag.id); if(!f)return;
  f.era.items=f.era.items.filter(i=>i.id!==f.it.id);
  const dst=S.plan.find(e=>e.id===eraId);
  const overItem=ev.target.closest('.plan-item');
  if(overItem&&overItem.dataset.pid!==f.it.id){
    const i=dst.items.findIndex(x=>x.id===overItem.dataset.pid);
    dst.items.splice(i,0,f.it);
  }else dst.items.push(f.it);
  drag=null;render();
}

/* ============ autosave ============ */
/* Save on every keystroke: any text field with an onchange handler also
   commits on input, so nothing is lost if the tab closes mid-edit. */
document.addEventListener('input',e=>{
  const el=e.target;
  if(!(el instanceof HTMLElement))return;
  if(el.tagName==='TEXTAREA')return;                   /* prose commits on blur — running the title
      parser per keystroke ate trailing spaces and ! the instant they were typed */
  if(el.classList.contains('ghost-new'))return;        // quick-add commits on Enter/blur only
  if(el.matches('input[type=date],input[type=time],input[type=range],select'))return; // these fire change natively / handle input themselves
  if(el.getAttribute('onchange'))el.dispatchEvent(new Event('change'));
});
function themeApply(t){

  else document.documentElement.removeAttribute('data-theme');

/* ============ shared data file ============
   Mirrors all data into a real .json file on disk (in addition to browser
   storage), so Claude — or any other tool — can read and edit the same
   data. On open, whichever copy is newer wins. Chrome/Edge/Arc only. */
const FS_OK='showSaveFilePicker' in window;
let fileHandle=null, pendingHandle=null, wTimer=null;
function idbOpen(){return new Promise((res,rej)=>{
  const r=indexedDB.open('atelier-fs',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idbOpen();return new Promise((res,rej)=>{
  const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);
  tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function idbGet(k){const db=await idbOpen();return new Promise((res,rej)=>{
  const rq=db.transaction('kv').objectStore('kv').get(k);
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function linkDataFile(){
  try{
    fileHandle=await showSaveFilePicker({suggestedName:'atelier-data.json',
      types:[{description:'Atelier data',accept:{'application/json':['.json']}}]});
    await idbSet('handle',fileHandle);
    await adoptNewer(); updateFileStatus();
  }catch(e){/* user cancelled */}
}
async function reconnectFile(){
  if(!pendingHandle)return;
  try{
    if(await pendingHandle.requestPermission({mode:'readwrite'})!=='granted')return;
    fileHandle=pendingHandle; pendingHandle=null;
    await adoptNewer(); updateFileStatus();
  }catch(e){}
}
/* Merge, never clobber: entities that exist on only one side are kept;
   for entities on both sides, the side with the newer overall stamp wins. */
function mergeStates(loc,rem){
  if(!rem||!rem.meta)return loc;
  const preferRem=(rem.meta.updatedAt||0)>(loc.meta.updatedAt||0);
  /* graves first — every side's deletions, newest wins, before anything is let back in */
  loc.meta.tomb=loc.meta.tomb||{};
  if(rem.meta.tomb)Object.keys(rem.meta.tomb).forEach(k=>{
    if(!loc.meta.tomb[k]||rem.meta.tomb[k]>loc.meta.tomb[k])loc.meta.tomb[k]=rem.meta.tomb[k];
  });
  const tomb=loc.meta.tomb;
  const buried=x=>!!(x&&x.id&&tomb[x.id]);
  const merge=(la,ra)=>{
    if(!la||!ra)return la||ra||[];
    const m=new Map(la.map((x,i)=>[x.id,i]));
    ra.forEach(x=>{
      if(buried(x))return;                       // it was deleted on purpose; don't resurrect it
      if(!m.has(x.id))la.push(x);
      else if(preferRem)la[m.get(x.id)]=x;
    });
    return la;
  };
  /* per-item: the freshest touch wins, no matter which side's document is globally newer —
     a stale device editing one task must not drag the whole compass back with it */
  const mergeT=(la,ra)=>{
    if(!la||!ra)return la||ra||[];
    const m=new Map(la.map((x,i)=>[x.id,i]));
    ra.forEach(x=>{
      if(buried(x))return;
      if(!m.has(x.id)){la.push(x);return;}
      const i=m.get(x.id), l=la[i];
      const xs=x.touchedAt||x.createdAt||0, ls=l.touchedAt||l.createdAt||0;
      if(xs>ls||(xs===ls&&preferRem))la[i]=x;
    });
    return la;
  };
  mergeT(loc.masterColumns,rem.masterColumns);
  mergeT(loc.boards,rem.boards);
  mergeT(loc.stars=loc.stars||[],rem.stars);
  mergeT(loc.goals,rem.goals);
  merge(loc.imports=loc.imports||[],rem.imports);   // the tray travels too; resolved items stay buried
  /* tasks resolve per-item: newer touch wins, regardless of which side is globally newer */
  {
    const m=new Map(loc.tasks.map((x,i)=>[x.id,i]));
    (rem.tasks||[]).forEach(x=>{
      if(buried(x))return;
      if(!m.has(x.id))loc.tasks.push(x);
      else{
        const i=m.get(x.id), l=loc.tasks[i];
        if((x.touchedAt||x.createdAt||0)>(l.touchedAt||l.createdAt||0))loc.tasks[i]=x;
      }
    });
  }
  merge(loc.priCols,rem.priCols);
  merge(loc.rewards=loc.rewards||[],rem.rewards);
  const em=new Map((loc.plan||[]).map(e=>[e.id,e]));
  (rem.plan||[]).forEach(e=>{
    if(buried(e))return;
    if(!em.has(e.id)){loc.plan.push(e);return;}
    const le=em.get(e.id);
    if((e.touchedAt||0)>(le.touchedAt||0)||(!le.touchedAt&&!e.touchedAt&&preferRem))le.era=e.era;
    if((e.touchedAt||0)>(le.touchedAt||0))le.touchedAt=e.touchedAt;
    merge(le.items,e.items);
  });
  /* board columns live one level down: the winning board keeps its columns,
     but columns born on the other side are still let in */
  {
    const bm=new Map(loc.boards.map(b=>[b.id,b]));
    (rem.boards||[]).forEach(rb=>{
      const lb=bm.get(rb.id);
      if(lb&&rb.columns)rb.columns.forEach(c=>{
        if(!buried(c)&&!lb.columns.some(x=>x.id===c.id))lb.columns.push(c);
      });
    });
  }
  if(rem.gcal&&rem.gcal.length&&(preferRem||!(loc.gcal||[]).length))loc.gcal=rem.gcal;
  if(rem.claude){
    if(!loc.claude)loc.claude={notes:[],inbox:[]};
    const sticky=(la,ra,flag)=>{
      if(!ra)return;
      const m=new Map(la.map((x,i)=>[x.id,i]));
      ra.forEach(x=>{
        if(!m.has(x.id))la.push(x);
        else{const l=la[m.get(x.id)]; if(x[flag]&&!l[flag])l[flag]=x[flag];}
      });
    };
    sticky(loc.claude.notes=loc.claude.notes||[],rem.claude.notes,'resolved');
    sticky(loc.claude.inbox=loc.claude.inbox||[],rem.claude.inbox,'processed');
  }
  if(preferRem&&rem.meta.mission)loc.meta.mission=rem.meta.mission;
  /* a reset always travels, newest wins, whichever side is globally newer */
  if(rem.meta.reset&&(rem.meta.reset.at||0)>((loc.meta.reset&&loc.meta.reset.at)||0))
    loc.meta.reset=rem.meta.reset;
  resigAll(loc);   // merged-in objects are not local edits
  return loc;
}
async function adoptNewer(){
  try{
    const f=await fileHandle.getFile(), txt=await f.text();
    lastMod=f.lastModified;
    if(txt.trim()){
      const data=JSON.parse(txt);
      if(data&&data.meta){
        S=mergeStates(S,data); ensureDefaults(); dedupeState();
        save(); render(); return;   // save() persists the merged whole to browser and file
      }
    }
  }catch(e){}
  writeToFile();
}
async function writeToFile(){
  if(!fileHandle)return;
  try{
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(S,null,2)); await w.close();
    lastMod=Date.now();
  }catch(e){}
}
/* live sync — notice outside edits to the file within seconds */
let lastMod=0;
async function pollFile(){
  if(!fileHandle)return;
  try{
    const f=await fileHandle.getFile();
    if(f.lastModified<=lastMod)return;
    lastMod=f.lastModified;
    const txt=await f.text(); if(!txt.trim())return;
    const data=JSON.parse(txt);
    if(data&&data.meta){
      const before=JSON.stringify(S);
      S=mergeStates(S,data);ensureDefaults();dedupeState();
      if(JSON.stringify(S)!==before){
        store.set(KEY,JSON.stringify(S));softRender();
      }
    }
  }catch(e){}
}
function scheduleWrite(){if(!fileHandle)return;clearTimeout(wTimer);wTimer=setTimeout(writeToFile,400);}
function updateFileStatus(){
  const el=$('fileLink'), bn=$('syncBanner'); if(!el||!FS_OK)return;

/* retired: the shared-file mirror no longer auto-connects — the database is the
   source of truth. The machinery stays for manual/legacy use but never runs. */

/* ============ dedupe — heal double imports from divergent copies ============ */
function dedupeState(){
  /* only an objective steers by a star — a key result belongs to its objective */
  S.goals.forEach(g=>{if(g.parentId&&g.starId)g.starId=null;});
  const low=s=>(s||'').trim().toLowerCase();
  { /* master columns by name */
    const seen={};
    S.masterColumns=S.masterColumns.filter(c=>{
      const k=low(c.name);
      if(seen[k]){S.boards.forEach(b=>{if(b.masterCol===c.id)b.masterCol=seen[k].id;});return false;}
      seen[k]=c;return true;
    });
  }
  { /* boards by name — merge columns by name, re-point tasks */
    const seen={},removed=[];
    S.boards=S.boards.filter(b=>{
      const k=low(b.name);
      if(!seen[k]){seen[k]=b;return true;}
      removed.push([b,seen[k]]);return false;
    });
    removed.forEach(([dup,keep])=>{
      dup.columns.forEach(dc=>{
        let kc=keep.columns.find(c=>low(c.name)===low(dc.name));
        if(!kc){keep.columns.push(dc);kc=dc;}
        if(dc.kind==='routine')kc.kind='routine';
        S.tasks.forEach(t=>{if(t.boardId===dup.id&&t.colId===dc.id)t.colId=kc.id;});
      });
      S.tasks.forEach(t=>{if(t.boardId===dup.id)t.boardId=keep.id;});
    });
  }
  { /* a goal that shares a north star's name is a migration artifact — the star already exists */
    const starNames=new Set((S.stars||[]).map(s=>low(s.title)));
    S.goals.filter(g=>!g.parentId&&starNames.has(low(g.title))&&
        !S.tasks.some(t=>t.goalId===g.id)&&!S.goals.some(x=>x.parentId===g.id))
      .forEach(g=>{S.goals=S.goals.filter(x=>x.id!==g.id);});
  }
  { /* goals by title — keep the richer twin */
    const rich=g=>(g.era?2:0)+(g.starId?2:0)
      +S.goals.filter(x=>x.parentId===g.id).length*3
      +S.tasks.filter(t=>t.goalId===g.id).length;
    const seen={};
    S.goals=S.goals.filter(g=>{
      const k=(g.parentId?'s|'+g.parentId+'|':'g|')+low(g.title);
      const prev=seen[k];
      if(!prev){seen[k]=g;return true;}
      const keep=rich(g)>rich(prev)?g:prev, drop=keep===g?prev:g;
      S.tasks.forEach(t=>{if(t.goalId===drop.id)t.goalId=keep.id;});
      S.goals.forEach(x=>{if(x.parentId===drop.id)x.parentId=keep.id;});
      if(keep===g){                       // swap the survivor into the map
        seen[k]=g;
        S.goals=S.goals.filter(x=>x.id!==prev.id);
        return true;
      }
      return false;
    });
  }
  /* chapters carry time only; north-star chapters are obsolete */
  if(S.meta&&S.meta.planGoals){
    S.plan=(S.plan||[]).filter(e=>!/north star/i.test(e.era));
    S.plan.forEach(e=>{e.items=[];});
  }
  { /* priority columns by name */
    const seen={};
    S.priCols=S.priCols.filter(c=>{
      const k=low(c.name);
      if(seen[k]){S.tasks.forEach(t=>{if(t.priCol===c.id)t.priCol=seen[k].id;});return false;}
      seen[k]=c;return true;
    });
  }
  { /* plan eras by name; items by text */
    const seen={};
    S.plan=S.plan.filter(e=>{
      const k=low(e.era);
      if(seen[k]){
        e.items.forEach(it=>{if(!seen[k].items.some(x=>low(x.text)===low(it.text)))seen[k].items.push(it);});
        return false;
      }
      seen[k]=e;return true;
    });
    S.plan.forEach(e=>{
      const s={};
      e.items=e.items.filter(it=>{const k=low(it.text);if(s[k])return false;s[k]=1;return true;});
    });
  }
  { /* tasks: same board + same title → keep the richer/newer one */
    const score=t=>(t.touchedAt||0)+(t.completedAt||0)+(t.createdAt||0)/1e6
      +(t.urgent?1:0)+(t.progress!=null?1:0)+(t.due?1:0)+(t.note?1:0)+(t.done?1:0);
    const seen={};
    S.tasks=S.tasks.filter(t=>{
      const k=t.boardId+'|'+low(t.title);
      const prev=seen[k];
      if(!prev){seen[k]=t;return true;}
      if(score(t)>score(prev)){
        Object.keys(prev).forEach(key=>delete prev[key]);
        Object.assign(prev,t);
      }
      return false;
    });
  }
}

/* ============ github sync — one private repo, every device ============ */
const GH={cfg:null,sha:null,busy:false,timer:null,poll:null};
try{GH.cfg=JSON.parse(store.get('atelier.sync'));}catch(e){}
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
const ghHeaders=()=>({'Authorization':'Bearer '+GH.cfg.token,'Accept':'application/vnd.github+json'});
const ghUrl=()=>'https://api.github.com/repos/'+GH.cfg.user+'/atelier-data/contents/data.json';
function ghStatus(s){
  const el=$('ghLink');
  if(el&&GH.cfg)el.innerHTML='· GitHub sync '+esc(s)+' <button class="btn-ghost" style="padding:2px 6px" onclick="ghDisconnect()" title="Disconnect this device">×</button>';
}
async function ghPull(quiet){
  if(!GH.cfg)return;
  try{
    const r=await ghFetch(ghUrl()+'?ref=main&_='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
    if(r.status===404){GH.sha=null;await ghPush();return;}   // empty repo: seed it with current state
    if(!r.ok)throw 0;
    const j=await r.json();
    if(j.sha===GH.sha){ghStatus('✓');return;}
    GH.sha=j.sha;
    const data=JSON.parse(b64d((j.content||'').replace(/\n/g,'')));
    if(data&&data.meta){
      const before=JSON.stringify(S);
      S=mergeStates(S,data);ensureDefaults();dedupeState();
      if(JSON.stringify(S)!==before){store.set(KEY,JSON.stringify(S));softRender();}
    }
    ghStatus('✓');
  }catch(e){if(!quiet)ghStatus('offline');}
}
function ghSchedulePush(){if(!GH.cfg)return;clearTimeout(GH.timer);GH.timer=setTimeout(ghPush,1500);}
function ghFetch(url,opts){
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;
  const t=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},12000);
  return fetch(url,Object.assign({},opts,ctl?{signal:ctl.signal}:{})).finally(()=>clearTimeout(t));
}
async function ghPush(){
  if(!GH.cfg||GH.busy)return;GH.busy=true;
  try{
    const body={message:'atelier sync',content:b64e(JSON.stringify(S,null,1)),branch:'main'};
    if(GH.sha)body.sha=GH.sha;
    const r=await ghFetch(ghUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)});
    if(r.ok){const j=await r.json();GH.sha=j.content.sha;ghStatus('✓');}
    else if(r.status===409||r.status===422){   // someone else pushed first: take theirs, merge, retry
      GH.busy=false;GH.sha=null;await ghPull(true);ghSchedulePush();return;
    }else ghStatus('error '+r.status);
  }catch(e){ghStatus('offline')}
  GH.busy=false;
}
function ghStartPolling(){clearInterval(GH.poll);GH.poll=setInterval(()=>ghPull(true),20000);}
function ghConnect(){
  const user=prompt('Your GitHub username:',GH.cfg?GH.cfg.user:'alexandrapaiz');
  if(!user||!user.trim())return;
  const token=prompt('Paste your GitHub token (github_pat_…):','');
  if(!token||!token.trim())return;
  GH.cfg={user:user.trim(),token:token.trim()};
  store.set('atelier.sync',JSON.stringify(GH.cfg));
  ghStatus('connecting…');ghPull();ghStartPolling();
}
function ghDisconnect(){
  GH.cfg=null;GH.sha=null;clearInterval(GH.poll);
  store.set('atelier.sync','null');updateGhLink();
}
function updateGhLink(){
  const el=$('ghLink');if(!el)return;
  if(GH.cfg){ghStatus('✓');}
  else el.innerHTML='· <button onclick="ghConnect()" title="Sync across your devices via your private GitHub repo">Connect GitHub sync</button>';
}

/* ============ supabase sync — one row in your own database, every device ============ */

   guarded by row-level security. Every device merges through the same mergeStates /
   tombstone machinery the file and GitHub channels use, so nothing resurrects and
   nothing is lost. Realtime pushes edits to other open devices within seconds. */

  /* auto-connect: the database is part of the app, not an option */
  if(!SB.cfg)SB.cfg={url:SB_FIXED.url,key:SB_FIXED.key,email:''};
  SB.cfg.url=SB_FIXED.url;SB.cfg.key=SB_FIXED.key;   // config travels with the build, only the email is remembered
  sbStatus('');
  try{
    const {createClient}=await sbLib();
    SB.client=createClient(SB.cfg.url,SB.cfg.key,{auth:{storageKey:'atelier.auth'}});
    SB.client.auth.onAuthStateChange((ev)=>{
      if(ev==='SIGNED_OUT'){SB.user=null;clearInterval(SB.poll);sbStatus('');}
    });
    const {data:{session}}=await SB.client.auth.getSession();
    if(session){SB.user=session.user;sbStart();}
    else sbStatus('');
  }catch(e){sbStatus('offline');}
}
function sbSignIn(){
  if(!SB.client||document.getElementById('sbModal'))return;
  const d=document.createElement('div');d.id='sbModal';
  d.innerHTML='<div class="sb-scrim" onclick="sbModalClose()"></div><div class="sb-card">'+
    '<h3>Sign in to your database</h3>'+
    '<input id="sbEmail" type="email" autocomplete="email" placeholder="email" value="'+esc((SB.cfg&&SB.cfg.email)||'')+'">'+
    '<input id="sbPass" type="password" autocomplete="current-password" placeholder="password">'+
    '<p class="sb-hint">First time here? The same form creates your account.</p>'+
    '<p id="sbMsg"></p>'+
    '<div class="sb-row"><button class="no" onclick="sbModalClose()">Cancel</button>'+
    '<button class="go" onclick="sbModalGo()">Sign in</button></div></div>';
  document.body.appendChild(d);
  d.querySelector('#sbPass').addEventListener('keydown',e=>{if(e.key==='Enter')sbModalGo();});
  d.querySelector(SB.cfg&&SB.cfg.email?'#sbPass':'#sbEmail').focus();
}
function sbModalClose(){const d=document.getElementById('sbModal');if(d)d.remove();}
async function sbModalGo(){
  const email=(document.getElementById('sbEmail').value||'').trim();
  const pass=document.getElementById('sbPass').value||'';
  const msg=document.getElementById('sbMsg');
  if(!email||!pass){msg.textContent='Email and password, both.';return;}
  msg.style.color='';msg.textContent='Signing in…';
  let r=await SB.client.auth.signInWithPassword({email,password:pass});
  if(r.error&&/invalid login credentials/i.test(r.error.message)){
    /* no such account yet — the same form doubles as sign-up, once */
    const s=await SB.client.auth.signUp({email,password:pass});
    if(s.error){msg.textContent=s.error.message;return;}
    if(!s.data.session){msg.textContent='Account created — confirm it from your email, then sign in again. (Or that password was wrong.)';return;}
    r=s;
  }else if(r.error){msg.textContent=r.error.message;return;}
  SB.cfg.email=email;store.set('atelier.db',JSON.stringify(SB.cfg));
  SB.user=r.data.user;
  sbModalClose();sbStart();
}
function sbStart(){
  sbStatus('✓');
  sbPull();
  clearInterval(SB.poll);SB.poll=setInterval(()=>sbPull(true),25000);   // realtime does the work; this is the safety net
  sbRealtime();
}
function sbAbsorb(doc){
  if(!(doc&&doc.meta))return;
  const before=JSON.stringify(S);
  S=mergeStates(S,doc);ensureDefaults();dedupeState();
  if(JSON.stringify(S)!==before){store.set(KEY,JSON.stringify(S));softRender();}
}
async function sbPull(quiet){
  if(!SB.client||!SB.user)return;
  try{
    const {data,error}=await SB.client.from('atelier_state')
      .select('doc,updated_at').eq('user_id',SB.user.id).maybeSingle();
    if(error)throw error;
    if(!data){await sbPush();return;}   // first device seeds the database with what it has
    SB.srv=data.updated_at;
    sbAbsorb(data.doc);
    sbStatus('✓');
  }catch(e){if(!quiet)sbStatus('offline');}
}
function sbSchedulePush(){if(!SB.client||!SB.user)return;clearTimeout(SB.timer);SB.timer=setTimeout(sbPush,1200);}
/* Optimistic concurrency: a push only lands if nobody (another device, Claude
   through the MCP server) wrote since we last read. If someone did, take their
   copy in through the merge, then push the combined whole. Nothing gets clobbered. */
async function sbPush(){
  if(!SB.client||!SB.user||SB.busy)return;SB.busy=true;
  try{
    const stamp=new Date().toISOString();
    if(SB.srv){
      const {data,error}=await SB.client.from('atelier_state')
        .update({doc:S,updated_at:stamp})
        .eq('user_id',SB.user.id).eq('updated_at',SB.srv).select('updated_at');
      if(error)throw error;
      if(!data.length){SB.busy=false;await sbPull(true);sbSchedulePush();return;}
      SB.srv=data[0].updated_at;
    }else{
      const {data,error}=await SB.client.from('atelier_state')
        .upsert({user_id:SB.user.id,doc:S,updated_at:stamp},{onConflict:'user_id'})
        .select('updated_at').single();
      if(error)throw error;
      SB.srv=data.updated_at;
    }
    sbStatus('✓');
  }catch(e){sbStatus('offline');}
  SB.busy=false;
}
function sbRealtime(){
  if(SB.chan)try{SB.client.removeChannel(SB.chan);}catch(e){}
  SB.chan=SB.client.channel('atelier-state')
    .on('postgres_changes',
      {event:'*',schema:'public',table:'atelier_state',filter:'user_id=eq.'+SB.user.id},
      p=>{if(p.new&&p.new.doc){SB.srv=p.new.updated_at||SB.srv;sbAbsorb(p.new.doc);}})
    .subscribe();
}
function sbSignOut(){
  if(SB.chan&&SB.client)try{SB.client.removeChannel(SB.chan);}catch(e){}
  SB.chan=null;clearInterval(SB.poll);clearTimeout(SB.timer);
  try{if(SB.client)SB.client.auth.signOut();}catch(e){}
  SB.user=null;sbStatus('');
}

/* ============ google calendar — direct, no intermediary ============
   The app itself holds a Google sign-in (OAuth token client) and writes
   dated tasks straight onto the calendar. The one-time setup is a Google
   OAuth Client ID, kept in the document so it travels to every device. */
const GC={token:null,exp:0,busy:false,note:''};
function gcalCfg(){if(!S.meta.ints)S.meta.ints={gcal:{}};if(!S.meta.ints.gcal)S.meta.ints.gcal={};return S.meta.ints.gcal;}
function gcalLib(){return new Promise((res,rej)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2)return res();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';
  s.onload=()=>res();s.onerror=()=>rej(new Error('could not load Google sign-in'));
  document.head.appendChild(s);});}
async function gcalToken(){
  const cfg=gcalCfg();
  if(!cfg.clientId)throw new Error('add your Google Client ID first');
  if(GC.token&&Date.now()<GC.exp-60000)return GC.token;
  await gcalLib();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id:cfg.clientId,
      scope:'https://www.googleapis.com/auth/calendar.events',
      callback:t=>{
        if(t&&t.access_token){GC.token=t.access_token;GC.exp=Date.now()+(+t.expires_in||3600)*1000;store.set('atelier.gcal.ok','1');res(GC.token);}
        else rej(new Error((t&&t.error)||'Google did not hand back access'));
      },
      error_callback:e=>rej(new Error((e&&e.type)||'sign-in window closed'))
    });
    tc.requestAccessToken({prompt:''});   // silent when already granted; Google shows its window only when needed
  });
}
function gcalEvent(t){
  const b=board(t.boardId);
  const ev={summary:t.title,
    description:(t.note?t.note+'\n\n':'')+'From Atelier · '+(b?b.name:'')};
  if(t.start){
    ev.start={dateTime:t.due+'T'+t.start+':00',timeZone:'America/Guatemala'};
    ev.end={dateTime:t.due+'T'+endOf(t)+':00',timeZone:'America/Guatemala'};
  }else{
    const p=n=>String(n).padStart(2,'0');
    const x=new Date(t.due+'T12:00:00');x.setDate(x.getDate()+1);
    ev.start={date:t.due};
    ev.end={date:x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())};
  }
  return ev;
}
function gcalNote(msg){GC.note=msg;const el=$('intsGcalNote');if(el)el.textContent=msg;}
async function gcalSyncNow(auto){
  if(GC.busy||!gcalCfg().clientId)return;
  /* auto attempts may never summon Google's window: they need a grant this browser
     has already given, and one failure quiets them until a manual Sync succeeds */
  if(auto&&(!store.get('atelier.gcal.ok')||GC.autoHold))return;
  if(auto&&!syncQueue().length)return;
  GC.busy=true;
  if(!auto){gcalNote('Syncing…');render();}
  try{
    const tok=await gcalToken();
    const base='https://www.googleapis.com/calendar/v3/calendars/primary/events';
    const hdrs={'Authorization':'Bearer '+tok,'Content-Type':'application/json'};
    const list=syncQueue();let n=0;
    for(const t of list){
      const real=t.gcalId&&!/^ics-/.test(t.gcalId);
      let r=await fetch(real?base+'/'+encodeURIComponent(t.gcalId):base,
        {method:real?'PATCH':'POST',headers:hdrs,body:JSON.stringify(gcalEvent(t))});
      if(real&&(r.status===404||r.status===410))   // its event was deleted over there — make a fresh one
        r=await fetch(base,{method:'POST',headers:hdrs,body:JSON.stringify(gcalEvent(t))});
      if(!r.ok)throw new Error('Google said '+r.status);
      const j=await r.json();
      t.gcalId=j.id;t.gcalSyncAt=Date.now();n++;
    }
    save();
    if(!auto)window.calSynced=n;
    gcalNote(n?('Synced '+n+' ✓'):'Everything already on your calendar ✓');
    GC.busy=false;GC.autoHold=false;softRender();
  }catch(e){
    GC.busy=false;
    if(auto)GC.autoHold=true;   // stop retrying quietly; the manual Sync button clears this
    else{gcalNote('Could not sync — '+((e&&e.message)||'try again'));render();}
  }
}
/* automatic sync: a few seconds after any edit, plus a steady heartbeat while open */
function gcalScheduleAuto(){
  if(!gcalCfg().clientId)return;
  clearTimeout(GC.autoT);GC.autoT=setTimeout(()=>gcalSyncNow(true),4000);
}
setInterval(()=>gcalSyncNow(true),15*60*1000);
setTimeout(()=>gcalSyncNow(true),3000);
function atelierCalSync(){
  if(!gcalCfg().clientId){openInts();return;}
  gcalSyncNow();
}

/* ============ add a task straight from the calendar ============ */
function calAddPop(ev,ds,start){
  ev.stopPropagation();
  calAddClose();
  const boards=S.boards.filter(b=>b.columns.length);
  if(!boards.length)return;
  const last=store.get('atelier.addBoard');
  const sel=boards.map(b=>`<option value="${b.id}" ${b.id===last?'selected':''}>${esc(b.name)}</option>`).join('');
  const nice=new Date(ds+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const d=document.createElement('div');d.id='calAdd';d.className='cal-add';d.dataset.ds=ds;
  d.innerHTML=`
    <div class="ca-date">${nice}</div>
    <input id="caTitle" placeholder="What needs doing?" autocomplete="off"
      onkeydown="if(event.key==='Enter')calAddGo();else if(event.key==='Escape')calAddClose()">
    <div class="ca-row">
      <select id="caBoard" title="Which board it belongs to">${sel}</select>
      <input id="caTime" type="time" value="${start||''}" title="Time — optional">
    </div>
    <div class="ca-row end">
      <button class="ca-cancel" onclick="calAddClose()">Cancel</button>
      <button class="ca-go" onclick="calAddGo()">Add</button>
    </div>`;
  document.body.appendChild(d);
  const W=264,H=176;
  d.style.left=Math.max(10,Math.min(ev.clientX+8,innerWidth-W-12))+'px';
  d.style.top=Math.max(10,Math.min(ev.clientY+8,innerHeight-H-12))+'px';
  document.getElementById('caTitle').focus();
  setTimeout(()=>document.addEventListener('mousedown',calAddOutside),0);
}
function calAddOutside(e){const d=$('calAdd');if(d&&!d.contains(e.target))calAddClose();}
function calAddClose(){const d=$('calAdd');if(d)d.remove();document.removeEventListener('mousedown',calAddOutside);}
function calAddGo(){
  const d=$('calAdd');if(!d)return;
  let title=$('caTitle').value.trim();
  if(!title){$('caTitle').focus();return;}
  const p=nlParse(title); if(p.title)title=p.title;
  const bid=$('caBoard').value, b=board(bid);
  const col=b.columns.find(c=>c.kind!=='routine'&&!/^shelved$/i.test(String(c.name).trim()))||b.columns[0];
  const start=$('caTime').value||p.start||null;
  store.set('atelier.addBoard',bid);
  S.tasks.push({id:uid(),boardId:bid,colId:col.id,title,note:'',due:d.dataset.ds,start,end:p.end||null,
    urgent:p.urgent||undefined,done:false,goalId:null,createdAt:Date.now(),touchedAt:Date.now()});
  calAddClose();save();render();
}

restoreRoute();
/* stale builds cause ghost bugs (resurrected domains, dead keys) — so every copy checks
   for a newer self: a pill offers the refresh, and a hidden tab takes it silently */
let _newerBuild=false;
async function updateCheck(){
  try{
    const r=await fetch(location.pathname+'?uc='+Date.now(),{method:'HEAD',cache:'no-store'});
    const lm=r.headers.get('last-modified'); if(!lm)return;
    const mine=new Date(document.lastModified).getTime(), theirs=new Date(lm).getTime();
    if(theirs&&mine&&theirs-mine>60000&&!_newerBuild){
      _newerBuild=true;
      const p=document.createElement('button');
      p.id='updatePill'; p.textContent='A newer Atelier is ready — refresh';
      p.onclick=()=>location.reload();
      document.body.appendChild(p);
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&_newerBuild){
    const ae=document.activeElement;
    if(!(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')))location.reload();
  }
});
setTimeout(updateCheck,8000); setInterval(updateCheck,20*60*1000);
render();
sbInit();
if(window.matchMedia)matchMedia('(max-width:700px)').addEventListener('change',()=>render());
themeApply(document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light');
